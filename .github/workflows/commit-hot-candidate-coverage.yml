name: Commit hot candidate coverage evidence

on:
  pull_request:
    paths:
      - "vortex_runtime/candidate_coverage.py"
      - "scripts/run_hot_candidate_coverage.py"
      - "tests/test_candidate_coverage.py"
      - ".github/workflows/commit-hot-candidate-coverage.yml"

concurrency:
  group: commit-hot-candidate-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  measure-and-commit:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feat/architecture-gate0-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Check direct candidate input changes
        id: changes
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            vortex_runtime/candidate_coverage.py \
            scripts/run_hot_candidate_coverage.py \
            tests/test_candidate_coverage.py; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Latest commit does not change candidate experiment inputs."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Measure exact-token top-K coverage
        if: steps.changes.outputs.run == 'true'
        run: |
          python scripts/run_hot_candidate_coverage.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --build-new-tokens 1 \
            --max-rank 32 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output hot_candidate_coverage.json
      - name: Normalize evidence with provenance
        if: steps.changes.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("hot_candidate_coverage.json")
          raw_bytes = raw.read_bytes()
          source = json.loads(raw_bytes)
          first = source.get("first_divergence")
          first_rank = None if first is None else int(first["exact_token_rank"])
          top32 = float(source["coverage_at_k"]["32"])
          payload = {
              "evidence_level": source["evidence_level"],
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "head_sha": os.environ["HEAD_SHA"],
                  "raw_file_sha256": hashlib.sha256(raw_bytes).hexdigest(),
              },
              "model": source["model"],
              "device": source["device"],
              "dtype": source["dtype"],
              "managed_suffixes": source["managed_suffixes"],
              "matched_modules": source["matched_modules"],
              "max_rank": source["max_rank"],
              "prompt_tokens": source["prompt_tokens"],
              "evaluated_tokens": source["evaluated_tokens"],
              "same_context_contract": source["same_context_contract"],
              "exact_top1_match_rate": source["exact_top1_match_rate"],
              "coverage_at_k": source["coverage_at_k"],
              "rank_statistics": source["rank_statistics"],
              "first_divergence": first,
              "decision_rule": source["decision_rule"],
              "decision": source["decision"],
              "rejection_scope": (
                  "Reject the tested rank-32 O/down hot representation as the "
                  "basis of a small top-K uncertainty certificate. First-"
                  f"divergence rank was {first_rank}, top-32 coverage was "
                  f"{top32:.6f}, and exact-token mean rank was "
                  f"{float(source['rank_statistics']['mean']):.6f}."
              ),
              "next_candidate": (
                  "sweep the complete hot-traffic-feasible rank frontier "
                  "through rank 72"
              ),
          }
          output = Path("results/tinyllama_1_1b_hot_candidate_coverage.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          PY
      - name: Commit evidence when changed
        if: steps.changes.outputs.run == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- results/tinyllama_1_1b_hot_candidate_coverage.json)" ]; then
            echo "Candidate coverage evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tinyllama_1_1b_hot_candidate_coverage.json
          git commit -m "data(candidate): commit exact-token top-K coverage"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
