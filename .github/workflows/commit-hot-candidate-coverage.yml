name: Commit hot candidate coverage evidence

on:
  pull_request:
    paths:
      - "vortex_runtime/candidate_coverage.py"
      - "scripts/run_hot_candidate_coverage.py"
      - "tests/test_candidate_coverage.py"
      - ".github/workflows/commit-hot-candidate-coverage.yml"

concurrency:
  group: commit-hot-candidate-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  measure-and-commit:
    if: github.head_ref == 'feat/architecture-gate0-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Measure exact-token top-K coverage
        run: |
          python scripts/run_hot_candidate_coverage.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --build-new-tokens 1 \
            --max-rank 32 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output hot_candidate_coverage.json
      - name: Normalize evidence with provenance
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("hot_candidate_coverage.json")
          raw_bytes = raw.read_bytes()
          payload = json.loads(raw_bytes)
          payload["workflow"] = {
              "run_id": int(os.environ["RUN_ID"]),
              "head_sha": os.environ["HEAD_SHA"],
              "raw_file_sha256": hashlib.sha256(raw_bytes).hexdigest(),
          }
          output = Path("results/tinyllama_1_1b_hot_candidate_coverage.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          PY
      - name: Commit evidence when changed
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- results/tinyllama_1_1b_hot_candidate_coverage.json)" ]; then
            echo "Candidate coverage evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tinyllama_1_1b_hot_candidate_coverage.json
          git commit -m "data(candidate): commit exact-token top-K coverage"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
