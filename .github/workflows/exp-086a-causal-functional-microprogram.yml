name: exp-086a-causal-functional-microprogram

on:
  push:
    branches:
      - research/exp-086a-causal-functional-microprogram
  pull_request:
    branches:
      - research/exp-085a-joint-exact-swiglu-compiler
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-086a-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  model-free-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify pins
        run: |
          python - <<'PY'
          import safetensors, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          PY
      - name: Functional microprogram tests
        run: python -m pytest -q tests/exp_086a tests/exp_085a/test_joint_exact_swiglu_compiler.py
      - name: Syntax checks
        run: |
          python -m py_compile \
            vortex_runtime/functional_microprogram_compiler.py \
            experiments/exp_086a/run_experiment.py \
            experiments/exp_086a/update_ledgers.py
      - name: Frozen preregistration check
        run: |
          python experiments/exp_086a/update_ledgers.py --mode preregister
          grep -q EXP086A_PREREGISTERED NEXT_EXPERIMENT.md
          git diff --check

  official-checkpoint-gate:
    if: ${{ !contains(github.event.head_commit.message || '', '[exp086-results]') }}
    needs: model-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Execute official checkpoint Gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/exp_086a/${GITHUB_SHA}
          python experiments/exp_086a/run_experiment.py \
            --config experiments/exp_086a/config.json \
            --output-dir results/exp_086a/${GITHUB_SHA} \
            2>&1 | tee results/exp_086a/${GITHUB_SHA}/run.log
      - name: Update canonical ledgers
        run: |
          python experiments/exp_086a/update_ledgers.py \
            --result results/exp_086a/${GITHUB_SHA}/result.json
      - name: Refresh checksums
        run: |
          cd results/exp_086a/${GITHUB_SHA}
          sha256sum result.json run.log raw/trace_rows.json raw/query_rows.json \
            artifacts/library_manifest.json artifacts/deterministic_core.json > checksums.sha256
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-086a-${{ github.sha }}
          path: results/exp_086a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and ledgers on branch push
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exp_086a/${GITHUB_SHA}/ \
            docs/research/EXP_086A_LATEST_RESULT.md \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            FAILED_APPROACHES_RECENT.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: record EXP-086A functional microprogram Gate [exp086-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish summary
        if: always()
        run: |
          if test -f results/exp_086a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p = Path("results/exp_086a") / os.environ["GITHUB_SHA"] / "result.json"
          r = json.loads(p.read_text())
          print("## EXP-086A")
          print(f"- decision: `{r['authoritative_decision']}`")
          q = r.get("MEASURED", {}).get("queries", {})
          for key in ("evaluation_oracle_fp32", "evaluation_router_fp32"):
              e = q.get(key, {}).get("exact_report", {})
              print(f"- {key}: vector exact `{e.get('vector_exact_fraction', 'NOT_RUN')}`, row p50 `{e.get('row_exact_fraction_p50', 'NOT_RUN')}`")
          resources = r.get("DERIVED", {}).get("target_resources", {})
          print(f"- target sidecar: `{resources.get('sidecar_gib', 'NOT_RUN')} GiB`")
          print(f"- compiled MLP fraction: `{resources.get('compiled_mlp_operation_fraction', 'NOT_RUN')}`")
          PY
          fi
