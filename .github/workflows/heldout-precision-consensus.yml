name: Held-out precision consensus gate

on:
  pull_request:
    paths:
      - "vortex_runtime/progressive_precision.py"
      - "vortex_runtime/precision_consensus.py"
      - "scripts/run_heldout_precision_consensus.py"
      - "tests/test_progressive_precision.py"
      - "tests/test_precision_consensus.py"
      - "experiments/progressive_consensus_prompts.json"
      - ".github/workflows/heldout-precision-consensus.yml"

concurrency:
  group: heldout-precision-consensus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/full-rank-progressive-precision'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prompt_index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate consensus contracts
        run: |
          python -m pytest -q \
            tests/test_progressive_precision.py \
            tests/test_precision_consensus.py
      - name: Evaluate held-out prompt ${{ matrix.prompt_index }}
        run: |
          python scripts/run_heldout_precision_consensus.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --prompts experiments/progressive_consensus_prompts.json \
            --prompt-index ${{ matrix.prompt_index }} \
            --tokens 48 \
            --device cpu \
            --row-chunk 128 \
            --margin-threshold 0.4 \
            --output "consensus-${{ matrix.prompt_index }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: consensus-${{ matrix.prompt_index }}
          path: consensus-${{ matrix.prompt_index }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: consensus-*
          path: consensus-results
          merge-multiple: true
      - name: Aggregate pre-registered held-out rule
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("consensus-results").glob("*.json"))
          if not files:
              raise SystemExit("no held-out consensus files")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["prompt_index"])
          total_tokens = sum(point["fixed_rule"]["tokens"] for point in points)
          accepted = sum(point["fixed_rule"]["accepted_tokens"] for point in points)
          accepted_errors = sum(
              point["fixed_rule"]["accepted_error_tokens"] for point in points
          )
          refined = sum(point["fixed_rule"]["refinement_tokens"] for point in points)
          q4_errors = sum(point["fixed_rule"]["q4_errors"] for point in points)
          q6_errors = sum(point["fixed_rule"]["q6_errors"] for point in points)
          q4_flagged = sum(point["fixed_rule"]["q4_errors_flagged"] for point in points)
          q6_flagged = sum(point["fixed_rule"]["q6_errors_flagged"] for point in points)
          failed_prompts = [
              point["prompt_id"]
              for point in points
              if not point["fixed_rule"]["all_exact_errors_flagged"]
          ]
          accepted_precision = (
              (accepted - accepted_errors) / accepted if accepted else 0.0
          )
          fixed_rule_survives = not failed_prompts and accepted_errors == 0
          payload = {
              "evidence_level": "E2 pre-registered held-out precision consensus gate",
              "model": points[0]["model"],
              "prompts": len(points),
              "tokens": total_tokens,
              "fixed_margin_threshold": 0.4,
              "accepted_tokens": accepted,
              "accepted_errors": accepted_errors,
              "accepted_precision": accepted_precision,
              "refinement_tokens": refined,
              "refinement_fraction": refined / total_tokens,
              "q4_errors": q4_errors,
              "q4_errors_flagged": q4_flagged,
              "q6_errors": q6_errors,
              "q6_errors_flagged": q6_flagged,
              "failed_prompts": failed_prompts,
              "fixed_rule_survives": fixed_rule_survives,
              "points": points,
              "decision": (
                  "advance fixed consensus into layer-local residual oracle"
                  if fixed_rule_survives
                  else "reject fixed q4-q6 consensus rule"
              ),
              "next_candidate": (
                  "measure minimum Q4-to-Q8 layer/bitplane subset for every flagged token"
                  if fixed_rule_survives
                  else "derive a learned-free interval or multi-threshold selector from held-out failures"
              ),
          }
          Path("heldout_precision_consensus.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          summary = {
              "prompts": payload["prompts"],
              "tokens": total_tokens,
              "accepted": accepted,
              "accepted_errors": accepted_errors,
              "accepted_precision": accepted_precision,
              "refinement_fraction": payload["refinement_fraction"],
              "q4_errors_flagged": f"{q4_flagged}/{q4_errors}",
              "q6_errors_flagged": f"{q6_flagged}/{q6_errors}",
              "failed_prompts": failed_prompts,
              "decision": payload["decision"],
          }
          Path("consensus-comment.md").write_text(
              "## Held-out Q4/Q6 consensus gate\n\n```json\n"
              + json.dumps(summary, indent=2, ensure_ascii=False)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish PR report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file consensus-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: heldout-precision-consensus
          path: heldout_precision_consensus.json
