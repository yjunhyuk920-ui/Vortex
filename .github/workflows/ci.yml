name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest
      - name: Test
        run: python -m pytest -q
      - name: Validation smoke test
        run: python scripts/run_validation.py
      - name: Architecture Gate 0 certificate
        run: python scripts/run_architecture_gate0.py

  real-model-falsification:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/architecture-gate0-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Run TinyLlama 1.1B exact-span warm decode
        run: |
          python scripts/run_real_operation_falsification.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --max-new-tokens 8 \
            --max-rank 32 \
            --build-prompt "Explain why the sky appears blue." \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output real_operation_falsification.json
      - name: Run TinyLlama 1.1B approximate layer-suffix oracle
        run: |
          python scripts/run_oracle_suffix_repair.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --max-new-tokens 4 \
            --max-rank 32 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output oracle_suffix_repair.json
      - name: Run TinyLlama 1.1B output-row tile oracle
        run: |
          python scripts/run_oracle_tile_repair.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --max-new-tokens 2 \
            --max-rank 32 \
            --tile-rows 128 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output oracle_tile_repair.json
      - name: Run TinyLlama 1.1B 2D residual tile oracle
        run: |
          python scripts/run_oracle_residual_tile_repair.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --max-new-tokens 2 \
            --max-rank 32 \
            --row-tile 128 \
            --col-tile 128 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output oracle_residual_tile_repair.json
      - name: Run TinyLlama 1.1B exact-target adjoint tile oracle
        id: adjoint
        continue-on-error: true
        run: |
          python scripts/run_oracle_adjoint_tile_repair.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --max-new-tokens 2 \
            --max-rank 32 \
            --row-tile 128 \
            --col-tile 128 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output oracle_adjoint_tile_repair.json
      - name: Publish adjoint diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("oracle_adjoint_tile_repair.json")
          if not path.exists():
              text = "## Gate 0 adjoint diagnostic\n\nNo result file was produced."
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("status") == "error":
                  text = (
                      "## Gate 0 adjoint diagnostic\n\n"
                      f"- Error: `{data.get('error_type')}: {data.get('error_message')}`\n\n"
                      "```text\n"
                      + data.get("traceback", "")[-6000:]
                      + "\n```"
                  )
              else:
                  summary = {
                      "status": data.get("status"),
                      "decision": data.get("decision"),
                      "gate_budget_match": data.get("gate_budget_match"),
                      "best_first_repair_match": data.get("best_first_repair_match"),
                      "missing_gradient_modules": data.get("adjoint", {}).get("missing_gradient_modules"),
                      "non_differentiable_modules": data.get("adjoint", {}).get("non_differentiable_modules"),
                  }
                  text = (
                      "## Gate 0 adjoint diagnostic\n\n"
                      "```json\n"
                      + json.dumps(summary, indent=2)
                      + "\n```"
                  )
          Path("adjoint-comment.md").write_text(text, encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --body-file adjoint-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyllama-gate0-falsification
          path: |
            real_operation_falsification.json
            oracle_suffix_repair.json
            oracle_tile_repair.json
            oracle_residual_tile_repair.json
            oracle_adjoint_tile_repair.json
          if-no-files-found: warn
      - name: Enforce adjoint success
        if: steps.adjoint.outcome != 'success'
        run: exit 1
