name: Exact future-behavior DAG gate

on:
  pull_request:
    paths:
      - "vortex_runtime/exact_future_behavior_dag.py"
      - "tests/test_exact_future_behavior_dag.py"
      - "scripts/run_exact_future_behavior_dag_gate.py"
      - "docs/EXPERIMENT_046_EXACT_FUTURE_BEHAVIOR_DAG.md"
      - ".github/workflows/exact-future-behavior-dag.yml"

concurrency:
  group: exact-future-dag-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  certify:
    if: github.head_ref == 'research/exact-future-behavior-dag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Validate quotient implementation
        run: |
          test -f vortex_runtime/exact_future_behavior_dag.py
          test -f tests/test_exact_future_behavior_dag.py
          python -m pytest -q tests/test_exact_future_behavior_dag.py
      - name: Generate quotient certificate
        run: |
          python scripts/run_exact_future_behavior_dag_gate.py \
            --source results/decision_index_compiler_gate.json \
            --output results/exact_future_behavior_dag_gate.json \
            --vm-output results/exact_future_behavior_dag_compact40.vtx \
            --manifest-output results/exact_future_behavior_dag_manifest.json
      - name: Build PR report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/exact_future_behavior_dag_gate.json")
              .read_text(encoding="utf-8")
          )
          report = {
              "evidence_level": payload["evidence_level"],
              "source": payload["source"],
              "frontier_without_duplicate_control": payload["frontier_without_duplicate_control"],
              "frontier_with_duplicate_control": payload["frontier_with_duplicate_control"],
              "compression_attribution": payload["compression_attribution"],
              "dag": payload["dag"],
              "compiled_replay": payload["compiled_replay"],
              "heldout": payload["heldout"],
              "scope_separation": payload["scope_separation"],
              "conclusion": payload["conclusion"],
              "next_obligation": payload["next_obligation"],
          }
          Path("exact-future-dag-comment.md").write_text(
              "## Exact future-behavior DAG Gate\n\n```json\n"
              + json.dumps(report, indent=2, ensure_ascii=False)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file exact-future-dag-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: exact-future-behavior-dag-gate
          path: |
            results/exact_future_behavior_dag_gate.json
            results/exact_future_behavior_dag_manifest.json
            results/exact_future_behavior_dag_compact40.vtx
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exact_future_behavior_dag_gate.json \
            results/exact_future_behavior_dag_manifest.json
          git commit -m "data(gate): commit exact future-behavior DAG evidence"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
