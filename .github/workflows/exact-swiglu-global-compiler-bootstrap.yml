name: exact-swiglu-global-compiler-bootstrap

on:
  push:
    branches:
      - research/exact-swiglu-global-compiler
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exact-swiglu-global-compiler-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-source:
    if: ${{ !contains(github.event.head_commit.message, '[compiler-source]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAYLOAD_SHA256: a990af3dcd2d018c6910a31ba6ea335d3745aaf7ac7e6d141f3725ea3cb625af
      PAYLOAD_B64: [... ELLIPSIZATION ...]
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify compiler source bundle
        shell: bash
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/exact-swiglu-global-compiler.tar.xz
          echo "$PAYLOAD_SHA256  /tmp/exact-swiglu-global-compiler.tar.xz" | sha256sum -c -
          tar -xJf /tmp/exact-swiglu-global-compiler.tar.xz -C .
          python -m py_compile \
            vortex_runtime/exact_swiglu_global_compiler.py \
            experiments/exact_swiglu_global_compiler/run_gate.py \
            experiments/exact_swiglu_global_compiler/update_ledgers.py \
            tests/test_exact_swiglu_global_compiler.py
      - name: Commit compiler source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/EXACT_SWIGLU_GLOBAL_COMPILER_GATE.md \
            experiments/exact_swiglu_global_compiler/README.md \
            experiments/exact_swiglu_global_compiler/run_gate.py \
            experiments/exact_swiglu_global_compiler/update_ledgers.py \
            vortex_runtime/exact_swiglu_global_compiler.py \
            tests/test_exact_swiglu_global_compiler.py
          git commit -m "research: add exact whole-SwiGLU global compiler [compiler-source]"
          git push origin HEAD:${GITHUB_REF_NAME}
