name: EXP-073 sanitized target-inventory collector Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/exp_073_gate.yml"
      - "docs/research/EXPERIMENT_073_TARGET_RESOURCE_CALIBRATION.md"
      - "experiments/exp_073/**"
      - "tests/exp_073/**"
      - "vortex_runtime/target_inventory.py"

concurrency:
  group: exp-073-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-collector-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded validation dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Validate sanitizer and offline fixture only
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP073_OUTPUT_DIR: ${{ runner.temp }}/exp_073_fixture
        run: bash experiments/exp_073/run_current_env.sh
      - name: Upload non-target fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-073-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_073_fixture
          if-no-files-found: error
          retention-days: 30
