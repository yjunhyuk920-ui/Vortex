name: Block signed residual code gate

on:
  pull_request:
    paths:
      - "vortex_runtime/block_signed_residual_code.py"
      - "scripts/run_block_signed_residual_code.py"
      - "tests/test_block_signed_residual_code.py"
      - "experiments/residual_code_build_prompts.json"
      - "experiments/residual_code_eval_prompts.json"
      - "docs/EXPERIMENT_033_BLOCK_SIGNED_RESIDUAL_CODE.md"
      - ".github/workflows/block-signed-residual-code.yml"

concurrency:
  group: block-signed-residual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/block-signed-residual-code'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - block_size: 1024
            rank: 1
            label: b1024-r1
          - block_size: 1024
            rank: 2
            label: b1024-r2
          - block_size: 512
            rank: 1
            label: b512-r1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate signed residual code
        run: |
          test -f tests/test_block_signed_residual_code.py
          python -m pytest -q \
            tests/test_signed_dual_mlp.py \
            tests/test_block_signed_residual_code.py
      - name: Measure disjoint frontier point
        run: |
          python scripts/run_block_signed_residual_code.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --build-prompts experiments/residual_code_build_prompts.json \
            --eval-prompts experiments/residual_code_eval_prompts.json \
            --bits 8 \
            --block-size ${{ matrix.block_size }} \
            --rank ${{ matrix.rank }} \
            --margin-share 0.5 \
            --metadata-limit-gib 6.0 \
            --device cpu \
            --output results/tinyllama_1_1b_block_signed_residual_${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: block-signed-residual-${{ matrix.label }}
          path: results/tinyllama_1_1b_block_signed_residual_${{ matrix.label }}.json

  aggregate:
    if: github.head_ref == 'research/block-signed-residual-code'
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: block-signed-residual-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          points = []
          for path in sorted(Path("downloaded").glob("*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              summary = payload["summary"]
              points.append(
                  {
                      "block_size": payload["block_size"],
                      "rank": payload["rank"],
                      "metadata_gib": payload["metadata_budget"]["total_metadata_gib"],
                      "mean_refined_fraction": summary["mean_refined_fraction"],
                      "maximum_refined_fraction": summary["maximum_refined_fraction"],
                      "maximum_exact_gib_per_token": summary["maximum_exact_gib_per_token"],
                      "activation_perpendicular_ratio": summary["mean_activation_perpendicular_ratio"],
                      "dual_perpendicular_ratio": summary["mean_dual_perpendicular_ratio"],
                      "gate_radius_ratio": summary["mean_gate_radius_ratio"],
                      "up_radius_ratio": summary["mean_up_radius_ratio"],
                      "directional_radius_ratio": summary["mean_directional_radius_ratio"],
                      "unsafe_certificates": summary["unsafe_certificates"],
                      "interval_failures": summary["interval_failures"],
                      "qualifies": payload["qualifies"],
                  }
              )
          points.sort(key=lambda point: (point["block_size"], point["rank"]))
          promoted = [
              {"block_size": point["block_size"], "rank": point["rank"]}
              for point in points
              if point["qualifies"]
          ]
          combined = {
              "evidence_level": "E2 disjoint block signed residual code frontier",
              "points": points,
              "promoted_configurations": promoted,
              "decision": (
                  "advance signed residual codes to compressed metadata and causal dual transport"
                  if promoted
                  else "reject static disjoint block signed residual codes"
              ),
              "next_candidate": (
                  "compress signed coefficients with outward error accounting"
                  if promoted
                  else "key signed residual programs by online semantic state"
              ),
          }
          output = Path("results/tinyllama_1_1b_block_signed_residual_frontier.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(combined, indent=2), encoding="utf-8")
          Path("block-signed-comment.md").write_text(
              "## Block signed residual code gate\n\n```json\n"
              + json.dumps(combined, indent=2)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file block-signed-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: block-signed-residual-frontier
          path: results/tinyllama_1_1b_block_signed_residual_frontier.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_block_signed_residual_frontier.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(frontier): commit block signed residual code"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
