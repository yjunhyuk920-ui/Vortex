name: EXP-083B Gate

on:
  workflow_dispatch:

concurrency:
  group: exp-083b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run reference and contract tests
        shell: pwsh
        run: python -m pytest -q tests/test_causal_residual_atlas_legal_gate.py tests/exp_083b
      - name: Fail closed without pinned local checkpoint
        shell: pwsh
        run: |
          Write-Error "EXP-083B requires the SHA-pinned local Qwen3.5-0.8B payload; no CI proxy result is valid."
