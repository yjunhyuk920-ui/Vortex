name: exp-086a-exact-state-axis-lifting

on:
  push:
    branches:
      - research/exp-086a-exact-state-axis-lifting-gate
  pull_request:
    branches:
      - research/exp-085a-joint-exact-swiglu-compiler
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-086a-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  model-free-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify pins
        run: |
          python - <<'PY'
          import safetensors, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          PY
      - name: Exact state-axis lifting controls
        run: python -m pytest -q tests/exp_086a
      - name: Legacy EXP-085A compatibility controls
        run: python -m pytest -q tests/exp_085a
      - name: Syntax checks
        run: |
          python -m py_compile \
            vortex_runtime/exact_state_axis_lifting.py \
            vortex_runtime/swiglu_quadratic_compat.py \
            experiments/exp_086a/run_experiment.py \
            experiments/exp_086a/update_ledgers.py

  real-checkpoint-gate:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[exp086-results]') }}
    needs: model-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Record host
        run: |
          mkdir -p results/exp_086a/${GITHUB_SHA}
          {
            uname -a
            lscpu
            free -b
            df -B1 .
            python --version
          } | tee results/exp_086a/${GITHUB_SHA}/host.txt
      - name: Execute official-checkpoint perfect-future Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_086a/run_experiment.py \
            --config experiments/exp_086a/config.json \
            --output-dir results/exp_086a/${GITHUB_SHA} \
            2>&1 | tee results/exp_086a/${GITHUB_SHA}/run.log
      - name: Update canonical research ledgers
        run: |
          python experiments/exp_086a/update_ledgers.py \
            --result results/exp_086a/${GITHUB_SHA}/result.json
      - name: Refresh checksums
        run: |
          cd results/exp_086a/${GITHUB_SHA}
          find . -type f ! -name checksums.sha256 -print0 | sort -z | \
            xargs -0 sha256sum > checksums.sha256
      - name: Upload immutable raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-086a-${{ github.sha }}
          path: results/exp_086a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and ledgers
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exp_086a/${GITHUB_SHA}/ \
            docs/research/EXP_086A_LATEST_RESULT.md \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            FAILED_APPROACHES_RECENT.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md
          if git diff --cached --quiet; then
            echo "No result delta"
            exit 0
          fi
          git commit -m "research: record EXP-086A exact state-axis lifting Gate [exp086-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish summary
        if: always()
        run: |
          if test -f results/exp_086a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p = Path("results/exp_086a") / os.environ["GITHUB_SHA"] / "result.json"
          result = json.loads(p.read_text())
          print("## EXP-086A exact state-axis lifting")
          print(f"- decision: `{result['authoritative_decision']}`")
          decisive = result.get("decisive_aggregate", {})
          if decisive:
              print(f"- block: `{decisive['block_size']}`")
              print(f"- operation p50/p95: `{decisive['projected_whole_model_operation_fraction_p50']:.9%}` / `{decisive['projected_whole_model_operation_fraction_p95']:.9%}`")
              print(f"- weight p50/p95: `{decisive['projected_whole_model_weight_fraction_p50']:.9%}` / `{decisive['projected_whole_model_weight_fraction_p95']:.9%}`")
              print(f"- joint p50/p95: `{decisive['projected_joint_fraction_p50']:.9%}` / `{decisive['projected_joint_fraction_p95']:.9%}`")
          PY
          fi
