name: EXP-067 real-Q4 joint projection reuse Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/exp_067_gate.yml"
      - "docs/research/EXPERIMENT_067_JOINT_PROJECTION_REUSE.md"
      - "experiments/exp_067/**"
      - "tests/exp_067/**"
      - "vortex_runtime/joint_projection_reuse.py"

concurrency:
  group: exp-067-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pinned checkpoint cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exp_067_huggingface
          key: exp-058-tinystories-1m-3m-8m-v1
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run EXP-067 bounded reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP067_OUTPUT_DIR: ${{ runner.temp }}/exp_067_candidate
          EXP067_CACHE_DIR: ${{ runner.temp }}/exp_067_huggingface
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: bash experiments/exp_067/reproduce.sh
      - name: Upload EXP-067 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-067-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_067_candidate
          if-no-files-found: error
          retention-days: 30
