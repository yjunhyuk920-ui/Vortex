name: Full-rank progressive precision frontier

on:
  pull_request:
    paths:
      - "vortex_runtime/progressive_precision.py"
      - "scripts/run_full_rank_precision_point.py"
      - "tests/test_progressive_precision.py"
      - "docs/EXPERIMENT_009_FULL_RANK_PROGRESSIVE_PRECISION.md"
      - ".github/workflows/full-rank-progressive-precision.yml"

concurrency:
  group: full-rank-progressive-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/full-rank-progressive-precision'
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 2
            hot_tops: 320
          - bits: 3
            hot_tops: 240
          - bits: 4
            hot_tops: 160
          - bits: 6
            hot_tops: 120
          - bits: 8
            hot_tops: 80
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate progressive precision primitives
        run: python -m pytest -q tests/test_progressive_precision.py
      - name: Measure ${{ matrix.bits }}-bit full-rank point
        run: |
          python scripts/run_full_rank_precision_point.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --bits ${{ matrix.bits }} \
            --tokens 32 \
            --row-chunk 128 \
            --host-to-device-gib-s 24 \
            --hot-effective-tops ${{ matrix.hot_tops }} \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "full-rank-${{ matrix.bits }}bit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: full-rank-${{ matrix.bits }}bit
          path: full-rank-${{ matrix.bits }}bit.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: full-rank-*bit
          path: precision-results
          merge-multiple: true
      - name: Aggregate precision frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("precision-results").glob("*.json"))
          if not files:
              raise SystemExit("no progressive precision results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["bits"])
          candidates = [point for point in points if point["qualifies_as_hot_candidate"]]
          best_top1 = max(
              points,
              key=lambda item: (
                  item["teacher_forced"]["exact_top1_match_rate"],
                  -item["bits"],
              ),
          )
          best_top32 = max(
              points,
              key=lambda item: (
                  item["teacher_forced"]["coverage_at_k"]["32"],
                  -item["bits"],
              ),
          )
          if candidates:
              promoted = min(candidates, key=lambda item: item["bits"])
              decision = "advance full-rank progressive residual certification"
              next_candidate = (
                  f"use {promoted['bits']}-bit full-rank hot execution and "
                  "measure causal residual precision required per token/layer"
              )
          elif best_top32["teacher_forced"]["coverage_at_k"]["32"] >= 0.95:
              promoted = best_top32
              decision = "retain full-rank precision only as a candidate generator"
              next_candidate = (
                  "test multi-precision consensus and exact-token candidate "
                  "verification without reading all residual bitplanes"
              )
          else:
              promoted = None
              decision = "reject tested full-rank coarse precisions"
              next_candidate = (
                  "replace scalar per-row precision with structured block "
                  "floating point before abandoning progressive precision"
              )
          summary = [
              {
                  "bits": point["bits"],
                  "top1": point["teacher_forced"]["exact_top1_match_rate"],
                  "top32": point["teacher_forced"]["coverage_at_k"]["32"],
                  "mean_rank": point["teacher_forced"]["mean_exact_token_rank"],
                  "max_rank": point["teacher_forced"]["maximum_exact_token_rank"],
                  "autoregressive_prefix": point["autoregressive"]["exact_prefix_tokens"],
                  "hot_gib": point["precision"]["hot_gib"],
                  "qualifies": point["qualifies_as_hot_candidate"],
              }
              for point in points
          ]
          payload = {
              "evidence_level": "E1 full-rank progressive precision frontier",
              "points": points,
              "summary": summary,
              "candidate_bits": [point["bits"] for point in candidates],
              "best_top1_bits": best_top1["bits"],
              "best_top32_bits": best_top32["bits"],
              "promoted_bits": None if promoted is None else promoted["bits"],
              "decision": decision,
              "next_candidate": next_candidate,
          }
          Path("full_rank_progressive_precision_frontier.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          Path("precision-comment.md").write_text(
              "## Full-rank progressive precision frontier\n\n```json\n"
              + json.dumps(
                  {
                      "summary": summary,
                      "candidate_bits": payload["candidate_bits"],
                      "promoted_bits": payload["promoted_bits"],
                      "decision": decision,
                      "next_candidate": next_candidate,
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish PR report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file precision-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: full-rank-progressive-precision-frontier
          path: full_rank_progressive_precision_frontier.json
