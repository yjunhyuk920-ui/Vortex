name: Causal precision router gate

on:
  pull_request:
    paths:
      - "vortex_runtime/progressive_precision.py"
      - "vortex_runtime/precision_consensus.py"
      - "vortex_runtime/layer_precision_oracle.py"
      - "vortex_runtime/token_routed_precision.py"
      - "vortex_runtime/causal_precision_router.py"
      - "scripts/run_layer_local_precision_oracle.py"
      - "scripts/run_causal_precision_router.py"
      - "tests/test_progressive_precision.py"
      - "tests/test_precision_consensus.py"
      - "tests/test_layer_precision_oracle.py"
      - "tests/test_token_routed_precision.py"
      - "tests/test_causal_precision_router.py"
      - "experiments/causal_precision_router_prompts.json"
      - ".github/workflows/causal-precision-router.yml"

concurrency:
  group: causal-precision-router-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/full-rank-progressive-precision'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prompt_index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate causal routing contracts
        run: |
          python -m pytest -q \
            tests/test_progressive_precision.py \
            tests/test_precision_consensus.py \
            tests/test_layer_precision_oracle.py \
            tests/test_token_routed_precision.py \
            tests/test_causal_precision_router.py
      - name: Evaluate causal router prompt ${{ matrix.prompt_index }}
        run: |
          python scripts/run_causal_precision_router.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --prompts experiments/causal_precision_router_prompts.json \
            --prompt-index ${{ matrix.prompt_index }} \
            --tokens 48 \
            --device cpu \
            --row-chunk 128 \
            --layers-per-group 2 \
            --margin-threshold 0.4 \
            --output "causal-router-${{ matrix.prompt_index }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-router-${{ matrix.prompt_index }}
          path: causal-router-${{ matrix.prompt_index }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: causal-router-*
          path: causal-router-results
          merge-multiple: true
      - name: Aggregate pre-registered causal router
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("causal-router-results").glob("*.json"))
          if not files:
              raise SystemExit("no causal router results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["prompt_index"])
          total_tokens = sum(point["evaluated_tokens"] for point in points)
          unsafe = sum(len(point["unsafe_positions"]) for point in points)
          fallbacks = sum(len(point["fallback_positions"]) for point in points)
          failed_prompts = [
              point["prompt_id"] for point in points if not point["qualifies"]
          ]
          mean_token_layer_fraction = sum(
              point["mean_token_layer_fraction"] * point["evaluated_tokens"]
              for point in points
          ) / total_tokens
          worst_overlap = max(
              point["budget"]["required_overlap_fraction"] for point in points
          )
          worst_ratio = max(
              point["budget"]["ideal_seconds_per_token"]
              / point["budget"]["baseline_seconds_per_token"]
              for point in points
          )
          survives = not failed_prompts and unsafe == 0 and fallbacks == 0
          payload = {
              "evidence_level": "E2 second-held-out causal residual router gate",
              "model": points[0]["model"],
              "prompts": len(points),
              "tokens": total_tokens,
              "unsafe_accepts": unsafe,
              "exact_fallbacks": fallbacks,
              "mean_token_layer_fraction": mean_token_layer_fraction,
              "worst_required_overlap_fraction": worst_overlap,
              "worst_ideal_ratio_to_native_4b": worst_ratio,
              "failed_prompts": failed_prompts,
              "survives": survives,
              "points": points,
              "decision": (
                  "advance fixed causal residual router"
                  if survives
                  else "reject fixed causal residual router"
              ),
              "next_candidate": (
                  "implement candidate-block generation without authoritative future prefixes"
                  if survives
                  else "replace adjacent-stage stability with a conservative causal remaining-residual bound"
              ),
          }
          Path("causal_precision_router_gate.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          summary = {
              "prompts": payload["prompts"],
              "tokens": total_tokens,
              "unsafe_accepts": unsafe,
              "exact_fallbacks": fallbacks,
              "mean_token_layer_fraction": mean_token_layer_fraction,
              "worst_required_overlap_fraction": worst_overlap,
              "worst_ideal_ratio_to_native_4b": worst_ratio,
              "failed_prompts": failed_prompts,
              "decision": payload["decision"],
          }
          Path("causal-router-comment.md").write_text(
              "## Second-held-out causal residual router gate\n\n```json\n"
              + json.dumps(summary, indent=2, ensure_ascii=False)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish PR report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file causal-router-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: causal-precision-router-gate
          path: causal_precision_router_gate.json
