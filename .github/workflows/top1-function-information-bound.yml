name: Top1 function information certificate

on:
  pull_request:
    paths:
      - "vortex_runtime/top1_function_information.py"
      - "scripts/run_top1_function_information_bound.py"
      - "tests/test_top1_function_information.py"
      - "docs/EXPERIMENT_041_TOP1_FUNCTION_INFORMATION_BOUND.md"
      - ".github/workflows/top1-function-information-bound.yml"

concurrency:
  group: top1-function-information-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  certify:
    if: github.head_ref == 'research/top1-function-information-bound'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest
      - name: Validate top1 information implementation
        run: |
          test -f vortex_runtime/top1_function_information.py
          test -f scripts/run_top1_function_information_bound.py
          test -f tests/test_top1_function_information.py
          python -m pytest -q tests/test_top1_function_information.py
      - name: Generate certificate
        run: |
          python scripts/run_top1_function_information_bound.py \
            --output results/top1_function_information_bound.json
      - name: Build PR report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/top1_function_information_bound.json").read_text(
                  encoding="utf-8"
              )
          )
          collection = payload["llama_405b_operator_collection"]
          report = {
              "evidence_level": payload["evidence_level"],
              "enumerations": [
                  {
                      "rows": item["shape"]["rows"],
                      "columns": item["shape"]["columns"],
                      "decision_bits": item["shape"]["decision_bits"],
                      "expected_functions": item["expected_functions"],
                      "observed_functions": item["observed_functions"],
                      "minimum_winner_margin": item["minimum_winner_margin"],
                      "passes": item["passes"],
                  }
                  for item in payload["exhaustive_enumerations"]
              ],
              "decoder_layer_bits": collection["decoder_layer_bits"],
              "decoder_layer_mib": collection["decoder_layer_mib"],
              "decoder_stack_gib": collection["decoder_stack_gib"],
              "lm_head_mib": collection["lm_head_mib"],
              "operator_collection_total_gib": collection["total_gib"],
              "scope_separation": payload["scope_separation"],
              "conclusion": payload["conclusion"],
              "next_proof_obligation": payload["next_proof_obligation"],
          }
          Path("top1-function-comment.md").write_text(
              "## Top1 function information certificate\n\n```json\n"
              + json.dumps(report, indent=2, ensure_ascii=False)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file top1-function-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: top1-function-information-bound
          path: results/top1_function_information_bound.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/top1_function_information_bound.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(gate): commit top1 function information certificate"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
