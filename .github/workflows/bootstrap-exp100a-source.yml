name: bootstrap-exp-100a-source

on:
  push:
    branches:
      - research/exp-100a-explicit-rectangular-fmm-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-exp100a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-source:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[exp100a-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Reassemble, verify, and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .bootstrap/exp100a_part_00
            .bootstrap/exp100a_part_01
            .bootstrap/exp100a_part_02
            .bootstrap/exp100a_part_03_0
            .bootstrap/exp100a_part_03_1
            .bootstrap/exp100a_part_04
          )
          for part in "${parts[@]}"; do
            test -f "$part"
          done
          cat "${parts[@]}" > /tmp/exp100a_bundle.tar.gz
          echo "217ba74d8466c82bc531ea73485c217c114f177d77e72bff28fed856e4fcc142  /tmp/exp100a_bundle.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/exp100a_bundle.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall('.')
          print(f'extracted {len(members)} members')
          PY
          # Add the scientific workflow only after this complete source commit is
          # read back. That keeps a partial bootstrap from running the Gate.
          rm -f .github/workflows/exp-100a-explicit-rectangular-fmm.yml
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-exp100a-source.yml
      - name: Install minimal source-test runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.3
      - name: Validate materialized source
        run: |
          python -m pytest -q tests/exp_100a
          python -m py_compile \
            vortex_runtime/explicit_rectangular_fmm.py \
            experiments/exp_100a/run_experiment.py \
            experiments/exp_100a/update_ledgers.py
      - name: Commit and push EXP-100A source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: preregister EXP-100A explicit rectangular FMM Gate"
          git push origin HEAD:${GITHUB_REF_NAME}
