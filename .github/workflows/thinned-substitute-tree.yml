name: Thinned substitute tree gate

on:
  pull_request:
    paths:
      - "vortex_runtime/substitute_draft_budget.py"
      - "scripts/run_thinned_substitute_tree_gate.py"
      - "tests/test_substitute_draft_budget.py"
      - "docs/EXPERIMENT_011_THINNED_SUBSTITUTE_TREE.md"
      - ".github/workflows/thinned-substitute-tree.yml"

concurrency:
  group: thinned-substitute-tree-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/full-rank-progressive-precision'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        strategy: [front, uniform, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate substitute memory gate
        run: |
          python -m pytest -q \
            tests/test_substitute_draft_budget.py \
            tests/test_speculative_tree_gate.py
      - name: Measure ${{ matrix.strategy }} strategy
        run: |
          python scripts/run_thinned_substitute_tree_gate.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --bits 4 \
            --retained-layers 3 \
            --strategy ${{ matrix.strategy }} \
            --depth 12 \
            --top-k 32 \
            --beam-width 64 \
            --node-budget 1024 \
            --eval-batch-size 8 \
            --row-chunk 128 \
            --workspace-gib 1 \
            --memory-limit-gib 8 \
            --host-to-device-gib-s 24 \
            --target-hot-effective-tops 160 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "thinned-tree-${{ matrix.strategy }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: thinned-tree-${{ matrix.strategy }}
          path: thinned-tree-${{ matrix.strategy }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: thinned-tree-*
          path: thinned-tree-results
          merge-multiple: true
      - name: Aggregate thinned substitute gate
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path("thinned-tree-results").glob("*.json"))
          if not files:
              raise SystemExit("no thinned substitute results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["strategy"])
          best = max(
              points,
              key=lambda item: (
                  item["optimistic_committed_exact_prefix"],
                  -item["retained_tree_nodes"],
              ),
          )
          survivors = [point for point in points if point["qualifies"]]
          payload = {
              "evidence_level": (
                  "E2 causal 8GiB target-derived substitute tree lower bound"
              ),
              "points": points,
              "best_point": {
                  "strategy": best["strategy"],
                  "retained_indices": best["retained_indices"],
                  "tree_nodes": best["retained_tree_nodes"],
                  "exact_prefix": best["optimistic_committed_exact_prefix"],
                  "last_alive_depth": best["exact_path_last_alive_depth"],
                  "untied_total_gib": best["405b_substitute_memory"]["untied"][
                      "total_gib"
                  ],
                  "minimum_commit_serialized": best[
                      "405b_q4_target_side_lower_bound"
                  ]["minimum_committed_tokens_serialized"],
              },
              "surviving_points": len(survivors),
              "decision": (
                  "survive thinned substitute lower bound; build exact verifier"
                  if survivors
                  else "reject tested 8GiB thinned substitute tree frontier"
              ),
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "head_sha": os.environ["HEAD_SHA"],
                  "input_sha256": {
                      path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in files
                  },
              },
          }
          output = Path("results/tinyllama_1_1b_thinned_substitute_tree.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          Path("thinned-tree-comment.md").write_text(
              "## 8 GiB thinned substitute tree gate\n\n```json\n"
              + json.dumps(
                  {
                      "best_point": payload["best_point"],
                      "surviving_points": payload["surviving_points"],
                      "decision": payload["decision"],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish PR report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file thinned-tree-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-thinned-substitute-tree
          path: results/tinyllama_1_1b_thinned_substitute_tree.json
      - name: Commit evidence when changed
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_thinned_substitute_tree.json
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo "Thinned substitute evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(gate): commit thinned substitute tree frontier"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
