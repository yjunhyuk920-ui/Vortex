name: exp-087a-quadratic-bf16-residual-generator

on:
  push:
    branches:
      - research/exp-087a-quadratic-bf16-residual-generator
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-087a-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  preregister:
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[exp087-preregister]') &&
      !contains(github.event.head_commit.message, '[exp087-results]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
      - name: Materialize frozen canonical preregistration
        run: python experiments/exp_087a/update_ledgers.py --mode preregister
      - name: Commit preregistration before any checkpoint execution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEXT_EXPERIMENT.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md
          if git diff --cached --quiet; then
            echo "Preregistration already materialized"
            exit 0
          fi
          git commit -m "research: preregister EXP-087A finite-word residual Gate [exp087-preregister]"
          git push origin HEAD:${GITHUB_REF_NAME}

  model-free-contract:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[exp087-preregister]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify runtime pins
        run: |
          python - <<'PY'
          import safetensors, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          PY
      - name: Finite-word compiler unit and fail-closed controls
        run: python -m pytest -q tests/exp_087a
      - name: Syntax checks
        run: |
          python -m py_compile \
            vortex_runtime/quadratic_bf16_residual_generator.py \
            experiments/exp_087a/run_experiment.py \
            experiments/exp_087a/update_ledgers.py
      - name: Verify frozen config and Gate document
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('experiments/exp_087a/config.json').read_text())
          assert c['frozen_before_results'] is True
          assert c['program_count'] == 4
          assert c['context_bits'] == 12
          assert len(c['prompts']) == 12
          assert Path('docs/research/EXPERIMENT_087A_QUADRATIC_BF16_RESIDUAL_GENERATOR_GATE.md').is_file()
          PY
          grep -q 'EXP087A_PREREGISTERED' NEXT_EXPERIMENT.md
          git diff --check

  real-checkpoint-gate:
    needs: model-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Record hosted environment
        run: |
          mkdir -p results/exp_087a/${GITHUB_SHA}
          {
            uname -a
            lscpu
            free -b
            df -B1 .
            python --version
          } | tee results/exp_087a/${GITHUB_SHA}/host.txt
      - name: Execute official SmolLM2 causal residual-program Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_087a/run_experiment.py \
            --config experiments/exp_087a/config.json \
            --output-dir results/exp_087a/${GITHUB_SHA} \
            2>&1 | tee results/exp_087a/${GITHUB_SHA}/run.log
      - name: Materialize result in canonical ledgers
        run: |
          python experiments/exp_087a/update_ledgers.py \
            --mode result \
            --result results/exp_087a/${GITHUB_SHA}/result.json
      - name: Extend checksums to hosted logs
        run: |
          cd results/exp_087a/${GITHUB_SHA}
          sha256sum host.txt run.log >> checksums.sha256
      - name: Upload immutable raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-087a-${{ github.sha }}
          path: results/exp_087a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit scientific result and current handoff
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exp_087a/${GITHUB_SHA}/ \
            docs/research/EXP_087A_LATEST_RESULT.md \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            FAILED_APPROACHES_RECENT.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md
          if git diff --cached --quiet; then
            echo "No scientific result delta"
            exit 0
          fi
          git commit -m "research: record EXP-087A quadratic residual Gate [exp087-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish Gate summary
        if: always()
        run: |
          if test -f results/exp_087a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r = json.loads((Path('results/exp_087a') / os.environ['GITHUB_SHA'] / 'result.json').read_text())
          print('## EXP-087A quadratic BF16 residual generator')
          print(f"- decision: `{r['authoritative_decision']}`")
          q = r.get('MEASURED', {}).get('queries', {})
          for name in ('build_oracle', 'evaluation_oracle', 'evaluation_router'):
              report = q.get(name, {}).get('report', {})
              print(f"- {name}: vectors `{report.get('exact_vectors')}/{report.get('count')}`, row p50 `{report.get('row_exact_fraction_p50')}`")
          resources = r.get('DERIVED', {}).get('target_resources', {})
          print(f"- projected sidecar: `{resources.get('sidecar_gib')} GiB`")
          print(f"- compiled MLP operation fraction: `{resources.get('compiled_mlp_operation_fraction')}`")
          PY
          fi
