name: EXP-076 native MTP accepted-prefix contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/exp_076_gate.yml"
      - "docs/research/EXPERIMENT_076_QWEN35_NATIVE_MTP_ACCEPTED_PREFIX_GATE.md"
      - "experiments/exp_076/**"
      - "tests/exp_076/**"
      - "vortex_runtime/mtp_acceptance.py"

concurrency:
  group: exp-076-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preregistered-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Validate causal and accounting contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_076
      - name: Confirm no checkpoint payload is tracked
        run: |
          if git ls-files '*.safetensors' '*.bin' '*.pt' '*.pth' | grep -q .; then
            echo 'Tracked model payload is forbidden' >&2
            exit 1
          fi
