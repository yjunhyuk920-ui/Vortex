name: EXP-070 freeze authoritative evidence

on:
  push:
    branches:
      - research/exp-070-q4-local-pattern-table
    paths:
      - FREEZE_EXP070_EVIDENCE

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-070-q4-local-pattern-table
          fetch-depth: 0
      - name: Download authoritative workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf results/exp_070.download
          mkdir -p results/exp_070.download
          gh run download 30930542616 \
            --repo "${GITHUB_REPOSITORY}" \
            --name exp-070-candidate-30930542616 \
            --dir results/exp_070.download
          mkdir -p results/exp_070
          cp -a results/exp_070.download/. results/exp_070/
          rm -rf results/exp_070.download
      - name: Verify frozen artifact checksums
        run: |
          set -euo pipefail
          cd results/exp_070
          sha256sum --check checksums.sha256
      - name: Commit exact artifact contents
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/exp_070
          if git diff --cached --quiet; then
            echo "Authoritative evidence already frozen"
            exit 0
          fi
          git commit -m "evidence(exp-070): freeze authoritative raw artifact"
          git push origin HEAD:research/exp-070-q4-local-pattern-table
