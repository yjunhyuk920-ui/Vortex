name: Orthogonal residual proof gate

on:
  pull_request:
    paths:
      - "vortex_runtime/residual_sketch_proof.py"
      - "scripts/run_lm_head_residual_sketch_proof.py"
      - "tests/test_residual_sketch_proof.py"
      - "docs/EXPERIMENT_021_ORTHOGONAL_RESIDUAL_PROOF.md"
      - ".github/workflows/orthogonal-residual-proof.yml"

concurrency:
  group: orthogonal-residual-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/orthogonal-residual-proof-sketch'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rank: [4, 16, 64]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate orthogonal proof primitives
        run: |
          python -m pytest -q \
            tests/test_residual_proof.py \
            tests/test_residual_sketch_proof.py
      - name: Measure residual proof rank ${{ matrix.rank }}
        run: |
          python scripts/run_lm_head_residual_sketch_proof.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --hot-bits 4 \
            --rank ${{ matrix.rank }} \
            --oversample 8 \
            --power-iterations 2 \
            --seed 13001 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "orthogonal-proof-${{ matrix.rank }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: orthogonal-proof-${{ matrix.rank }}
          path: orthogonal-proof-${{ matrix.rank }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: orthogonal-proof-*
          path: orthogonal-proof-results
          merge-multiple: true
      - name: Aggregate orthogonal proof frontier
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path("orthogonal-proof-results").glob("*.json"))
          if not files:
              raise SystemExit("no orthogonal proof results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["rank"])
          unsafe = sum(point["unsafe_certificates"] for point in points)
          best = max(
              points,
              key=lambda item: (
                  item["certificate_rate"],
                  item["refined_top1_rate"],
                  -item["projected_405b_lm_head_metadata_budget"]["metadata_gib"],
              ),
          )
          promoted = [point for point in points if point["qualifies"]]
          certificate_monotone = all(
              points[index]["certificate_rate"]
              <= points[index + 1]["certificate_rate"] + 1e-12
              for index in range(len(points) - 1)
          )
          if unsafe:
              decision = "reject implementation: unsound orthogonal proof"
              next_candidate = "repair proof mathematics before further experiments"
          elif promoted:
              decision = "advance orthogonal proof into internal Transformer residuals"
              next_candidate = (
                  "propagate exact top-two logit margins backward and compile "
                  "per-projection directional residual sketches"
              )
          elif certificate_monotone and best["certificate_rate"] > 0:
              decision = "retain sound sketch and sweep the budget frontier"
              next_candidate = (
                  "allocate rank nonuniformly to decision-sensitive output rows "
                  "and add adaptive signed tile leaves"
              )
          else:
              decision = "reject tested global orthogonal LM-head sketches"
              next_candidate = (
                  "compile top-K row-specific signed support functions rather "
                  "than a shared global residual basis"
              )
          summary = [
              {
                  "rank": point["rank"],
                  "remainder_l2": point["sketch"]["relative_remainder_l2"],
                  "hot_top1": point["hot_top1_rate"],
                  "refined_top1": point["refined_top1_rate"],
                  "refined_top32": point["refined_top32_rate"],
                  "certificate_rate": point["certificate_rate"],
                  "unsafe_certificates": point["unsafe_certificates"],
                  "target_metadata_gib": point[
                      "projected_405b_lm_head_metadata_budget"
                  ]["metadata_gib"],
                  "qualifies": point["qualifies"],
              }
              for point in points
          ]
          payload = {
              "evidence_level": "E2 pretrained orthogonal residual proof frontier",
              "points": points,
              "summary": summary,
              "best_rank": best["rank"],
              "best_certificate_rate": best["certificate_rate"],
              "certificate_rate_monotone": certificate_monotone,
              "unsafe_certificates": unsafe,
              "promoted_ranks": [point["rank"] for point in promoted],
              "decision": decision,
              "next_candidate": next_candidate,
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "head_sha": os.environ["HEAD_SHA"],
                  "input_sha256": {
                      path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in files
                  },
              },
          }
          output = Path("results/tinyllama_1_1b_orthogonal_residual_proof.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          Path("orthogonal-proof-comment.md").write_text(
              "## Orthogonal residual proof gate\n\n```json\n"
              + json.dumps(
                  {
                      "summary": summary,
                      "best_rank": payload["best_rank"],
                      "best_certificate_rate": payload["best_certificate_rate"],
                      "certificate_rate_monotone": payload[
                          "certificate_rate_monotone"
                      ],
                      "unsafe_certificates": payload["unsafe_certificates"],
                      "decision": payload["decision"],
                      "next_candidate": payload["next_candidate"],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file orthogonal-proof-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-orthogonal-residual-proof
          path: results/tinyllama_1_1b_orthogonal_residual_proof.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_orthogonal_residual_proof.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(frontier): commit orthogonal residual proof sweep"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
