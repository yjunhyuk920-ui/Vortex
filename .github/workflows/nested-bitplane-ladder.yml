name: Nested bitplane ladder gate

on:
  pull_request:
    paths:
      - "vortex_runtime/progressive_precision.py"
      - "vortex_runtime/nested_precision.py"
      - "scripts/run_nested_bitplane_ladder.py"
      - "tests/test_nested_precision.py"
      - "experiments/nested_bitplane_prompts.json"
      - ".github/workflows/nested-bitplane-ladder.yml"

concurrency:
  group: nested-bitplane-ladder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/full-rank-progressive-precision'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prompt_index: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate nested precision contracts
        run: |
          python -m pytest -q \
            tests/test_progressive_precision.py \
            tests/test_nested_precision.py
      - name: Evaluate nested ladder prompt ${{ matrix.prompt_index }}
        run: |
          python scripts/run_nested_bitplane_ladder.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --prompts experiments/nested_bitplane_prompts.json \
            --prompt-index ${{ matrix.prompt_index }} \
            --tokens 48 \
            --device cpu \
            --row-chunk 128 \
            --margin-threshold 0.4 \
            --bitplane-effective-tops 640 \
            --output "nested-ladder-${{ matrix.prompt_index }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: nested-ladder-${{ matrix.prompt_index }}
          path: nested-ladder-${{ matrix.prompt_index }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nested-ladder-*
          path: nested-ladder-results
          merge-multiple: true
      - name: Aggregate nested bitplane gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("nested-ladder-results").glob("*.json"))
          if not files:
              raise SystemExit("no nested ladder results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["prompt_index"])
          total_tokens = sum(point["evaluated_tokens"] for point in points)
          unsafe = sum(len(point["unsafe_positions"]) for point in points)
          fallbacks = sum(len(point["fallback_positions"]) for point in points)
          q8_errors = sum(len(point["q8_error_positions"]) for point in points)
          flagged = sum(
              point["flagged_fraction"] * point["evaluated_tokens"]
              for point in points
          )
          failed_prompts = [
              point["prompt_id"] for point in points if not point["qualifies"]
          ]
          worst_overlap = max(
              point["budget"]["required_overlap_fraction"] for point in points
          )
          worst_ratio = max(
              point["budget"]["ideal_seconds_per_token"]
              / point["budget"]["baseline_seconds_per_token"]
              for point in points
          )
          survives = not failed_prompts and unsafe == 0 and fallbacks == 0 and q8_errors == 0
          payload = {
              "evidence_level": "E2 third-held-out nested bitplane ladder gate",
              "model": points[0]["model"],
              "prompts": len(points),
              "tokens": total_tokens,
              "unsafe_accepts": unsafe,
              "exact_fallbacks": fallbacks,
              "q8_teacher_forced_errors": q8_errors,
              "flagged_fraction": flagged / total_tokens,
              "worst_required_overlap_fraction": worst_overlap,
              "worst_ideal_ratio_to_native_4b": worst_ratio,
              "failed_prompts": failed_prompts,
              "survives": survives,
              "points": points,
              "decision": (
                  "advance nested full-rank bitplane ladder"
                  if survives
                  else "reject tested nested full-rank bitplane ladder"
              ),
              "next_candidate": (
                  "implement exact residual above Q8 and candidate-block generation"
                  if survives
                  else "measure Q8-to-Q10 nested consensus only on unresolved tokens"
              ),
          }
          Path("nested_bitplane_ladder_gate.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          summary = {
              "prompts": payload["prompts"],
              "tokens": total_tokens,
              "unsafe_accepts": unsafe,
              "exact_fallbacks": fallbacks,
              "q8_teacher_forced_errors": q8_errors,
              "flagged_fraction": payload["flagged_fraction"],
              "worst_required_overlap_fraction": worst_overlap,
              "worst_ideal_ratio_to_native_4b": worst_ratio,
              "failed_prompts": failed_prompts,
              "decision": payload["decision"],
          }
          Path("nested-ladder-comment.md").write_text(
              "## Third-held-out nested bitplane ladder gate\n\n```json\n"
              + json.dumps(summary, indent=2, ensure_ascii=False)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish PR report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file nested-ladder-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: nested-bitplane-ladder-gate
          path: nested_bitplane_ladder_gate.json
