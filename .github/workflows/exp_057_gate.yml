name: EXP-057 pinned real-weight structure Gate

on:
  workflow_dispatch:

concurrency:
  group: exp-057-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pinned checkpoint cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exp_057_huggingface
          key: exp-057-tinystories-1m-3m-8m-v1
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run isolated reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP057_OUTPUT_DIR: ${{ runner.temp }}/exp_057_reproduction
          EXP057_CACHE_DIR: ${{ runner.temp }}/exp_057_huggingface
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: bash experiments/exp_057/reproduce.sh
      - name: Upload isolated reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-057-manual-reproduction-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_057_reproduction
          if-no-files-found: warn
          retention-days: 30
