name: EXP-057 pinned real-weight structure Gate

on:
  pull_request:
    paths:
      - "vortex_runtime/weight_structure.py"
      - "tests/exp_057/**"
      - "experiments/exp_057/**"
      - "scripts/finalize_exp_057.py"
      - ".github/workflows/exp_057_gate.yml"
  workflow_dispatch:

concurrency:
  group: exp-057-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pinned checkpoint cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exp_057_huggingface
          key: exp-057-tinystories-1m-3m-8m-v1
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run EXP-057 reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP057_OUTPUT_DIR: ${{ runner.temp }}/exp_057_candidate
          EXP057_CACHE_DIR: ${{ runner.temp }}/exp_057_huggingface
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: bash experiments/exp_057/reproduce.sh
      - name: Upload EXP-057 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-057-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_057_candidate
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/exp-057-real-weight-structure'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-057-real-weight-structure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository validation environment
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5 numpy==2.1.3
      - name: Download authority and finalize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf results/exp_057 "${RUNNER_TEMP}/exp057"
          mkdir -p results/exp_057 "${RUNNER_TEMP}/exp057"
          gh run download 30824957941 \
            --repo "${GITHUB_REPOSITORY}" \
            --name exp-057-candidate-30824957941 \
            --dir "${RUNNER_TEMP}/exp057"
          cp -a "${RUNNER_TEMP}/exp057/." results/exp_057/
          python scripts/finalize_exp_057.py
          (cd results/exp_057 && sha256sum -c checksums.sha256)
          python -m pytest -q tests/exp_057/test_weight_structure.py
          python scripts/run_validation.py
      - name: Commit frozen evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_057 RESEARCH_STATE.md DECISION_LOG.md FAILED_APPROACHES.md NEXT_EXPERIMENT.md docs/research/EXPERIMENT_057_REAL_WEIGHT_STRUCTURE.md
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "research(exp057): freeze evidence and register EXP-058"
          git push origin HEAD:research/exp-057-real-weight-structure
