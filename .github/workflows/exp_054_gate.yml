name: EXP-054 reduced decision-diagram Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vortex_runtime/decision_diagram.py"
      - "tests/exp_054/**"
      - "experiments/exp_054/**"
      - "docs/research/EXPERIMENT_054_REDUCED_DECISION_DIAGRAM.md"
      - ".github/workflows/exp_054_gate.yml"
      - "NEXT_EXPERIMENT.md"

concurrency:
  group: exp-054-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decision-diagram-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify mandatory files
        run: |
          set -euo pipefail
          required=(
            AGENTS.md RESEARCH_STATE.md FAILED_APPROACHES.md DECISION_LOG.md
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md NEXT_EXPERIMENT.md
            ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md
            docs/PROOF_FIRST_CONTRACT.md docs/WORK_SESSION_PROTOCOL.md
            docs/research/EXPERIMENT_054_REDUCED_DECISION_DIAGRAM.md
            vortex_runtime/bit_circuit.py vortex_runtime/decision_diagram.py
            tests/exp_054/test_decision_diagram.py
            experiments/exp_053/run_experiment.py
            experiments/exp_054/config.json experiments/exp_054/run_experiment.py
            experiments/exp_054/run_current_env.sh experiments/exp_054/reproduce.sh
            experiments/exp_054/future_gpu_run.sh
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done

      - name: Install pinned validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 huggingface_hub==0.29.3 \
            safetensors==0.5.3 tokenizers==0.21.1
          python -m pip freeze | sort | tee exp054-pip-freeze.txt

      - name: Run EXP-054 diagram tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_054

      - name: Run repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_validation.py

      - name: Run exhaustive reduced-diagram Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf results/exp_054_candidate
          bash experiments/exp_054/run_current_env.sh 2>&1 | tee exp054-workflow.log

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("results/exp_054_candidate")
          summary = json.loads((root / "summary.json").read_text())
          measured = summary["MEASURED"]
          derived = summary["DERIVED"]
          assert summary["experiment"] == "EXP-054"
          assert summary["evidence_level"] == "E1"
          assert summary["real_transformer_operation_replacement"] is False
          assert summary["phase_d_status"] == "NOT TESTED"
          assert measured["case_count"] == 24
          assert measured["order_row_count"] == 48
          assert measured["completed_order_validations"] > 0
          assert measured["total_exhaustively_validated_assignments"] > 0
          assert measured["exact_mismatches"] == 0
          assert measured["truth_table_representations"] == 0
          assert math.isfinite(measured["selected_global_p50_query_probe_fraction"])
          assert math.isfinite(measured["selected_global_p90_query_probe_fraction"])
          assert derived["decision"] in {
              "CONTINUE_REDUCED_DECISION_DIAGRAM_TO_REAL_OPERATION_REPLACEMENT",
              "REJECT_EXACT_REDUCED_DECISION_DIAGRAM_AS_CORE_RETAIN_BDD_REFERENCE_AUXILIARY",
          }
          assert "root-to-terminal" in derived["query_fraction_scope"]
          for path in (
              root / "raw" / "cases.jsonl",
              root / "raw" / "order_rows.jsonl",
              root / "processed" / "aggregate.json",
              root / "checksums.sha256",
          ):
              assert path.is_file(), path
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-054-candidate-${{ github.run_id }}
          path: |
            results/exp_054_candidate
            exp054-workflow.log
            exp054-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
