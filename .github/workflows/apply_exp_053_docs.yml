name: Apply EXP-053 durable documents

on:
  pull_request:
    paths:
      - ".github/workflows/apply_exp_053_docs.yml"

permissions:
  contents: write

concurrency:
  group: apply-exp-053-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'research/exp-053-bit-exact-decision-circuit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 huggingface_hub==0.29.3 \
            safetensors==0.5.3 tokenizers==0.21.1

      - name: Apply durable state
        run: |
          python scripts/finalize_exp_053.py
          # GitHub Actions tokens cannot push workflow-file changes. The
          # scientific workflow is manualized separately through the connected
          # GitHub write API after this validated document commit lands.
          git checkout -- .github/workflows/exp_053_gate.yml

      - name: Validate
        run: |
          set -euo pipefail
          (cd results/exp_053 && sha256sum -c checksums.sha256)
          grep -q "EXP-054" NEXT_EXPERIMENT.md
          grep -q "REJECT_BIT_EXACT_DECISION_CIRCUIT" RESEARCH_STATE.md
          python -m pytest -q tests/exp_053
          python scripts/run_validation.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "state already finalized"
            exit 0
          fi
          git commit -m "research(exp053): finalize decision and register EXP-054"
          git push origin HEAD:${{ github.head_ref }}
