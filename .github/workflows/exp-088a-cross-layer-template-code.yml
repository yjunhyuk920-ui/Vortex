name: exp-088a-cross-layer-template-code

on:
  push:
    branches: [research/exp-088a-cross-layer-template-code]
  pull_request:
    branches: [research/exp-087a-cross-weight-context-code]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-088a-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  model-free-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify pins
        run: |
          python - <<'PY'
          import safetensors, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          PY
      - name: Cross-layer exact and positive controls
        run: python -m pytest -q tests/exp_088a
      - name: Syntax checks
        run: |
          python -m py_compile vortex_runtime/cross_layer_template_code.py \
            experiments/exp_088a/run_experiment.py experiments/exp_088a/update_ledgers.py
      - name: Frozen preregistration check
        run: |
          python experiments/exp_088a/update_ledgers.py --mode preregister
          grep -q EXP088A_CROSS_LAYER_TEMPLATE_CODE NEXT_EXPERIMENT.md
          git diff --check

  official-checkpoint-gate:
    if: ${{ !contains(github.event.head_commit.message || '', '[exp088-results]') }}
    needs: model-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Execute all-layer no-forward Gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/exp_088a/${GITHUB_SHA}
          python experiments/exp_088a/run_experiment.py \
            --config experiments/exp_088a/config.json \
            --output-dir results/exp_088a/${GITHUB_SHA} \
            2>&1 | tee results/exp_088a/${GITHUB_SHA}/run.log
      - name: Update canonical ledgers
        run: python experiments/exp_088a/update_ledgers.py --result results/exp_088a/${GITHUB_SHA}/result.json
      - name: Refresh checksums
        run: |
          cd results/exp_088a/${GITHUB_SHA}
          sha256sum result.json run.log raw/role_rows.json artifacts/deterministic_core.json > checksums.sha256
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-088a-${{ github.sha }}
          path: results/exp_088a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and ledgers on branch push
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_088a/${GITHUB_SHA}/ docs/research/EXP_088A_LATEST_RESULT.md \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md FAILED_APPROACHES_RECENT.md \
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record EXP-088A cross-layer template Gate [exp088-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish summary
        if: always()
        run: |
          if test -f results/exp_088a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r=json.loads((Path('results/exp_088a')/os.environ['GITHUB_SHA']/'result.json').read_text())
          a=r.get('DERIVED',{}).get('aggregate',{})
          print('## EXP-088A')
          print(f"- decision: `{r['authoritative_decision']}`")
          print(f"- total/p50/p95: `{a.get('total_information_fraction','NOT_RUN')}/{a.get('effective_layer_fraction_p50','NOT_RUN')}/{a.get('effective_layer_fraction_p95','NOT_RUN')}`")
          print(f"- role-wise plans: `{a.get('role_wise_best_candidate_names','NOT_RUN')}`")
          PY
          fi
