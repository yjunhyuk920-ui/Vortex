name: EXP-063 causal cached-KV equivalence Gate

on:
  pull_request:
    paths:
      - "vortex_runtime/kv_equivalence.py"
      - "tests/exp_063/**"
      - "experiments/exp_063/**"
      - ".github/workflows/exp_063_gate.yml"
  workflow_dispatch:

concurrency:
  group: exp-063-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pinned checkpoint cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exp_063_huggingface
          key: exp-058-tinystories-1m-3m-8m-v1
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run EXP-063 reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP063_OUTPUT_DIR: ${{ runner.temp }}/exp_063_candidate
          EXP063_CACHE_DIR: ${{ runner.temp }}/exp_063_huggingface
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: bash experiments/exp_063/reproduce.sh
      - name: Upload EXP-063 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-063-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_063_candidate
          if-no-files-found: error
          retention-days: 30
