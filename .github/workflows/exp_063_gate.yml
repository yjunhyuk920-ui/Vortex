name: EXP-063 causal cached-KV equivalence Gate

on:
  pull_request:
    paths:
      - "vortex_runtime/kv_equivalence.py"
      - "tests/exp_063/**"
      - "experiments/exp_063/**"
      - "scripts/finalize_exp_063.py"
      - ".github/workflows/exp_063_gate.yml"
  workflow_dispatch:

concurrency:
  group: exp-063-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pinned checkpoint cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exp_063_huggingface
          key: exp-058-tinystories-1m-3m-8m-v1
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run EXP-063 reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP063_OUTPUT_DIR: ${{ runner.temp }}/exp_063_candidate
          EXP063_CACHE_DIR: ${{ runner.temp }}/exp_063_huggingface
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: bash experiments/exp_063/reproduce.sh
      - name: Upload EXP-063 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-063-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_063_candidate
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/exp-063-causal-kv-equivalence'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-063-causal-kv-equivalence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check safetensors==0.5.3
      - name: Download authority and finalize
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf results/exp_063 "${RUNNER_TEMP}/exp063"
          mkdir -p results/exp_063 "${RUNNER_TEMP}/exp063"
          gh run download 30846082964 \
            --repo "${GITHUB_REPOSITORY}" \
            --name exp-063-candidate-30846082964 \
            --dir "${RUNNER_TEMP}/exp063"
          cp -a "${RUNNER_TEMP}/exp063/." results/exp_063/
          python scripts/finalize_exp_063.py
          (cd results/exp_063 && sha256sum -c checksums.sha256)
          python -m pytest -q tests/exp_063/test_kv_equivalence.py
          python scripts/run_validation.py
      - name: Commit frozen evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_063 RESEARCH_STATE.md DECISION_LOG.md FAILED_APPROACHES.md NEXT_EXPERIMENT.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md docs/research/EXPERIMENT_063_CACHED_KV_EQUIVALENCE.md
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "research(exp063): freeze evidence and register EXP-064"
          git push origin HEAD:research/exp-063-causal-kv-equivalence
