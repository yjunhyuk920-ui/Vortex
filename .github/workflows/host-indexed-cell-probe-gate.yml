name: Host-indexed cell-probe gate

on:
  pull_request:
    paths:
      - "vortex_runtime/host_indexed_cell_probe.py"
      - "tests/test_host_indexed_cell_probe.py"
      - "scripts/run_host_indexed_cell_probe_gate.py"
      - "docs/EXPERIMENT_043_HOST_INDEXED_CELL_PROBE_GATE.md"
      - ".github/workflows/host-indexed-cell-probe-gate.yml"

concurrency:
  group: host-cell-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  certify:
    if: github.head_ref == 'research/host-indexed-cell-probe-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Validate cell-probe implementation
        run: |
          test -f vortex_runtime/host_indexed_cell_probe.py
          test -f tests/test_host_indexed_cell_probe.py
          python -m pytest -q tests/test_host_indexed_cell_probe.py
      - name: Generate certificate
        run: |
          python scripts/run_host_indexed_cell_probe_gate.py \
            --benchmark-cells 262144 \
            --benchmark-steps 200000 \
            --benchmark-repeats 5 \
            --output results/host_indexed_cell_probe_gate.json
      - name: Build PR report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/host_indexed_cell_probe_gate.json")
              .read_text(encoding="utf-8")
          )
          report = {
              "evidence_level": payload["evidence_level"],
              "micro_table": payload["micro_table"],
              "balanced_cache_frontier": payload["balanced_cache_frontier"],
              "indistinguishable_record_adversaries": payload["indistinguishable_record_adversaries"],
              "host_prototype": payload["host_prototype"],
              "target_projection": payload["target_projection"],
              "scope_separation": payload["scope_separation"],
              "conclusion": payload["conclusion"],
              "next_obligation": payload["next_obligation"],
          }
          Path("host-cell-probe-comment.md").write_text(
              "## Host-indexed exact-decision cell-probe Gate\n\n```json\n"
              + json.dumps(report, indent=2, ensure_ascii=False)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file host-cell-probe-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: host-indexed-cell-probe-gate
          path: results/host_indexed_cell_probe_gate.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/host_indexed_cell_probe_gate.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(gate): commit host-indexed cell-probe evidence"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
