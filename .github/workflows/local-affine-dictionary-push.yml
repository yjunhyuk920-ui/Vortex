name: Local affine dictionary push frontier

on:
  push:
    branches:
      - feat/architecture-gate0-certificate
    paths:
      - ".github/workflows/local-affine-dictionary-push.yml"
      - "vortex_runtime/local_affine_dictionary.py"
      - "scripts/run_local_affine_dictionary_point.py"
      - "scripts/aggregate_local_affine_dictionary_frontier.py"
      - "tests/test_local_affine_dictionary.py"
      - "tests/test_local_affine_dictionary_frontier.py"

concurrency:
  group: local-affine-dictionary-push
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: k4-r8-b8, clusters: 4, local_rank: 8, bits: 8}
          - {name: k8-r8-b8, clusters: 8, local_rank: 8, bits: 8}
          - {name: k12-r8-b8, clusters: 12, local_rank: 8, bits: 8}
          - {name: k16-r6-b8, clusters: 16, local_rank: 6, bits: 8}
          - {name: k8-r16-b4, clusters: 8, local_rank: 16, bits: 4}
          - {name: k12-r10-b4, clusters: 12, local_rank: 10, bits: 4}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Run unit tests for dictionary path
        run: |
          python -m pytest -q \
            tests/test_local_affine_dictionary.py \
            tests/test_local_affine_dictionary_frontier.py
      - name: Measure ${{ matrix.name }}
        run: |
          python scripts/run_local_affine_dictionary_point.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --clusters ${{ matrix.clusters }} \
            --local-rank ${{ matrix.local_rank }} \
            --capsule-bits ${{ matrix.bits }} \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: local-affine-push-${{ matrix.name }}
          path: ${{ matrix.name }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: local-affine-push-*
          path: local-affine-results
          merge-multiple: true
      - name: Aggregate local dictionary frontier
        run: |
          mapfile -t files < <(find local-affine-results -type f -name '*.json' | sort)
          python scripts/aggregate_local_affine_dictionary_frontier.py \
            "${files[@]}" \
            --output local_affine_dictionary_frontier.json
      - name: Add immutable provenance
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("local_affine_dictionary_frontier.json")
          raw_bytes = raw.read_bytes()
          payload = json.loads(raw_bytes)
          payload["workflow"] = {
              "run_id": int(os.environ["RUN_ID"]),
              "head_sha": os.environ["HEAD_SHA"],
              "raw_file_sha256": hashlib.sha256(raw_bytes).hexdigest(),
          }
          output = Path("results/tinyllama_1_1b_local_affine_dictionary_frontier.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-local-affine-dictionary-push-frontier
          path: local_affine_dictionary_frontier.json
      - name: Commit immutable evidence
        env:
          BRANCH: feat/architecture-gate0-certificate
        run: |
          path=results/tinyllama_1_1b_local_affine_dictionary_frontier.json
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo "Local affine dictionary evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(dictionary): commit isolated local affine frontier"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
