name: Apply EXP-052 durable documents

on:
  pull_request:
    paths:
      - ".github/workflows/apply_exp_052_docs.yml"

permissions:
  contents: write

concurrency:
  group: apply-exp-052-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'research/exp-052-exact-advice-tradeoff'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0

      - name: Apply durable state
        run: python scripts/finalize_exp_052_minimal.py

      - name: Validate
        run: |
          set -euo pipefail
          (cd results/exp_052 && sha256sum -c checksums.sha256)
          grep -q "EXP-053" NEXT_EXPERIMENT.md
          grep -q "REJECT_ENUMERATIVE_EXACT_ADVICE" RESEARCH_STATE.md
          python -m pytest -q tests/exp_052
          python scripts/run_validation.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "state already finalized"
            exit 0
          fi
          git commit -m "research(exp052): finalize decision and register EXP-053"
          git push origin HEAD:${{ github.head_ref }}
