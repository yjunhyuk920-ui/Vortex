name: EXP-052 exact advice tradeoff Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vortex_runtime/exact_advice.py"
      - "vortex_runtime/advice_closure.py"
      - "tests/exp_052/**"
      - "experiments/exp_052/**"
      - "docs/research/EXPERIMENT_052_EXACT_ADVICE_TRADEOFF.md"
      - ".github/workflows/exp_052_gate.yml"
      - "NEXT_EXPERIMENT.md"

concurrency:
  group: exp-052-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-advice-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify mandatory files
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            RESEARCH_STATE.md
            FAILED_APPROACHES.md
            DECISION_LOG.md
            ASSUMPTION_REGISTER.md
            VALIDATION_MATRIX.md
            NEXT_EXPERIMENT.md
            ARCHITECTURE.md
            HARDWARE_VALIDATION_PLAN.md
            REPRODUCIBILITY.md
            docs/PROOF_FIRST_CONTRACT.md
            docs/WORK_SESSION_PROTOCOL.md
            docs/research/EXPERIMENT_052_EXACT_ADVICE_TRADEOFF.md
            vortex_runtime/exact_advice.py
            vortex_runtime/advice_closure.py
            tests/exp_052/test_exact_advice.py
            tests/exp_052/test_advice_closure.py
            experiments/exp_052/config.json
            experiments/exp_052/run_experiment.py
            experiments/exp_052/run_current_env.sh
            experiments/exp_052/reproduce.sh
            experiments/exp_052/future_gpu_run.sh
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done

      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 \
            huggingface_hub==0.29.3 \
            safetensors==0.5.3 \
            tokenizers==0.21.1
          python -m pip freeze | sort | tee exp052-pip-freeze.txt

      - name: Run EXP-052 exact-advice tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_052

      - name: Run repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_validation.py

      - name: Run pinned exact-state Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          HF_HOME: ${{ runner.temp }}/hf-exp052
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          rm -rf results/exp_052_candidate
          bash experiments/exp_052/run_current_env.sh 2>&1 | tee exp052-workflow.log

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("results/exp_052_candidate")
          summary = json.loads((root / "summary.json").read_text())
          measured = summary["MEASURED"]
          derived = summary["DERIVED"]
          assert summary["experiment"] == "EXP-052"
          assert summary["evidence_level"] == "E1"
          assert summary["complete_real_operation_replacement"] is False
          assert summary["phase_d_status"] == "NOT TESTED"
          assert measured["model_count"] == 3
          assert measured["prompt_case_count"] == 18
          assert measured["state_count"] == 1152
          assert measured["expected_state_count"] == 1152
          assert measured["excluded_prompt_count"] == 0
          assert measured["fold_row_count"] == 36
          assert measured["wrong_advice_hits"] == 0
          assert measured["build_eval_prompt_leakage"] == 0
          assert measured["replay_all_exact"] is True
          assert measured["independent_state_wrong_hits"] == 0
          assert math.isfinite(
              measured["p90_observed_reuse_fully_accounted_target_fraction"]
          )
          assert derived["required_hit_rate_infinite_reuse"] > 0.98
          assert derived["required_hit_rate_at_85_reuses"] > 0.999
          assert derived["decision"] in {
              "CONTINUE_ENUMERATIVE_EXACT_ADVICE_TO_OPERATION_REPLACEMENT",
              "REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY",
          }
          required = [
              root / "raw" / "state_records.jsonl",
              root / "raw" / "fold_rows.jsonl",
              root / "raw" / "replay_controls.json",
              root / "raw" / "independent_state_audit.json",
              root / "raw" / "checkpoint_manifest.json",
              root / "processed" / "aggregate.json",
              root / "checksums.sha256",
          ]
          for path in required:
              assert path.is_file(), path
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-052-candidate-${{ github.run_id }}
          path: |
            results/exp_052_candidate
            exp052-workflow.log
            exp052-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
