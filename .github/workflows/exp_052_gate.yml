name: EXP-052 exact advice tradeoff Gate

on:
  workflow_dispatch:

concurrency:
  group: exp-052-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-advice-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify mandatory files
        run: |
          set -euo pipefail
          required=(
            AGENTS.md RESEARCH_STATE.md FAILED_APPROACHES.md DECISION_LOG.md
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md NEXT_EXPERIMENT.md
            ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md
            docs/PROOF_FIRST_CONTRACT.md docs/WORK_SESSION_PROTOCOL.md
            docs/research/EXPERIMENT_052_EXACT_ADVICE_TRADEOFF.md
            vortex_runtime/exact_advice.py vortex_runtime/advice_closure.py
            tests/exp_052/test_exact_advice.py
            tests/exp_052/test_advice_closure.py
            tests/exp_052/test_accounting_reuse_api.py
            experiments/exp_052/config.json experiments/exp_052/run_experiment.py
            experiments/exp_052/run_current_env.sh experiments/exp_052/reproduce.sh
            experiments/exp_052/future_gpu_run.sh
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done

      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 huggingface_hub==0.29.3 \
            safetensors==0.5.3 tokenizers==0.21.1
          python -m pip freeze | sort | tee exp052-pip-freeze.txt

      - name: Run exact-advice tests and repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/exp_052
          python scripts/run_validation.py

      - name: Run isolated reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          HF_HOME: ${{ runner.temp }}/hf-exp052
          TOKENIZERS_PARALLELISM: "false"
          EXP052_OUTPUT_DIR: ${{ runner.temp }}/exp_052_reproduction
        run: |
          set -euo pipefail
          bash experiments/exp_052/reproduce.sh 2>&1 | tee exp052-workflow.log

      - name: Validate reproduced evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ runner.temp }}/exp_052_reproduction")
          summary = json.loads((root / "summary.json").read_text())
          measured = summary["MEASURED"]
          assert summary["experiment"] == "EXP-052"
          assert summary["evidence_level"] == "E1"
          assert summary["complete_real_operation_replacement"] is False
          assert measured["state_count"] == 1152
          assert measured["fold_row_count"] == 36
          assert measured["wrong_advice_hits"] == 0
          assert measured["build_eval_prompt_leakage"] == 0
          assert measured["replay_all_exact"] is True
          assert summary["authoritative_decision"] in {
              "CONTINUE_ENUMERATIVE_EXACT_ADVICE_TO_OPERATION_REPLACEMENT",
              "REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY",
          }
          PY

      - name: Upload isolated reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-052-manual-reproduction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exp_052_reproduction
            exp052-workflow.log
            exp052-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
