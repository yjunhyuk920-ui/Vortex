name: EXP-048 causal block amortization Gate

on:
  workflow_dispatch:

concurrency:
  group: exp-048-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  block-amortization-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify mandatory files
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            RESEARCH_STATE.md
            FAILED_APPROACHES.md
            DECISION_LOG.md
            ASSUMPTION_REGISTER.md
            VALIDATION_MATRIX.md
            NEXT_EXPERIMENT.md
            ARCHITECTURE.md
            HARDWARE_VALIDATION_PLAN.md
            REPRODUCIBILITY.md
            docs/PROOF_FIRST_CONTRACT.md
            docs/WORK_SESSION_PROTOCOL.md
            docs/research/EXPERIMENT_048_CAUSAL_BLOCK_VERIFICATION_AMORTIZATION.md
            vortex_runtime/block_verify.py
            tests/exp_048/test_block_verify.py
            experiments/exp_048/config.json
            experiments/exp_048/run_experiment.py
            experiments/exp_048/run_current_env.sh
            experiments/exp_048/reproduce.sh
            experiments/exp_048/future_gpu_run.sh
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done

      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 \
            huggingface_hub==0.29.3 \
            safetensors==0.5.3 \
            tokenizers==0.21.1
          python -m pip freeze | sort | tee exp048-pip-freeze.txt

      - name: Run EXP-048 exactness tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_048

      - name: Run repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_validation.py

      - name: Run pinned real-checkpoint reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          HF_HOME: ${{ runner.temp }}/hf-exp048
          TOKENIZERS_PARALLELISM: "false"
          VORTEX_EXP048_OUTPUT_DIR: ${{ runner.temp }}/exp_048_reproduction
        run: |
          set -euo pipefail
          rm -rf "${VORTEX_EXP048_OUTPUT_DIR}"
          bash experiments/exp_048/run_current_env.sh 2>&1 | tee exp048-workflow.log

      - name: Validate evidence contract
        env:
          REPRO_ROOT: ${{ runner.temp }}/exp_048_reproduction
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["REPRO_ROOT"])
          summary = json.loads((root / "summary.json").read_text())
          assert summary["experiment"] == "EXP-048"
          assert summary["evidence_level"] == "E1"
          assert summary["complete_real_operation_replacement"] is False
          assert summary["phase_d_status"] == "NOT TESTED"
          measured = summary["MEASURED"]
          assert measured["model_count"] == 3
          assert measured["case_count"] == 18
          assert measured["prompt_family_count"] == 6
          assert measured["exact_output_mismatches_b1"] == 0
          assert measured["exact_output_mismatches_b2"] == 0
          assert measured["exact_output_mismatches_b3"] == 0
          assert measured["deployable_future_information_uses"] == 0
          assert measured["b1_oracle_block_size"] == 96
          assert measured["b1_oracle_target_equivalent_stream_fraction"] == 1 / 96
          assert summary["DERIVED"]["b1_is_non_deployable_future_oracle"] is True
          assert summary["gate"]["decision"] == "REJECT_PARTIAL_LAYER_SELF_DRAFT_CORE_RETAIN_EXACT_BLOCK_VERIFIER"
          assert (root / "raw" / "cases.jsonl").is_file()
          assert (root / "raw" / "checkpoint_manifest.json").is_file()
          assert (root / "checksums.sha256").is_file()
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload isolated reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-048-reproduction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exp_048_reproduction
            exp048-workflow.log
            exp048-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
