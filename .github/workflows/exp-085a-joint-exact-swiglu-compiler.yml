name: exp-085a-joint-exact-swiglu-compiler

on:
  pull_request:
    branches:
      - research/fixed-public-dynamic-executor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp-085a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  official-checkpoint-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify package pins
        run: |
          python - <<'PY'
          import safetensors, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          print(torch.__version__, transformers.__version__, safetensors.__version__)
          PY
      - name: Exact compiler unit and fail-closed controls
        run: python -m pytest -q tests/test_joint_exact_swiglu_compiler.py
      - name: Verify frozen preregistration materializes without mutation of the remote branch
        run: |
          python experiments/exp_085a/update_ledgers.py --mode preregister
          grep -q 'EXP085A_PREREGISTERED' NEXT_EXPERIMENT.md
          git diff --check
      - name: Record host
        run: |
          mkdir -p results/exp_085a/${GITHUB_SHA}
          {
            uname -a
            lscpu
            free -b
            df -B1 .
            python --version
          } | tee results/exp_085a/${GITHUB_SHA}/host.txt
      - name: Official SmolLM2 causal activation and exact compiler Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_085a/run_experiment.py \
            --config experiments/exp_085a/config.json \
            --output-dir results/exp_085a/${GITHUB_SHA} \
            2>&1 | tee results/exp_085a/${GITHUB_SHA}/run.log
      - name: Upload immutable raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-085a-joint-exact-swiglu-${{ github.sha }}
          path: results/exp_085a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish summary
        if: always()
        run: |
          if test -f results/exp_085a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p = Path("results/exp_085a") / os.environ["GITHUB_SHA"] / "result.json"
          r = json.loads(p.read_text())
          print("## EXP-085A")
          print(f"- verdict: `{r['authoritative_decision']}`")
          if "aggregates" in r:
              for key in ("oracle", "sound"):
                  a = r["aggregates"][key]
                  print(f"- {key}: pages p50/p95 `{a['pages_p50']}/{a['pages_p95']}`, whole fraction `{a['whole_model_fraction_p50']:.6%}/{a['whole_model_fraction_p95']:.6%}`, fallback `{a['fallback_rate']:.6%}`")
              print(f"- projected metadata: `{r['projected']['target_hot_metadata_gib']:.6f} GiB`")
          PY
          fi
