name: Session prefill response basis

on:
  pull_request:
    paths:
      - "vortex_runtime/session_prefill_basis.py"
      - "scripts/run_session_prefill_candidate_coverage.py"
      - "tests/test_session_prefill_basis.py"
      - ".github/workflows/session-prefill-basis.yml"

concurrency:
  group: session-prefill-basis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  tinyllama-session-prefill:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feat/architecture-gate0-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Check direct session compiler changes
        id: changes
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            vortex_runtime/session_prefill_basis.py \
            scripts/run_session_prefill_candidate_coverage.py \
            tests/test_session_prefill_basis.py \
            .github/workflows/session-prefill-basis.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Compile from exact prompt prefill and measure unseen continuation
        if: steps.changes.outputs.run == 'true'
        run: |
          python scripts/run_session_prefill_candidate_coverage.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --max-rank 72 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output session_prefill_candidate_coverage.json
      - name: Normalize evidence with provenance
        if: steps.changes.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("session_prefill_candidate_coverage.json")
          raw_bytes = raw.read_bytes()
          payload = json.loads(raw_bytes)
          payload["workflow"] = {
              "run_id": int(os.environ["RUN_ID"]),
              "head_sha": os.environ["HEAD_SHA"],
              "raw_file_sha256": hashlib.sha256(raw_bytes).hexdigest(),
          }
          output = Path(
              "results/tinyllama_1_1b_session_prefill_candidate_coverage.json"
          )
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          PY
      - name: Build PR report
        if: steps.changes.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("session_prefill_candidate_coverage.json").read_text()
          )
          summary = {
              "prompt_tokens": data["prompt_tokens"],
              "compiled_rank_statistics": data["compiled_rank_statistics"],
              "prompt_reconstruction": data["prompt_reconstruction"],
              "exact_top1_match_rate": data["exact_top1_match_rate"],
              "top32_coverage": data["coverage_at_k"]["32"],
              "rank_statistics": data["rank_statistics"],
              "first_divergence": data["first_divergence"],
              "decision": data["decision"],
          }
          body = (
              "## Session prefill response basis\n\n"
              "```json\n"
              + json.dumps(summary, indent=2, ensure_ascii=False)
              + "\n```"
          )
          Path("session-prefill-comment.md").write_text(body, encoding="utf-8")
          PY
      - name: Publish PR report
        if: steps.changes.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file session-prefill-comment.md
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.run == 'true'
        with:
          name: tinyllama-session-prefill-response-basis
          path: session_prefill_candidate_coverage.json
      - name: Commit evidence when changed
        if: steps.changes.outputs.run == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_session_prefill_candidate_coverage.json
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo "Session prefill evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(session): commit exact-prompt response-basis result"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
