name: EXP-055 column-signature popcount Gate

on:
  pull_request:
    paths:
      - "vortex_runtime/column_signature.py"
      - "tests/exp_055/**"
      - "experiments/exp_055/**"
      - ".github/workflows/exp_055_gate.yml"
  workflow_dispatch:

concurrency:
  group: exp-055-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run EXP-055 reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP055_OUTPUT_DIR: ${{ runner.temp }}/exp_055_candidate
        run: bash experiments/exp_055/reproduce.sh
      - name: Upload EXP-055 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-055-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_055_candidate
          if-no-files-found: error
          retention-days: 30
