name: exp-097a-residual-bank-specificity

on:
  push:
    branches:
      - research/exp-097a-causal-residual-codebook-gate
  pull_request:
    branches:
      - research/exp-096a-residual-margin-certificate-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-097a-specificity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install frozen public-checkpoint runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify inherited numerical pins
        run: |
          python - <<'PY'
          import numpy, scipy, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert numpy.__version__ == "2.1.3", numpy.__version__
          assert scipy.__version__ == "1.14.1", scipy.__version__
          PY
      - name: Syntax check
        run: python -m py_compile experiments/exp_097a/run_experiment.py
      - name: Validate frozen config
        run: |
          python - <<'PY'
          import json
          from experiments.exp_097a.run_experiment import validate_config
          cfg=json.load(open('experiments/exp_097a/config.json'))
          validate_config(cfg)
          print('config: PASS')
          PY

  public-checkpoint-gate:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[exp097a-results]') }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install frozen public-checkpoint runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Record host
        run: |
          mkdir -p results/exp_097a/${GITHUB_SHA}
          {
            uname -a
            lscpu
            free -b
            df -B1 .
            python --version
          } | tee results/exp_097a/${GITHUB_SHA}/host.txt
      - name: Execute public-checkpoint specificity Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_097a/run_experiment.py \
            --config experiments/exp_097a/config.json \
            --output-dir results/exp_097a/${GITHUB_SHA} \
            2>&1 | tee results/exp_097a/${GITHUB_SHA}/run.log
      - name: Write latest-result handoff
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          sha=os.environ['GITHUB_SHA']
          p=Path('results/exp_097a')/sha/'result.json'
          r=json.loads(p.read_text())
          h=r['aggregate']['holdout']
          lines=[
            '# EXP-097A latest result — Residual Bank Specificity Gate', '',
            f'- source commit: `{sha}`',
            f'- decision: `{r["authoritative_decision"]}`',
            f'- all banks frozen before target: `{r["all_banks_frozen_before_any_target"]}`',
            f'- matched controls: `{r["matched_controls"]}`', '',
            '## Untouched holdout', '',
          ]
          for name in ('same','cross_prompt','vocab_permuted'):
            s=h[name]
            lines += [
              f'### {name}',
              f'- certificates: `{s["certified"]}/{s["total"]}` (`{s["certificate_fraction"]:.9%}`)',
              f'- support p50/p95: `{s["support_p50"]} / {s["support_p95"]}`',
              f'- L1 p50/p95: `{s["l1_p50"]} / {s["l1_p95"]}`',
              '',
            ]
          lines += [
            '## Claim boundary', '',
            'This is a DEV-W specificity falsification Gate. A causal coefficient generator,',
            'fine dense arithmetic reduction, TARGET-W, physical 8-GiB execution, CUDA/SASS,',
            'and same-machine 4B-class latency remain `NOT TESTED`.', ''
          ]
          Path('docs/research/EXP_097A_LATEST_RESULT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Refresh evidence checksums
        run: |
          cd results/exp_097a/${GITHUB_SHA}
          find . -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > checksums.sha256
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-097a-${{ github.sha }}
          path: results/exp_097a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and handoff
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_097a/${GITHUB_SHA}/ docs/research/EXP_097A_LATEST_RESULT.md
          if git diff --cached --quiet; then
            echo 'No result delta'
            exit 0
          fi
          git commit -m "research: record EXP-097A residual-bank specificity Gate [exp097a-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish summary
        if: always()
        run: |
          if test -f results/exp_097a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r=json.loads((Path('results/exp_097a')/os.environ['GITHUB_SHA']/'result.json').read_text())
          print('## EXP-097A residual-bank specificity')
          print(f"- decision: `{r['authoritative_decision']}`")
          print(f"- matched controls: `{r['matched_controls']}`")
          for name, s in r['aggregate']['holdout'].items():
              print(f"- {name}: `{s['certified']}/{s['total']}`, support p95 `{s['support_p95']}`")
          PY
          fi
