name: bootstrap-exp-102a-reality-source

on:
  push:
    branches:
      - research/exp-102a-causal-segment-delta-reality-gate

permissions:
  contents: write

concurrency:
  group: bootstrap-exp102a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-source:
    if: ${{ contains(github.event.head_commit.message, '[exp102a-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
          cache: pip
      - name: Verify and extract frozen source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/exp102a_bundle.tar.gz
          echo '55763beb87d3ea891330a58ebbe00a7eca73ced9920cfdf5a4efbabaf7114a78  .bootstrap/exp102a_bundle.tar.gz' | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('.bootstrap/exp102a_bundle.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall('.')
          print(f'extracted {len(members)} EXP-102A members')
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-exp-102a-reality-source.yml
      - name: Install pinned research runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Validate reality-first source and static evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/exp_102a
          python -m py_compile \
            vortex_runtime/causal_segment_delta.py \
            experiments/exp_102a/run_experiment.py \
            experiments/exp_102a/update_ledgers.py
          sha256sum -c results/exp_102a/sandbox/checksums.sha256
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('experiments/exp_102a/config.json').read_text())
          result = json.loads(Path('results/exp_102a/sandbox/static_gate.json').read_text())
          assert config['schema'] == 'exp-102a-causal-segment-delta-reality-v1'
          assert config['reality_contract']['future_target_state_available'] is False
          assert config['reality_contract']['perfect_selector_available'] is False
          assert config['reality_contract']['unimplemented_compression_credited'] is False
          assert config['reality_contract']['free_transform_or_workspace_credited'] is False
          assert result['decision'].startswith('SURVIVE_STATIC_VRAM_ONLY')
          assert result['static_target_ledger']['storage']['raw_checkpoint_fits'] is False
          assert result['static_target_ledger']['vram']['registered_segment_count'] == 32
          print('EXP-102A bootstrap contract: PASS')
          PY
      - name: Commit and push complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: preregister EXP-102A reality-first causal segment Gate'
          git push origin HEAD:${GITHUB_REF_NAME}
