name: bootstrap-exp-102a-reality-source

on:
  push:
    branches:
      - research/exp-102a-causal-segment-delta-reality-gate

permissions:
  contents: write

concurrency:
  group: bootstrap-exp102a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-source:
    if: ${{ contains(github.event.head_commit.message, '[exp102a-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Reassemble, verify, and extract frozen source
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .bootstrap/exp102a_part_00
            .bootstrap/exp102a_part_01
            .bootstrap/exp102a_part_02
            .bootstrap/exp102a_part_03
          )
          for part in "${parts[@]}"; do test -f "$part"; done
          cat <<'SUMS' | sha256sum -c -
          074a3cfc05eb134653e4910931eda599451b9fc439cd4d681d09936fb68516b1  .bootstrap/exp102a_part_00
          d9e7a003d91289cf0af52b533ffef39d0ad09f3b086e7f53fa9ed99f9daea123  .bootstrap/exp102a_part_01
          b7698aa35b9fd9e8ec9ac3b48b5a4c2d0d26696c96058fe858aa253460105879  .bootstrap/exp102a_part_02
          9c0ead84eb0910b0dbc52932f3697ee953461b90b6e0dfd822d1eed6317c1123  .bootstrap/exp102a_part_03
          SUMS
          cat "${parts[@]}" > /tmp/exp102a_source.tar.gz
          echo "e2526a81ecdd0d88f724d3b998122a996c339529e6fc84d014237a13d3cdb418  /tmp/exp102a_source.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/exp102a_source.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall('.')
          print(f'extracted {len(members)} EXP-102A members')
          PY
          sha256sum -c EXP102A_SOURCE_MANIFEST.sha256
          python experiments/exp_102a/bootstrap_governance.py
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/exp-102a-reality-first-causal-block.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'run: python -m pip install --disable-pip-version-check pytest==8.3.3'
          new = 'run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt pytest==8.3.3'
          if old not in text:
              raise SystemExit('production contract install line not found')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -rf .bootstrap .pytest_cache vortex_runtime/__pycache__
          rm -f .github/workflows/bootstrap-exp-102a-reality-source.yml
          rm -f EXP102A_SOURCE_MANIFEST.sha256 MANIFEST.sha256 APPLY_EXP102A_SOURCE.sh
      - name: Install pinned research runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt pytest==8.3.3
      - name: Validate materialized reality-first source
        run: |
          python -m pytest -q tests/exp_102a
          python -m py_compile \
            vortex_runtime/reality_first_speculative.py \
            experiments/exp_102a/run_experiment.py \
            experiments/exp_102a/update_ledgers.py \
            experiments/exp_102a/bootstrap_governance.py
          python - <<'PY'
          import json
          from experiments.exp_102a.run_experiment import validate_config

          config = json.load(open('experiments/exp_102a/config.json', encoding='utf-8'))
          validate_config(config)
          assert config['authoritative_arm'] == 'REAL_EXECUTOR_ONLY'
          assert config['block_lengths'] == [96]
          assert config['target_contract']['raw_p50_fraction'] == 0.011851851851851851
          assert 'future_target_tokens' in config['forbidden_grants']
          print('EXP-102A bootstrap contract: PASS')
          PY
      - name: Commit and push complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: preregister EXP-102A reality-first causal draft Gate"
          git push origin HEAD:${GITHUB_REF_NAME}
