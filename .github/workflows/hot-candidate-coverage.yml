name: Hot candidate coverage

on:
  pull_request:
    paths:
      - "vortex_runtime/candidate_coverage.py"
      - "vortex_runtime/decision_tile_repair.py"
      - "scripts/run_hot_candidate_coverage.py"
      - "tests/test_candidate_coverage.py"
      - ".github/workflows/hot-candidate-coverage.yml"

concurrency:
  group: hot-candidate-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tinyllama-candidate-coverage:
    if: github.head_ref == 'feat/architecture-gate0-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Measure exact-token top-K coverage
        id: experiment
        continue-on-error: true
        run: |
          python scripts/run_hot_candidate_coverage.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --build-new-tokens 1 \
            --max-rank 32 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output hot_candidate_coverage.json
      - name: Build PR report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("hot_candidate_coverage.json")
          if not path.exists():
              body = "## Hot candidate coverage\n\nNo result JSON was produced."
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              summary = {
                  "evaluated_tokens": data.get("evaluated_tokens"),
                  "exact_top1_match_rate": data.get("exact_top1_match_rate"),
                  "coverage_at_k": data.get("coverage_at_k"),
                  "rank_statistics": data.get("rank_statistics"),
                  "first_divergence": data.get("first_divergence"),
                  "decision": data.get("decision"),
              }
              body = (
                  "## Hot candidate coverage\n\n"
                  "```json\n"
                  + json.dumps(summary, indent=2, ensure_ascii=False)
                  + "\n```"
              )
          Path("candidate-coverage-comment.md").write_text(body, encoding="utf-8")
          PY
      - name: Publish PR report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file candidate-coverage-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyllama-hot-candidate-coverage
          path: hot_candidate_coverage.json
          if-no-files-found: warn
      - name: Enforce experiment success
        if: steps.experiment.outcome != 'success'
        run: exit 1
