name: EXP-053 bit-exact decision-circuit Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vortex_runtime/bit_circuit.py"
      - "tests/exp_053/**"
      - "experiments/exp_053/**"
      - "docs/research/EXPERIMENT_053_BIT_EXACT_DECISION_CIRCUIT.md"
      - ".github/workflows/exp_053_gate.yml"
      - "NEXT_EXPERIMENT.md"

concurrency:
  group: exp-053-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circuit-compiler-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify mandatory files
        run: |
          set -euo pipefail
          required=(
            AGENTS.md RESEARCH_STATE.md FAILED_APPROACHES.md DECISION_LOG.md
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md NEXT_EXPERIMENT.md
            ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md
            docs/PROOF_FIRST_CONTRACT.md docs/WORK_SESSION_PROTOCOL.md
            docs/research/EXPERIMENT_053_BIT_EXACT_DECISION_CIRCUIT.md
            vortex_runtime/bit_circuit.py
            tests/exp_053/test_bit_circuit.py
            experiments/exp_053/config.json experiments/exp_053/run_experiment.py
            experiments/exp_053/run_current_env.sh experiments/exp_053/reproduce.sh
            experiments/exp_053/future_gpu_run.sh
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done

      - name: Install pinned validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 huggingface_hub==0.29.3 \
            safetensors==0.5.3 tokenizers==0.21.1
          python -m pip freeze | sort | tee exp053-pip-freeze.txt

      - name: Run EXP-053 compiler tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_053

      - name: Run repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_validation.py

      - name: Run exhaustive circuit Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf results/exp_053_candidate
          bash experiments/exp_053/run_current_env.sh 2>&1 | tee exp053-workflow.log

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("results/exp_053_candidate")
          summary = json.loads((root / "summary.json").read_text())
          measured = summary["MEASURED"]
          derived = summary["DERIVED"]
          assert summary["experiment"] == "EXP-053"
          assert summary["evidence_level"] == "E1"
          assert summary["real_transformer_operation_replacement"] is False
          assert summary["phase_d_status"] == "NOT TESTED"
          assert measured["case_count"] == 24
          assert measured["family_count"] == 4
          assert measured["total_exhaustively_validated_assignments"] == 4506624
          assert measured["exact_mismatch_output_bits"] == 0
          assert measured["truth_table_representations"] == 0
          assert math.isfinite(measured["p50_query_node_fraction"])
          assert math.isfinite(measured["p90_query_node_fraction"])
          assert derived["decision"] in {
              "CONTINUE_BIT_EXACT_CIRCUIT_COMPILER_TO_REAL_OPERATION_REPLACEMENT",
              "REJECT_BIT_EXACT_DECISION_CIRCUIT_COMPILER_AS_CORE_RETAIN_AIG_REFERENCE_AUXILIARY",
          }
          assert "bit-blasted arithmetic" in derived["query_fraction_scope"]
          required = [
              root / "raw" / "cases.jsonl",
              root / "raw" / "circuit_manifest.json",
              root / "processed" / "aggregate.json",
              root / "checksums.sha256",
          ]
          for path in required:
              assert path.is_file(), path
          manifest = json.loads((root / "raw" / "circuit_manifest.json").read_text())
          assert len(manifest) == 24
          for row in manifest:
              assert (root / row["path"]).is_file()
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-053-candidate-${{ github.run_id }}
          path: |
            results/exp_053_candidate
            exp053-workflow.log
            exp053-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
