name: Finalize EXP-052 durable research state

on:
  push:
    paths:
      - ".github/workflows/finalize_exp_052_state.yml"

permissions:
  contents: write

concurrency:
  group: finalize-exp-052-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/research/exp-052-exact-advice-tradeoff'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/exp-052-exact-advice-tradeoff
          fetch-depth: 0

      - name: Update durable documents
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          MARKER = "<!-- EXP-052-FINAL -->"

          def append_once(path: str, text: str) -> None:
              file_path = Path(path)
              current = file_path.read_text(encoding="utf-8")
              if MARKER in current:
                  return
              file_path.write_text(
                  current.rstrip() + "\n\n" + MARKER + "\n" + text.strip() + "\n",
                  encoding="utf-8",
              )

          append_once(
              "RESEARCH_STATE.md",
              r'''
          ## EXP-051/052 authoritative supersession

          EXP-051 was merged by PR #61 at main commit `7aad7b3e1b3d783857406ebb6435058a2aecc724`.

          EXP-051 decision:

          ```text
          REJECT_LAYER_FINALIZATION_TAIL_SKIP_CORE_RETAIN_ORACLE_AUXILIARY
          ```

          The successful EXP-051 workflow and PR preserve its metrics, but the original artifact is no longer retrievable and `results/exp_051/` was not installed before merge. This is a provenance defect and must not be silently described as a complete repository freeze.

          EXP-052 authoritative evidence:

          ```text
          results/exp_052/summary.json
          workflow 30811429049
          source head SHA d4c2328027a5377b997e9ee1d8df0f55190fb652
          workflow merge SHA db6aa2cc434b72865e42f553cdf72b46566e1726
          artifact 8854946309
          artifact size 216322 bytes
          artifact ZIP SHA-256 1beb137e1ee14fe80ded0a3309c4ed297035d552a46bf901b2e4233ab95549ca
          phase A/B/C-observation
          evidence E1
          ```

          MEASURED:

          ```text
          3 pinned models
          18 prompt cases
          1,152 exact warm states
          36 leave-one-family-out fold rows
          wrong advice hits 0
          build/evaluation prompt leakage 0
          P0 prefix held-out hit rate 0% in every family
          S0 KV-state held-out hit rate 0% in every family
          online fallback 100%
          natural exact reuse median 1, maximum 1
          p90 fully-accounted target fraction 600%
          same-state replay exact 100%
          replay minimum repetitions 85
          peak RSS 597664 KiB
          ```

          Storage closure:

          ```text
          mean prefix entry 300 bytes
          mean state entry with exact-prefix witness 408 bytes
          mean raw KV state 562289.78 bytes
          8 GiB hot index capacity 178956970 entries
          1 TiB cold capacity 2694881440 entries
          combined coverage over 2^48 independent states 6.357828752e-7
          combined minimum fallback 99.9999364217%
          ```

          Decision:

          ```text
          REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY
          ```

          Exact prefix/KV tables remain fail-closed auxiliary memoization. Enlarging the same table, changing digest width, or hiding build/fallback cost is forbidden as a core continuation.

          ## Current frontier

          `EXP-053 — Automatic Bit-Exact Decision-Circuit Compiler Gate`.

          EXP-053 changes representation class. Instead of enumerating runtime states, it compiles a bounded quantized target operator directly from weights into an exact Boolean/arithmetic decision circuit and tests whether reduction produces a sub-1.185185% query path without exponential compile/storage growth. Structured and adversarial random dense operators are both mandatory.

          Until EXP-053 executes:

          ```text
          complete real operation replacement: false
          real 405B execution: NOT TESTED
          8 GiB VRAM: NOT TESTED
          CUDA/PCIe/SSD/TTFT/tokens per second: NOT TESTED
          Phase D: NOT TESTED
          E6/E7: not achieved
          ```
          ''',
          )

          append_once(
              "DECISION_LOG.md",
              r'''
          ## D-022 — EXP-051 layer-finalization tail skipping rejected

          The favorable suffix-stable oracle required median 25% and p90 37.5% of target blocks. Favorable logical traffic was median 82.2069% and p90 99.8011%; 37.1528% of states matched and later flipped. A final-layer residual adversary required depth 8/8.

          Decision:

          ```text
          REJECT_LAYER_FINALIZATION_TAIL_SKIP_CORE_RETAIN_ORACLE_AUXILIARY
          ```

          Status: REJECTED AS CORE; ORACLE DIAGNOSTIC RETAINED.

          ## D-023 — EXP-052 enumerative exact advice rejected as core

          Exact prefix and exact KV-state tables were correct on replay but had zero held-out hits in every model/family fold. Fallback was 100%, natural exact reuse was one, and p90 fully-accounted target fraction was 6.0.

          The independent-state audit matched exact M/N coverage with zero wrong hits. Under 8 GiB hot-index and 1 TiB cold-advice budgets, combined coverage of `2^48` states was `6.357828752e-7` and the fallback floor was `0.9999993642171248`.

          Decision:

          ```text
          REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY
          ```

          Status: REJECTED AS CORE; EXACT TABLE INTEGRITY PRIMITIVE RETAINED E1.

          ## D-024 — Next Gate must be non-enumerative and weight-derived

          EXP-053 will compile bounded quantized target operators from weights into bit-exact reduced decision circuits. It must charge compile target inspection, circuit nodes/bytes, reduction, query operations, fallback, and scaling. State-table enlargement is not a valid continuation.

          Status: ACTIVE NEXT GATE — EXP-053.
          ''',
          )

          append_once(
              "FAILED_APPROACHES.md",
              r'''
          ## F-019 — Oracle layer-finalization/tail skipping as core

          Authority: PR #61 and workflow `30808285251`.

          ```text
          1,152 exact warm states
          final reconstruction mismatches 0
          suffix-stable median block depth 25%
          suffix-stable p90 block depth 37.5%
          median favorable logical bytes 82.2068758%
          p90 favorable logical bytes 99.8010577%
          transient first-match failures 428/1,152
          late-decision adversary depth 8/8
          ```

          Decision: reject fixed or reference-selected layer tail skipping as the core. Do not continue with agreement-count tuning, margin heuristics, or a skipped-layer backend without a materially new sound certificate mechanism.

          ## F-020 — Enumerative exact prefix/KV advice as core

          Authority:

          ```text
          results/exp_052/summary.json
          workflow 30811429049
          artifact ZIP SHA-256 1beb137e1ee14fe80ded0a3309c4ed297035d552a46bf901b2e4233ab95549ca
          ```

          Held-out result:

          ```text
          P0 prefix hit 0% in every family
          S0 KV-state hit 0% in every family
          fallback 100%
          natural reuse median/max 1/1
          p90 target fraction 600%
          wrong hits 0
          replay hits 100%
          ```

          Storage result:

          ```text
          8 GiB hot index +1 TiB cold advice
          2^48-state combined coverage 6.357828752e-7
          minimum fallback 99.9999364217%
          ```

          Permanent decision:

          ```text
          REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY
          ```

          Forbidden continuation: larger copies of the same state table, shorter/longer hashes presented as compression, counting replay as held-out generalization, or amortizing build cost without exact repeated queries.
          ''',
          )

          append_once(
              "ASSUMPTION_REGISTER.md",
              r'''
          ## A-026 — Exact prefix/KV advice generalizes across unseen prompt families

          EXP-052 measured zero held-out hits for every P0/S0 model/family fold while preserving zero wrong hits.

          Status: CONTRADICTED FOR ENUMERATIVE EXACT ADVICE.

          ## A-027 — Natural exact runtime states repeat at least 85 times

          EXP-052 natural exact-key reuse was median one and maximum one across 1,152 states. Same-state replay required 85 repetitions even under perfect coverage.

          Status: CONTRADICTED ON THE TESTED CORPUS; UNIVERSAL SCALE UNVERIFIED.

          ## A-028 — A non-enumerative bit-exact target circuit can compress decision work

          Assumption: compiling bounded quantized target operators directly from weights into a reduced Boolean/arithmetic circuit avoids state enumeration and yields query nodes/bytes below the final target fraction without compile/storage explosion.

          Status: ACTIVE UNVERIFIED ASSUMPTION FOR EXP-053.

          Mandatory contradiction tests: random dense weights, late-bit decision dependence, variable input width, node explosion, reduction time, exact output mismatch, and worsening size trend.
          ''',
          )

          append_once(
              "VALIDATION_MATRIX.md",
              r'''
          ## EXP-051/052 authoritative addendum

          | Claim | Phase A | Phase B | Phase C | Phase D | Evidence | Verdict |
          |---|---|---|---|---|---:|---|
          | EXP-051 final probe reconstruction | PASS | PASS | PASS: 0/1,152 mismatch | N/A | E1 | PASS implementation |
          | EXP-051 suffix-stable oracle traffic <=10% median | defined | N/A | FAIL: 82.2069% | N/A | E1 negative | REJECTED |
          | EXP-051 suffix-stable oracle traffic <=25% p90 | defined | N/A | FAIL: 99.8011% | N/A | E1 negative | REJECTED |
          | EXP-051 first match is safe | hypothesis | adversary FAIL | FAIL: 428 transient flips | N/A | E1 negative | FALSE |
          | EXP-052 exact table integrity | PASS | PASS tests | PASS: wrong hits 0 | N/A | E1 | AUXILIARY |
          | EXP-052 held-out prefix advice hit >=98.8148% | threshold | N/A | FAIL: 0% all families | N/A | E1 negative | REJECTED |
          | EXP-052 held-out KV advice hit >=98.8148% | threshold | N/A | FAIL: 0% all families | N/A | E1 negative | REJECTED |
          | EXP-052 natural exact reuse >=85 | threshold | N/A | FAIL: median/max 1/1 | N/A | E1 negative | REJECTED |
          | EXP-052 p90 fully-accounted fraction <=1.185185% | threshold | N/A | FAIL: 600% | N/A | E1 negative | REJECTED |
          | EXP-052 1 TiB independent-state fallback <=1.185185% | formula | PASS M/N | FAIL: 99.9999364% | N/A | E1 negative | REJECTED |
          | EXP-053 non-enumerative exact circuit compiler | defined | NOT TESTED | NOT TESTED | NOT TESTED | E0 | NEXT GATE |
          | Real 405B/8 GiB/target speed | formula only | N/A | NOT TESTED | NOT TESTED | E0 | NOT TESTED |
          ''',
          )

          append_once(
              "ARCHITECTURE.md",
              r'''
          ## Closed EXP-052 exact-advice architecture

          ```text
          exact build state -> exact prefix/KV entry
          exact query state -> witnessed hit OR exact target fallback
          ```

          Integrity passed, but held-out coverage was zero and natural reuse one. The architecture is auxiliary exact memoization only. It is not the core runtime and may not be rescued by table-size/hash-only changes.

          ## Active EXP-053 architecture

          ```text
          bounded quantized target weights + exact arithmetic contract
                  |
                  v
          automatic bit-level operator compiler
                  |
                  v
          exact AIG/BDD/arithmetic decision circuit
                  |
                  +--> structural reduction / common-subexpression sharing
                  +--> exact reference equivalence
                  +--> charged circuit query or exact fallback
          ```

          The core question is whether a non-enumerative weight-derived circuit remains compact and cheap on structured operators and does not explode on adversarial dense operators. Compilation, node storage, query node touches, memory traffic, and fallback are mandatory costs.
          ''',
          )

          append_once(
              "HARDWARE_VALIDATION_PLAN.md",
              r'''
          ## EXP-052 closure and EXP-053 hardware boundary

          EXP-052 is rejected before hardware promotion. No Phase-D exact-advice lookup benchmark is justified except as an auxiliary cache inside a separately successful core.

          EXP-053 may receive hardware work only after a bit-exact small-model circuit compiler:

          - replaces a real target operation on unseen states;
          - proves exact equivalence;
          - reports circuit compile time and storage;
          - reports physical circuit bytes and node evaluations per token;
          - survives random/adversarial size scaling;
          - closes the 8 GiB hot-state and 1.185185% traffic equations.

          Current Phase D remains NOT TESTED.
          ''',
          )

          append_once(
              "REPRODUCIBILITY.md",
              r'''
          ## EXP-052 frozen authority

          ```text
          results/exp_052/summary.json
          workflow 30811429049
          source head SHA d4c2328027a5377b997e9ee1d8df0f55190fb652
          workflow merge SHA db6aa2cc434b72865e42f553cdf72b46566e1726
          artifact ID 8854946309
          artifact name exp-052-candidate-30811429049
          artifact size 216322 bytes
          artifact ZIP SHA-256 1beb137e1ee14fe80ded0a3309c4ed297035d552a46bf901b2e4233ab95549ca
          phase A/B/C-observation
          evidence E1
          ```

          Scientific decision:

          ```text
          REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY
          ```

          Key original workflow hashes:

          ```text
          raw/state_records.jsonl 6c6fa9abbb7d0ef5dfd7d95f73d4494e26472730e213a277eb166a08277ab074
          raw/fold_rows.jsonl 5a8e0d57f0375e04afac4343680d9dbdc5e278479d30678723c157b99a88a206
          raw/replay_controls.json 798942600fcba6e054dd41f25ed7b12344f2ae79f6bbd13d2d49146a5b1bc97d
          raw/independent_state_audit.json d670efe1e31b540a4bc3fae5097bec1033effa4c3aec82a94c97f94064627058
          raw/checkpoint_manifest.json e800812bc9b0c12c2b53fc88fb951db81a222073595c26827d3ce44823840d0b
          processed/aggregate.json 55455c7c206fd24a21a036ef44925d3538d5976bfc7fe4ae263eeeaa68496f9c
          raw/workflow_summary.json e9de2a4aba8d515c587bc707361b62cf15b087f04b9560db99937f19d300c636
          ```

          Verify installed evidence:

          ```bash
          cd results/exp_052
          sha256sum -c checksums.sha256
          ```

          Reproduce without overwriting authority:

          ```bash
          git checkout research/exp-052-exact-advice-tradeoff
          python -m pytest -q tests/exp_052
          python scripts/run_validation.py
          bash experiments/exp_052/reproduce.sh
          ```
          ''',
          )

          append_once(
              "docs/research/EXPERIMENT_052_EXACT_ADVICE_TRADEOFF.md",
              r'''
          ## Final result

          Authoritative run:

          ```text
          workflow 30811429049
          source head SHA d4c2328027a5377b997e9ee1d8df0f55190fb652
          workflow merge SHA db6aa2cc434b72865e42f553cdf72b46566e1726
          artifact 8854946309
          artifact size 216322 bytes
          artifact ZIP SHA-256 1beb137e1ee14fe80ded0a3309c4ed297035d552a46bf901b2e4233ab95549ca
          ```

          ```text
          exact states 1,152
          fold rows 36
          wrong hits 0
          leakage 0
          prefix held-out hits 0%
          KV-state held-out hits 0%
          fallback 100%
          natural reuse median/max 1/1
          p90 charged fraction 6.0
          replay exact true
          replay minimum repetitions 85
          storage combined fallback 0.9999993642171248
          ```

          Final decision:

          ```text
          REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY
          ```
          ''',
          )

          next_text = r'''# Next Experiment

          ## Closed Gate — EXP-052

          Authority:

          ```text
          results/exp_052/summary.json
          workflow 30811429049
          source head d4c2328027a5377b997e9ee1d8df0f55190fb652
          artifact 8854946309
          ZIP SHA-256 1beb137e1ee14fe80ded0a3309c4ed297035d552a46bf901b2e4233ab95549ca
          ```

          Decision:

          ```text
          REJECT_ENUMERATIVE_EXACT_ADVICE_AS_CORE_RETAIN_FAIL_CLOSED_TABLE_AUXILIARY
          ```

          Exact tables remain auxiliary only.

          ## EXP-053 — Automatic Bit-Exact Decision-Circuit Compiler Gate

          ### Mechanism change

          EXP-053 does not enumerate runtime states. It compiles a bounded quantized target operator directly from its immutable weights and exact arithmetic contract into a reduced decision circuit.

          Initial scope:

          ```text
          Q0 independent exact arithmetic reference
          Q1 exact bit-vector/AIG compiler
          Q2 reduced ordered BDD or shared AIG reduction
          Q3 structured Transformer-like linear-margin operators
          Q4 adversarial random dense operators
          Q5 exact query execution and fallback
          ```

          ### Core contract

          - no training, adaptation, or future generated token;
          - compiler input is target weights/config only;
          - bit-exact equality for every input in the declared finite domain;
          - compile time, node count, circuit bytes, reduction time, query node touches, and fallback all charged;
          - no truth-table enumeration presented as a compiler;
          - structured success may not erase random/adversarial failure;
          - claim scope remains bounded quantized operators until a real checkpoint operation is replaced.

          ### Early domains

          ```text
          input bits: 8, 12, 16, 20
          output classes: 2, 4, 8
          accumulator widths: 8, 12, 16
          structured sparse/low-rank controls
          dense random and late-bit adversaries
          ```

          ### Early rejection Gate

          Reject the compiler family as the core path if any condition holds:

          ```text
          exact mismatch >0
          compiler uses enumerated output table as hidden representation
          p50 query node/byte fraction >10%
          p90 query node/byte fraction >25%
          compiled bytes exceed 1 TiB projection before target scale
          node count grows super-polynomially or empirical doubling exponent >1.5 per added input bit on adversarial dense cases
          reduction/compile cost cannot be amortized under measured reuse
          random/adversarial cases require near-full original arithmetic
          ```

          Promotion still requires real small-checkpoint operation replacement and p90 fully-accounted fraction <=1.185185%.

          ### Evidence boundary

          ```text
          Phase A/B
          Evidence ceiling E1
          real Transformer operation replacement NOT TESTED
          405B / 8 GiB / CUDA / PCIe / SSD / TTFT / tokens/sec NOT TESTED
          ```

          ### Next exact action

          1. implement a bit-vector reference and exact AIG evaluator;
          2. compile thresholded dense linear decisions without enumerating input states;
          3. implement structural hashing and reduction;
          4. verify exhaustive equality only as a validator for small input widths;
          5. measure structured versus adversarial scaling;
          6. freeze raw circuits, truth checks, node/byte equations, and decision.
          '''
          Path("NEXT_EXPERIMENT.md").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in next_text.splitlines()).strip() + "\n",
              encoding="utf-8",
          )

          workflow_path = Path(".github/workflows/exp_052_gate.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = re.sub(
              r"on:\n  workflow_dispatch:\n  pull_request:\n(?:    .*\n|      .*\n)+?\nconcurrency:",
              "on:\n  workflow_dispatch:\n\nconcurrency:",
              workflow,
              count=1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          for optional, section in (
              (
                  "docs/RESEARCH_PROGRESS_LEDGER.md",
                  "## EXP-052\n\nEnumerative exact advice rejected; authority `results/exp_052/summary.json`; EXP-053 circuit compiler registered.\n",
              ),
              (
                  "docs/SESSION_HANDOFF.md",
                  "## EXP-052 handoff\n\nRead `results/exp_052/summary.json` and `NEXT_EXPERIMENT.md`. The next branch must implement EXP-053; do not enlarge exact-state tables.\n",
              ),
          ):
              path = Path(optional)
              if path.exists() and MARKER not in path.read_text(encoding="utf-8"):
                  path.write_text(
                      path.read_text(encoding="utf-8").rstrip()
                      + "\n\n"
                      + MARKER
                      + "\n"
                      + section,
                      encoding="utf-8",
                  )
          PY

      - name: Validate frozen evidence and state
        run: |
          set -euo pipefail
          test -f results/exp_052/summary.json
          (cd results/exp_052 && sha256sum -c checksums.sha256)
          grep -q "REJECT_ENUMERATIVE_EXACT_ADVICE" RESEARCH_STATE.md
          grep -q "EXP-053" NEXT_EXPERIMENT.md
          python -m pytest -q tests/exp_052
          python scripts/run_validation.py

      - name: Commit durable state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            FAILED_APPROACHES.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md \
            ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md \
            docs/research/EXPERIMENT_052_EXACT_ADVICE_TRADEOFF.md \
            .github/workflows/exp_052_gate.yml \
            docs/RESEARCH_PROGRESS_LEDGER.md docs/SESSION_HANDOFF.md || true
          if git diff --cached --quiet; then
            echo "EXP-052 durable state already finalized"
            exit 0
          fi
          git commit -m "research(exp052): reject enumerative advice and register EXP-053"
          git push origin HEAD:research/exp-052-exact-advice-tradeoff
