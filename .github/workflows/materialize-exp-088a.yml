name: materialize-exp-088a-source

on:
  push:
    branches:
      - research/exp-088a-public-gptq-entropy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[exp088-source]') && !contains(github.event.head_commit.message, '[exp088-results]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          if test -f docs/research/EXPERIMENT_088A_PUBLIC_GPTQ_ENTROPY_GATE.md; then
            echo "EXP-088A source already materialized"
            exit 0
          fi
          cat > /tmp/exp088a.tgz.b64 <<'B64'

B64
          base64 -d /tmp/exp088a.tgz.b64 > /tmp/exp088a.tgz
          tar -xzf /tmp/exp088a.tgz
          python -m py_compile \
            vortex_runtime/public_gptq_entropy.py \
            experiments/exp_088a/run_experiment.py \
            experiments/exp_088a/update_ledgers.py
          git rm .github/workflows/materialize-exp-088a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            vortex_runtime/public_gptq_entropy.py \
            tests/exp_088a/ \
            experiments/exp_088a/ \
            docs/research/EXPERIMENT_088A_PUBLIC_GPTQ_ENTROPY_GATE.md \
            .github/workflows/exp-088a-public-gptq-entropy.yml
          git commit -m "research(exp-088a): preregister public GPTQ entropy Gate [exp088-source]"
          git push origin HEAD:${{ GITHUB_REF_NAME }}
