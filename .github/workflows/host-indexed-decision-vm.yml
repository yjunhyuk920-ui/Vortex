name: Host-indexed decision VM gate

on:
  pull_request:
    paths:
      - "vortex_runtime/host_indexed_decision_vm.py"
      - "tests/test_host_indexed_decision_vm.py"
      - "scripts/run_host_indexed_decision_vm_gate.py"
      - "docs/EXPERIMENT_044_HOST_INDEXED_DECISION_VM.md"
      - ".github/workflows/host-indexed-decision-vm.yml"

concurrency:
  group: host-decision-vm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  certify:
    if: github.head_ref == 'research/host-indexed-decision-vm'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Validate VM implementation
        run: |
          test -f vortex_runtime/host_indexed_decision_vm.py
          test -f tests/test_host_indexed_decision_vm.py
          python -m pytest -q tests/test_host_indexed_decision_vm.py
      - name: Generate VM certificate
        run: |
          python scripts/run_host_indexed_decision_vm_gate.py \
            --chains 1024 \
            --steps 256 \
            --address-samples 20000 \
            --output results/host_indexed_decision_vm_gate.json
      - name: Build PR report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/host_indexed_decision_vm_gate.json")
              .read_text(encoding="utf-8")
          )
          report = {
              "evidence_level": payload["evidence_level"],
              "table": payload["table"],
              "formats": payload["formats"],
              "target_projection": payload["target_projection"],
              "scope_separation": payload["scope_separation"],
              "conclusion": payload["conclusion"],
              "next_obligation": payload["next_obligation"],
          }
          Path("host-decision-vm-comment.md").write_text(
              "## Host-indexed exact-decision VM Gate\n\n```json\n"
              + json.dumps(report, indent=2, ensure_ascii=False)
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file host-decision-vm-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: host-indexed-decision-vm-gate
          path: results/host_indexed_decision_vm_gate.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/host_indexed_decision_vm_gate.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(gate): commit mmap decision VM evidence"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
