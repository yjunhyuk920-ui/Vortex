name: exp-085a-source-bootstrap

on:
  push:
    branches:
      - research/exp-085a-joint-exact-swiglu-compiler
  pull_request:
    branches:
      - research/fixed-public-dynamic-executor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-source:
    if: ${{ github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[exp085a-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Materialize reviewed EXP-085A source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .scratch/exp085a_bundle_*.b64 > /tmp/exp085a_bundle.b64
          base64 -d /tmp/exp085a_bundle.b64 > /tmp/exp085a_bundle.tar.gz
          echo "dfe145dc9ac72a733b7c4ce117cd9b1f2cbf315b9e62009072c7e3fb127fb5e3  /tmp/exp085a_bundle.tar.gz" | sha256sum -c -
          tar -xzf /tmp/exp085a_bundle.tar.gz
          rm .scratch/exp085a_bundle_*.b64
          rm -f .scratch/exp085a_bootstrap_trigger.txt
          rm .github/workflows/exp-085a-source-bootstrap.yml
      - name: Commit EXP-085A compiler, Gate, tests, and hosted runner
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: implement EXP-085A joint exact SwiGLU compiler Gate [exp085a-source]"
          git push origin HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
