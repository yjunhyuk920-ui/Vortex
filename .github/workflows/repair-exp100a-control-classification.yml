name: repair-exp-100a-control-classification

on:
  push:
    branches:
      - research/exp-100a-explicit-rectangular-fmm-gate

permissions:
  contents: write

concurrency:
  group: repair-exp100a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, '[exp100a-control-repair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Apply classification-only repair robustly
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path("experiments/exp_100a/run_experiment.py")
          text = runner.read_text(encoding="utf-8")
          lines = text.splitlines()

          # Remove only the two incorrect integrity classifications. An empty
          # shape/block frontier after the frozen 8-GiB filter is negative
          # scientific evidence, not a tensor-identity/control failure.
          for condition, append_line in (
              (
                  "    if any(not result.direct_structural_plans for result in searches.values()):",
                  '        integrity_failures.append("empty_direct_shape_search")',
              ),
              (
                  "    if any(not result.oracle_structural_plans for result in searches.values()):",
                  '        integrity_failures.append("empty_oracle_shape_search")',
              ),
          ):
              if condition in lines:
                  index = lines.index(condition)
                  if index + 1 >= len(lines) or lines[index + 1] != append_line:
                      raise SystemExit(f"unexpected classification body after: {condition}")
                  del lines[index : index + 2]

          text = "\n".join(lines) + "\n"

          if "def search_coverage_diagnostics(" not in text:
              marker = "def summarize_prior(\n"
              if marker not in text:
                  raise SystemExit("summarize_prior marker not found")
              helper = '''def search_coverage_diagnostics(
              searches: Mapping[tuple[int, int, int], SearchResult],
          ) -> dict[str, Any]:
              """Record resource-empty search frontiers without invalidating controls."""

              empty_direct: list[dict[str, Any]] = []
              empty_oracle: list[dict[str, Any]] = []
              for (block_length, rows, columns), result in sorted(searches.items()):
                  identity = {
                      "block_length": int(block_length),
                      "rows": int(rows),
                      "columns": int(columns),
                      "state_count_by_depth": list(result.state_count_by_depth),
                  }
                  if not result.direct_structural_plans:
                      empty_direct.append(identity)
                  if not result.oracle_structural_plans:
                      empty_oracle.append(identity)
              return {
                  "search_count": len(searches),
                  "empty_direct_count": len(empty_direct),
                  "empty_oracle_count": len(empty_oracle),
                  "empty_direct": empty_direct,
                  "empty_oracle": empty_oracle,
                  "empty_frontier_interpretation": (
                      "resource_or_bounded-search infeasibility; not a control failure"
                  ),
              }


          '''
              # Normalize indentation that YAML contributes inside this literal.
              helper = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in helper.splitlines()
              ) + "\n"
              text = text.replace(marker, helper + marker, 1)

          if "search_coverage = search_coverage_diagnostics(searches)" not in text:
              anchor = '    if not schemes:\n        integrity_failures.append("no_pareto_orientation")\n'
              if anchor not in text:
                  raise SystemExit("no_pareto_orientation anchor not found")
              addition = '''

              # Preserve the frozen search and classify resource-empty frontiers
              # diagnostically. Only an incomplete registered search population is
              # an integrity failure.
              search_coverage = search_coverage_diagnostics(searches)
              expected_search_count = len(config["search"]["block_lengths"]) * len(
                  {(family.rows, family.columns) for family in families}
              )
              if len(searches) != expected_search_count:
                  integrity_failures.append("incomplete_shape_block_search_population")
          '''
              addition = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in addition.splitlines()
              )
              text = text.replace(anchor, anchor + addition, 1)

          if '"search_coverage": search_coverage,' not in text:
              lines = text.splitlines()
              indexes = [
                  index
                  for index, line in enumerate(lines)
                  if '"search_rows": search_rows,' in line
              ]
              if len(indexes) != 1:
                  raise SystemExit(f"expected one search_rows field, found {len(indexes)}")
              index = indexes[0]
              indentation = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines.insert(index + 1, indentation + '"search_coverage": search_coverage,')
              text = "\n".join(lines) + "\n"

          runner.write_text(text, encoding="utf-8")

          test = Path("tests/exp_100a/test_explicit_rectangular_fmm.py")
          test_text = test.read_text(encoding="utf-8")
          test_name = "test_resource_empty_shape_frontier_is_diagnostic_not_integrity_failure"
          if test_name not in test_text:
              test_text = test_text.rstrip() + '''


def test_resource_empty_shape_frontier_is_diagnostic_not_integrity_failure() -> None:
              from experiments.exp_100a.run_experiment import (
                  SearchResult,
                  search_coverage_diagnostics,
              )

              empty = SearchResult(
                  block_length=16384,
                  rows=128256,
                  columns=16384,
                  state_count_by_depth=(96, 96, 96, 96, 0),
                  direct_structural_plans=(),
                  oracle_structural_plans=(),
              )
              diagnostics = search_coverage_diagnostics(
                  {(16384, 128256, 16384): empty}
              )
              assert diagnostics["search_count"] == 1
              assert diagnostics["empty_direct_count"] == 1
              assert diagnostics["empty_oracle_count"] == 1
              assert diagnostics["empty_direct"][0]["rows"] == 128256
              assert "not a control failure" in diagnostics["empty_frontier_interpretation"]
          '''
              test_text = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in test_text.splitlines()
              ) + "\n"
              test.write_text(test_text, encoding="utf-8")

          print("EXP-100A classification repair materialized")
          PY
      - name: Install focused runtime and verify repair
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.3
          python -m pytest -q tests/exp_100a
          python -m py_compile \
            experiments/exp_100a/run_experiment.py \
            experiments/exp_100a/update_ledgers.py \
            vortex_runtime/explicit_rectangular_fmm.py
      - name: Commit classification repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-exp100a-control-classification.yml
          rm -f .exp100a-control-repair-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: classify EXP-100A resource-empty frontier scientifically"
          git push origin HEAD:${GITHUB_REF_NAME}
