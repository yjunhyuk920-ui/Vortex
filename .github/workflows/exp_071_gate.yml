name: EXP-071 exact dense-runtime lower-bound audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/exp_071_gate.yml"
      - "docs/research/EXPERIMENT_071_DENSE_RUNTIME_LOWER_BOUND_AUDIT.md"
      - "experiments/exp_071/**"
      - "tests/exp_071/**"
      - "vortex_runtime/lower_bound_audit.py"

concurrency:
  group: exp-071-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run EXP-071 bounded reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP071_OUTPUT_DIR: ${{ runner.temp }}/exp_071_candidate
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: bash experiments/exp_071/reproduce.sh
      - name: Upload EXP-071 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-071-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_071_candidate
          if-no-files-found: error
          retention-days: 30
