name: EXP-078A tangent macroblock contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/exp_078a_gate.yml"
      - "docs/research/EXPERIMENT_078A_TANGENT_MACROBLOCK_GATE.md"
      - "experiments/exp_078a/**"
      - "tests/exp_078a/**"
      - "vortex_runtime/tangent_macroblock.py"

concurrency:
  group: exp-078a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preregistered-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==1.26.4
      - name: Validate tangent accounting and decision contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_078a
      - name: Confirm no checkpoint payload is tracked
        run: |
          if git ls-files '*.safetensors' '*.bin' '*.pt' '*.pth' | grep -q .; then
            echo 'Tracked model payload is forbidden' >&2
            exit 1
          fi
