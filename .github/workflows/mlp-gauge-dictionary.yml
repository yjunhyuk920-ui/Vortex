name: MLP gauge dictionary gate

on:
  pull_request:
    paths:
      - "vortex_runtime/mlp_gauge_dictionary.py"
      - "scripts/run_mlp_gauge_dictionary_point.py"
      - "tests/test_mlp_gauge_dictionary.py"
      - "docs/EXPERIMENT_018_MLP_GAUGE_DICTIONARY.md"
      - ".github/workflows/mlp-gauge-dictionary.yml"

concurrency:
  group: mlp-gauge-dictionary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/mlp-gauge-dictionary'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - tiny_prototypes: 16
            target_prototypes: 128
          - tiny_prototypes: 32
            target_prototypes: 256
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate exact gauge normalization
        run: |
          python -m pytest -q \
            tests/test_mlp_neuron_dictionary.py \
            tests/test_mlp_gauge_dictionary.py
      - name: Measure gauge-normalized ${{ matrix.tiny_prototypes }} prototypes
        run: |
          python scripts/run_mlp_gauge_dictionary_point.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tiny-prototypes ${{ matrix.tiny_prototypes }} \
            --target-prototypes ${{ matrix.target_prototypes }} \
            --projection-dim 64 \
            --cluster-iterations 5 \
            --factor-bits 8 \
            --seed 4049 \
            --tokens 32 \
            --tree-depth 12 \
            --top-k 32 \
            --beam-width 64 \
            --node-budget 1024 \
            --eval-batch-size 8 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "mlp-gauge-${{ matrix.tiny_prototypes }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mlp-gauge-${{ matrix.tiny_prototypes }}
          path: mlp-gauge-${{ matrix.tiny_prototypes }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: mlp-gauge-*
          path: mlp-gauge-results
          merge-multiple: true
      - name: Aggregate gauge dictionary frontier
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path("mlp-gauge-results").glob("*.json"))
          if not files:
              raise SystemExit("no gauge dictionary results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["tiny_prototypes_per_layer"])
          best = max(
              points,
              key=lambda item: (
                  item["tree"]["exact_path_last_alive_depth"],
                  item["teacher_forced_compiled"]["top32_rate"],
                  item["teacher_forced_compiled"]["top1_rate"],
              ),
          )
          promoted = [point for point in points if point["qualifies"]]
          summary = [
              {
                  "tiny_prototypes": point["tiny_prototypes_per_layer"],
                  "target_prototypes": point[
                      "projected_405b_prototypes_per_layer"
                  ],
                  "gauge_error": point["gauge_normalization"][
                      "maximum_exact_function_relative_l2_error"
                  ],
                  "gate_up_error": point["fit"][
                      "neuron_weighted_gate_up_relative_l2_error"
                  ],
                  "teacher_top1": point["teacher_forced_compiled"]["top1_rate"],
                  "teacher_top32": point["teacher_forced_compiled"]["top32_rate"],
                  "autoregressive_prefix": point[
                      "autoregressive_exact_prefix"
                  ],
                  "tree_prefix": point["tree"][
                      "optimistic_committed_exact_prefix"
                  ],
                  "last_alive_depth": point["tree"][
                      "exact_path_last_alive_depth"
                  ],
                  "promoted": point["qualifies"],
              }
              for point in points
          ]
          if promoted:
              decision = "advance gauge-normalized MLP dictionary"
              next_candidate = "complete attention and LM-head representations"
          elif best["teacher_forced_compiled"]["top32_rate"] >= 0.5:
              decision = "retain exact gauge and add sparse prototype mixtures"
              next_candidate = (
                  "replace one hard neuron assignment with two or four sparse "
                  "prototype coefficients under the same partial traffic Gate"
              )
          else:
              decision = "reject tested gauge-normalized hard dictionary"
              next_candidate = (
                  "move to sparse mixture compilation; exact gauge alone is "
                  "insufficient at the required collapse ratio"
              )
          payload = {
              "evidence_level": (
                  "E2 executable exact-gauge-normalized MLP dictionary frontier"
              ),
              "points": points,
              "summary": summary,
              "best_tiny_prototypes": best["tiny_prototypes_per_layer"],
              "promoted_points": [
                  point["tiny_prototypes_per_layer"] for point in promoted
              ],
              "decision": decision,
              "next_candidate": next_candidate,
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "head_sha": os.environ["HEAD_SHA"],
                  "input_sha256": {
                      path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in files
                  },
              },
          }
          output = Path("results/tinyllama_1_1b_mlp_gauge_dictionary.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          Path("mlp-gauge-comment.md").write_text(
              "## Exact-gauge MLP dictionary gate\n\n```json\n"
              + json.dumps(
                  {
                      "summary": summary,
                      "best_tiny_prototypes": payload[
                          "best_tiny_prototypes"
                      ],
                      "promoted_points": payload["promoted_points"],
                      "decision": payload["decision"],
                      "next_candidate": payload["next_candidate"],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file mlp-gauge-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-mlp-gauge-dictionary
          path: results/tinyllama_1_1b_mlp_gauge_dictionary.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_mlp_gauge_dictionary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(frontier): commit MLP gauge dictionary sweep"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
