name: EXP-051 layer-finalization tail-skip Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vortex_runtime/layer_finalization.py"
      - "tests/exp_051/**"
      - "experiments/exp_051/**"
      - "docs/research/EXPERIMENT_051_LAYER_FINALIZATION_TAIL_SKIP.md"
      - ".github/workflows/exp_051_gate.yml"
      - "NEXT_EXPERIMENT.md"

concurrency:
  group: exp-051-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-finalization-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify mandatory files
        run: |
          set -euo pipefail
          required=(
            AGENTS.md RESEARCH_STATE.md FAILED_APPROACHES.md DECISION_LOG.md
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md NEXT_EXPERIMENT.md
            ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md
            docs/PROOF_FIRST_CONTRACT.md docs/WORK_SESSION_PROTOCOL.md
            docs/research/EXPERIMENT_051_LAYER_FINALIZATION_TAIL_SKIP.md
            vortex_runtime/layer_finalization.py
            tests/exp_051/test_layer_finalization.py
            experiments/exp_051/config.json experiments/exp_051/run_experiment.py
            experiments/exp_051/run_current_env.sh experiments/exp_051/reproduce.sh
            experiments/exp_051/future_gpu_run.sh
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done

      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
          python -m pip freeze | sort | tee exp051-pip-freeze.txt

      - name: Run EXP-051 finalization and adversary tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_051

      - name: Run repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_validation.py

      - name: Run pinned layer-finalization audit
        env:
          PYTHONPATH: ${{ github.workspace }}
          HF_HOME: ${{ runner.temp }}/hf-exp051
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          rm -rf results/exp_051_candidate
          bash experiments/exp_051/run_current_env.sh 2>&1 | tee exp051-workflow.log

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          root = Path("results/exp_051_candidate")
          summary = json.loads((root / "summary.json").read_text())
          measured = summary["MEASURED"]
          derived = summary["DERIVED"]
          assert summary["experiment"] == "EXP-051"
          assert summary["evidence_level"] == "E1"
          assert summary["real_skipped_layer_operation_replacement"] is False
          assert summary["phase_d_status"] == "NOT TESTED"
          assert measured["model_count"] == 3
          assert measured["prompt_case_count"] == 18
          assert measured["token_state_count"] == 1152
          assert measured["expected_token_state_count"] == 1152
          assert measured["excluded_prompt_count"] == 0
          assert measured["final_reconstruction_mismatches"] == 0
          assert measured["future_generated_token_uses"] == 0
          assert measured["late_decision_counterexample_succeeds"] is True
          assert measured["late_decision_stable_byte_fraction"] == 1.0
          assert math.isfinite(measured["suffix_stable_median_block_fraction"])
          assert math.isfinite(measured["suffix_stable_p90_logical_byte_fraction"])
          assert derived["per_state_depth_selection_uses_complete_later_layer_reference"] is True
          assert derived["decision"] in {
              "REJECT_LAYER_FINALIZATION_TAIL_SKIP_CORE_RETAIN_ORACLE_AUXILIARY",
              "REJECT_LAYER_FINALIZATION_TAIL_SKIP_AS_UNIVERSAL_CORE_CONTINUE_RESTRICTED_ADAPTIVE_CERTIFICATE",
              "CONTINUE_LAYER_FINALIZATION_TO_SOUND_TAIL_CERTIFICATE",
          }
          assert (root / "raw" / "token_states.jsonl").is_file()
          assert (root / "raw" / "checkpoint_manifest.json").is_file()
          assert (root / "raw" / "late_decision_adversary.json").is_file()
          assert (root / "raw" / "traffic_by_model.json").is_file()
          assert (root / "checksums.sha256").is_file()
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-051-candidate-${{ github.run_id }}
          path: |
            results/exp_051_candidate
            exp051-workflow.log
            exp051-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
