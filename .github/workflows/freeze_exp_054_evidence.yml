name: Freeze EXP-054 authoritative evidence

on:
  push:
    paths:
      - ".github/workflows/freeze_exp_054_evidence.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: freeze-exp-054-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    if: github.ref == 'refs/heads/research/exp-054-reduced-decision-diagram'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/exp-054-reduced-decision-diagram
          fetch-depth: 0

      - name: Download and verify authoritative artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=8856906303
          EXPECTED_SHA=0dc642f306cea99ce01095758a5f49151092d530efb94d36985553e408596edf
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/exp054.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          echo "${EXPECTED_SHA}  /tmp/exp054.zip" | sha256sum -c -
          rm -rf /tmp/exp054-artifact
          mkdir -p /tmp/exp054-artifact
          unzip -q /tmp/exp054.zip -d /tmp/exp054-artifact
          test -f /tmp/exp054-artifact/results/exp_054_candidate/summary.json
          test -f /tmp/exp054-artifact/results/exp_054_candidate/raw/cases.jsonl
          test -f /tmp/exp054-artifact/results/exp_054_candidate/raw/order_rows.jsonl
          (
            cd /tmp/exp054-artifact/results/exp_054_candidate
            sha256sum -c checksums.sha256
          )

      - name: Install frozen evidence with provenance
        run: |
          set -euo pipefail
          rm -rf results/exp_054
          cp -a /tmp/exp054-artifact/results/exp_054_candidate results/exp_054
          mkdir -p results/exp_054/raw results/exp_054/artifacts results/exp_054/logs
          cp results/exp_054/summary.json results/exp_054/raw/workflow_summary.json
          cp results/exp_054/checksums.sha256 results/exp_054/artifacts/workflow_checksums.sha256
          cp /tmp/exp054-artifact/exp054-workflow.log results/exp_054/logs/workflow.log
          cp /tmp/exp054-artifact/exp054-pip-freeze.txt results/exp_054/artifacts/pip_freeze.txt
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/exp_054")
          provenance = {
              "workflow_run": "30816333096",
              "source_head_sha": "2c63da85050afcedad6a00698a6f8fddd3bc99d2",
              "artifact_id": 8856906303,
              "artifact_name": "exp-054-candidate-30816333096",
              "artifact_size_bytes": 95207,
              "artifact_zip_sha256": "0dc642f306cea99ce01095758a5f49151092d530efb94d36985553e408596edf",
              "frozen_date": "2026-08-03",
          }
          (root / "raw" / "artifact_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          summary_path = root / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          summary.setdefault("provenance", {}).update(provenance)
          summary.setdefault("raw_evidence", {}).update({
              "artifact_provenance": "raw/artifact_provenance.json",
              "workflow_summary": "raw/workflow_summary.json",
              "workflow_checksums": "artifacts/workflow_checksums.sha256",
          })
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd results/exp_054
            find . -type f ! -name checksums.sha256 -print0 \
              | sort -z | xargs -0 sha256sum \
              | sed 's#  \./#  #' > checksums.sha256
            sha256sum -c checksums.sha256
          )

      - name: Commit frozen evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_054
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(exp054): freeze authoritative decision-diagram evidence"
          git push origin HEAD:research/exp-054-reduced-decision-diagram
