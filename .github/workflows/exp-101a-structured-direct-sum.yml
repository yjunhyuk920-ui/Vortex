name: exp-101a-structured-direct-sum

on:
  push:
    branches:
      - research/exp-101a-structured-direct-sum-gate
  pull_request:
    branches:
      - research/exp-100a-explicit-rectangular-fmm-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-101a-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - run: python -m pip install --disable-pip-version-check pytest==8.3.3
      - name: Frozen contract and exact controls
        run: |
          python -m pytest -q tests/exp_101a
          python -m py_compile vortex_runtime/structured_direct_sum.py experiments/exp_101a/run_experiment.py experiments/exp_101a/update_ledgers.py
          python - <<'PY'
          import json
          from experiments.exp_101a.run_experiment import validate_config
          c=json.load(open('experiments/exp_101a/config.json'))
          validate_config(c)
          assert c['relation']['git_blob_sha1']=='9e940a8308d6faf5784967ec160d6429e5d1f563'
          assert c['target_contract']['first_core_reduction_fraction']==0.1
          print('EXP-101A contract: PASS')
          PY

  analytical-gate:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[exp101a-results]') }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
      - name: Record host
        run: |
          mkdir -p results/exp_101a/${GITHUB_SHA}
          { uname -a; lscpu; free -b; df -B1 .; python --version; } | tee results/exp_101a/${GITHUB_SHA}/host.txt
      - name: Execute structured direct-sum composition Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_101a/run_experiment.py --config experiments/exp_101a/config.json --output-dir results/exp_101a/${GITHUB_SHA} 2>&1 | tee results/exp_101a/${GITHUB_SHA}/run.log
      - name: Update research ledgers
        run: python experiments/exp_101a/update_ledgers.py --result results/exp_101a/${GITHUB_SHA}/result.json --source-commit ${GITHUB_SHA}
      - name: Refresh checksums
        run: |
          cd results/exp_101a/${GITHUB_SHA}
          find . -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > checksums.sha256
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-101a-${{ github.sha }}
          path: results/exp_101a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and canonical handoff
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/exp_101a/${GITHUB_SHA}/ docs/research/EXP_101A_LATEST_RESULT.md docs/research/VORTEX_RESEARCH_HANDOFF.md RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md FAILED_APPROACHES.md FAILED_APPROACHES_RECENT.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record EXP-101A structured direct-sum Gate [exp101a-results] [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Summary
        if: always()
        run: |
          if test -f results/exp_101a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r=json.loads((Path('results/exp_101a')/os.environ['GITHUB_SHA']/'result.json').read_text())
          b=r['best_composed_row']
          print('## EXP-101A structured direct-sum composition')
          print(f"- decision: `{r['authoritative_decision']}`")
          print(f"- best K: `{b['block_length']}`")
          print(f"- catalog / structured / composed: `{b['catalog_only']['multiplication_ratio']:.9%} / {b['structured_only']['multiplication_ratio']:.9%} / {b['catalog_plus_structured']['multiplication_ratio']:.9%}`")
          print(f"- integrity failures: `{r['integrity_failures']}`")
          PY
          fi
