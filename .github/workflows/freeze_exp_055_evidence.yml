name: Freeze EXP-055 authoritative evidence

on:
  push:
    branches:
      - research/exp-055-column-signature-popcount
    paths:
      - .github/workflows/freeze_exp_055_evidence.yml
  workflow_dispatch:

concurrency:
  group: freeze-exp-055-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-055-column-signature-popcount
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation environment
        run: |
          python -m pip install --disable-pip-version-check -e . pytest==8.3.5
      - name: Download and freeze authoritative artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf results/exp_055 "${RUNNER_TEMP}/exp055"
          mkdir -p results/exp_055 "${RUNNER_TEMP}/exp055"
          gh run download 30820909775 \
            --repo "${GITHUB_REPOSITORY}" \
            --name exp-055-candidate-30820909775 \
            --dir "${RUNNER_TEMP}/exp055"
          cp -a "${RUNNER_TEMP}/exp055/." results/exp_055/
          python scripts/finalize_exp_055.py
      - name: Verify frozen evidence and repository
        run: |
          set -euo pipefail
          (cd results/exp_055 && sha256sum -c checksums.sha256)
          python -m pytest -q tests/exp_055/test_column_signature.py
          python scripts/run_validation.py
      - name: Commit frozen evidence and decision
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_055 RESEARCH_STATE.md DECISION_LOG.md FAILED_APPROACHES.md NEXT_EXPERIMENT.md docs/research/EXPERIMENT_055_COLUMN_SIGNATURE_POPCOUNT.md
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "research(exp055): freeze evidence and register EXP-056"
          git push origin HEAD:research/exp-055-column-signature-popcount
