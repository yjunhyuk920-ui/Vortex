name: exp-087a-quadratic-bf16-residual-fp32-correction

on:
  push:
    branches:
      - research/exp-087a-quadratic-bf16-residual-generator
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-087a-fp32-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  model-free-contract:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[exp087-fp32-correction]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify runtime pins
        run: |
          python - <<'PY'
          import safetensors, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          PY
      - name: Run original and predicate-boundary controls
        run: python -m pytest -q tests/exp_087a
      - name: Syntax and frozen-config checks
        run: |
          python -m py_compile \
            vortex_runtime/quadratic_bf16_residual_generator.py \
            vortex_runtime/quadratic_bf16_residual_fp32_context.py \
            experiments/exp_087a/run_experiment.py \
            experiments/exp_087a/run_fp32_corrected_experiment.py \
            experiments/exp_087a/update_fp32_correction_ledgers.py
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('experiments/exp_087a/config.json').read_text())
          assert config['frozen_before_results'] is True
          assert config['program_count'] == 4
          assert config['context_bits'] == 12
          assert config['context_pool'] == 64
          assert config['decode_positions_per_prompt'] == 16
          assert len(config['prompts']) == 12
          PY
          git diff --check

  corrected-real-checkpoint-gate:
    needs: model-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Record hosted environment
        run: |
          mkdir -p results/exp_087a_fp32/${GITHUB_SHA}
          {
            uname -a
            lscpu
            free -b
            df -B1 .
            python --version
          } | tee results/exp_087a_fp32/${GITHUB_SHA}/host.txt
      - name: Execute corrected official-checkpoint Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_087a/run_fp32_corrected_experiment.py \
            --config experiments/exp_087a/config.json \
            --output-dir results/exp_087a_fp32/${GITHUB_SHA} \
            2>&1 | tee results/exp_087a_fp32/${GITHUB_SHA}/run.log
      - name: Materialize corrected authoritative handoff
        run: |
          python experiments/exp_087a/update_fp32_correction_ledgers.py \
            --result results/exp_087a_fp32/${GITHUB_SHA}/result.json
      - name: Refresh complete checksums
        run: |
          cd results/exp_087a_fp32/${GITHUB_SHA}
          find . -type f ! -name checksums.sha256 -print0 | sort -z | \
            xargs -0 sha256sum > checksums.sha256
      - name: Upload immutable corrected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-087a-fp32-${{ github.sha }}
          path: results/exp_087a_fp32/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit corrected result and research ledgers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exp_087a_fp32/${GITHUB_SHA}/ \
            docs/research/EXP_087A_LATEST_RESULT.md \
            docs/research/EXP_087A_FP32_CORRECTED_LATEST_RESULT.md \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            FAILED_APPROACHES.md FAILED_APPROACHES_RECENT.md \
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md ARCHITECTURE.md \
            REPRODUCIBILITY.md
          if git diff --cached --quiet; then
            echo "No corrected scientific result delta"
            exit 0
          fi
          git commit -m "research: record corrected EXP-087A Gate [exp087-fp32-results] [exp087-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish corrected summary
        if: always()
        run: |
          if test -f results/exp_087a_fp32/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path = Path('results/exp_087a_fp32') / os.environ['GITHUB_SHA'] / 'result.json'
          result = json.loads(path.read_text())
          measured = result['MEASURED']
          oracle = measured['queries']['evaluation_oracle']['report']
          build = measured['queries']['build_oracle']['report']
          print('## EXP-087A corrected FP32 predicate semantics')
          print(f"- decision: `{result['authoritative_decision']}`")
          print(f"- build programs: `{measured['build_program_exact']}`")
          print(f"- build oracle: `{build['exact_vectors']}/{build['count']}`")
          print(f"- evaluation oracle: `{oracle['exact_vectors']}/{oracle['count']}`")
          print(f"- evaluation row-exact p50: `{oracle['row_exact_fraction_p50']}`")
          print(f"- deterministic core: `{result['deterministic_core_sha256']}`")
          PY
          fi
