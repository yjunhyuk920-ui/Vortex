name: exp-089a-prefix-state-bisimulation

on:
  push:
    branches:
      - research/exp-089a-prefix-state-bisimulation-gate
  pull_request:
    branches:
      - research/exp-088b-cross-layer-program-sharing-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-089a-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  model-free-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify runtime pins
        run: |
          python - <<'PY'
          import safetensors, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          PY
      - name: Run prefix-state contract and fault controls
        run: python -m pytest -q tests/exp_089a
      - name: Syntax checks
        run: |
          python -m py_compile \
            vortex_runtime/prefix_state_bisimulation.py \
            experiments/exp_089a/run_experiment.py \
            experiments/exp_089a/update_ledgers.py

  public-checkpoint-gate:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[exp089a-results]') }}
    needs: model-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Record host
        run: |
          mkdir -p results/exp_089a/${GITHUB_SHA}
          {
            uname -a
            lscpu
            free -b
            df -B1 .
            python --version
          } | tee results/exp_089a/${GITHUB_SHA}/host.txt
      - name: Execute official prefix-state bisimulation Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_089a/run_experiment.py \
            --config experiments/exp_089a/config.json \
            --output-dir results/exp_089a/${GITHUB_SHA} \
            2>&1 | tee results/exp_089a/${GITHUB_SHA}/run.log
      - name: Update canonical research ledgers
        run: |
          python experiments/exp_089a/update_ledgers.py \
            --result results/exp_089a/${GITHUB_SHA}/result.json \
            --source-commit ${GITHUB_SHA}
      - name: Refresh checksums
        run: |
          cd results/exp_089a/${GITHUB_SHA}
          find . -type f ! -name checksums.sha256 -print0 | sort -z | \
            xargs -0 sha256sum > checksums.sha256
      - name: Upload immutable raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-089a-${{ github.sha }}
          path: results/exp_089a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and ledgers
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exp_089a/${GITHUB_SHA}/ \
            docs/research/EXP_089A_LATEST_RESULT.md \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md ARCHITECTURE.md \
            HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md \
            FAILED_APPROACHES.md FAILED_APPROACHES_RECENT.md
          if git diff --cached --quiet; then
            echo "No result delta"
            exit 0
          fi
          git commit -m "research: record EXP-089A prefix-state witness [exp089a-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish summary
        if: always()
        run: |
          if test -f results/exp_089a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path = Path("results/exp_089a") / os.environ["GITHUB_SHA"] / "result.json"
          result = json.loads(path.read_text())
          totals = result["totals"]
          print("## EXP-089A prefix-state bisimulation")
          print(f"- decision: `{result['authoritative_decision']}`")
          print(f"- transitions: `{totals['transitions']}`")
          print(f"- token/logits/cache/RNG mismatches: `{totals['token_mismatches']}/{totals['logits_byte_mismatches']}/{totals['cache_digest_mismatches']}/{totals['rng_mismatches']}`")
          print(f"- reference/replay target calls: `{totals['reference_target_calls']}/{totals['replay_target_calls']}`")
          print(f"- replayed token positions: `{totals['replayed_token_positions']}`")
          PY
          fi
