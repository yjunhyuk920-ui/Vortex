name: EXP-069 freeze authoritative evidence

on:
  push:
    branches:
      - research/exp-069-temporal-span-replay
    paths:
      - experiments/exp_069/FREEZE_EVIDENCE

permissions:
  contents: write
  actions: read

concurrency:
  group: exp-069-freeze-evidence
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-069-temporal-span-replay
          fetch-depth: 0
      - name: Download authoritative workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf results/exp_069.download
          mkdir -p results/exp_069.download
          gh run download 30922174380 \
            --repo "${GITHUB_REPOSITORY}" \
            --name exp-069-candidate-30922174380 \
            --dir results/exp_069.download
          mkdir -p results/exp_069
          cp -a results/exp_069.download/. results/exp_069/
          rm -rf results/exp_069.download
      - name: Verify frozen artifact checksums
        run: |
          set -euo pipefail
          cd results/exp_069
          sha256sum --check checksums.sha256
      - name: Commit exact artifact contents
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/exp_069
          if git diff --cached --quiet; then
            echo "Authoritative evidence already frozen"
            exit 0
          fi
          git commit -m "evidence(exp-069): freeze authoritative raw artifact"
          git push origin HEAD:research/exp-069-temporal-span-replay
