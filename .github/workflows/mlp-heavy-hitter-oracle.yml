name: MLP heavy-hitter oracle gate

on:
  pull_request:
    paths:
      - "vortex_runtime/mlp_heavy_hitter.py"
      - "scripts/run_mlp_heavy_hitter_oracle.py"
      - "tests/test_mlp_heavy_hitter.py"
      - "docs/EXPERIMENT_027_MLP_HEAVY_HITTER_ORACLE.md"
      - ".github/workflows/mlp-heavy-hitter-oracle.yml"

concurrency:
  group: mlp-heavy-hitter-oracle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/mlp-heavy-hitter-oracle'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - selected_fraction: 0.001
            label: 0010
          - selected_fraction: 0.0025
            label: 0025
          - selected_fraction: 0.005
            label: 0050
          - selected_fraction: 0.01
            label: 0100
          - selected_fraction: 0.02
            label: 0200
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate heavy-hitter primitive
        run: python -m pytest -q tests/test_mlp_heavy_hitter.py
      - name: Measure fraction ${{ matrix.selected_fraction }}
        run: |
          python scripts/run_mlp_heavy_hitter_oracle.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --selected-fraction ${{ matrix.selected_fraction }} \
            --tokens 16 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "mlp-heavy-hitter-${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mlp-heavy-hitter-${{ matrix.label }}
          path: mlp-heavy-hitter-${{ matrix.label }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: mlp-heavy-hitter-*
          path: mlp-heavy-hitter-results
          merge-multiple: true
      - name: Aggregate oracle frontier
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path("mlp-heavy-hitter-results").glob("*.json"))
          if not files:
              raise SystemExit("no heavy-hitter results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["requested_selected_fraction"])
          promoted = [point for point in points if point["qualifies"]]
          budget_points = [
              point
              for point in points
              if point["projected_405b_partial_mlp_budget"]["partial_traffic_pass"]
          ]
          best_budget = max(
              budget_points,
              key=lambda item: (
                  item["teacher_forced"]["top32_rate"],
                  item["autonomous_exact_prefix"],
              ),
              default=None,
          )
          best_quality = max(
              points,
              key=lambda item: (
                  item["teacher_forced"]["top32_rate"],
                  item["teacher_forced"]["top1_rate"],
                  item["autonomous_exact_prefix"],
              ),
          )
          if promoted:
              decision = "advance certified causal heavy-hitter selector"
              next_candidate = (
                  "build compact neuron signatures that predict the oracle subset "
                  "before exact row loads, then certify the omitted tail"
              )
          elif best_budget is not None and best_budget["teacher_forced"]["top32_rate"] > 0:
              decision = "retain heavy-hitter signal but reject tested quality gate"
              next_candidate = (
                  "use nonuniform layer fractions under the same exact traffic "
                  "budget before attempting a causal selector"
              )
          else:
              decision = "reject traffic-compatible MLP heavy-hitter fractions"
              next_candidate = (
                  "leave tokenwise exact-neuron sparsity and test larger structured "
                  "groups only if their executed bytes remain within the Gate"
              )
          summary = [
              {
                  "requested_fraction": point["requested_selected_fraction"],
                  "actual_fraction": point["oracle_statistics"]["selected_fraction"],
                  "selected_neurons": point["oracle_statistics"][
                      "selected_neurons_per_vector"
                  ],
                  "score_coverage": point["oracle_statistics"][
                      "mean_score_coverage"
                  ],
                  "output_error": point["oracle_statistics"][
                      "mean_output_relative_l2_error"
                  ],
                  "teacher_top1": point["teacher_forced"]["top1_rate"],
                  "teacher_top32": point["teacher_forced"]["top32_rate"],
                  "autonomous_prefix": point["autonomous_exact_prefix"],
                  "unique_neuron_fraction": point["oracle_statistics"][
                      "mean_unique_neuron_fraction_per_module"
                  ],
                  "projected_mlp_gib_per_token": point[
                      "projected_405b_partial_mlp_budget"
                  ]["selected_weight_gib_per_token"],
                  "traffic_pass": point["projected_405b_partial_mlp_budget"][
                      "partial_traffic_pass"
                  ],
                  "qualifies": point["qualifies"],
              }
              for point in points
          ]
          payload = {
              "evidence_level": "E2 pretrained exact-activation MLP heavy-hitter oracle",
              "points": points,
              "summary": summary,
              "promoted_fractions": [
                  point["requested_selected_fraction"] for point in promoted
              ],
              "best_budget_fraction": (
                  best_budget["requested_selected_fraction"]
                  if best_budget is not None else None
              ),
              "best_quality_fraction": best_quality["requested_selected_fraction"],
              "decision": decision,
              "next_candidate": next_candidate,
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "head_sha": os.environ["HEAD_SHA"],
                  "input_sha256": {
                      path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in files
                  },
              },
          }
          output = Path("results/tinyllama_1_1b_mlp_heavy_hitter_oracle.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          Path("mlp-heavy-hitter-comment.md").write_text(
              "## MLP heavy-hitter oracle gate\n\n```json\n"
              + json.dumps(
                  {
                      "summary": summary,
                      "promoted_fractions": payload["promoted_fractions"],
                      "best_budget_fraction": payload["best_budget_fraction"],
                      "best_quality_fraction": payload["best_quality_fraction"],
                      "decision": payload["decision"],
                      "next_candidate": payload["next_candidate"],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file mlp-heavy-hitter-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-mlp-heavy-hitter-oracle
          path: results/tinyllama_1_1b_mlp_heavy_hitter_oracle.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_mlp_heavy_hitter_oracle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(frontier): commit MLP heavy-hitter oracle"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
