name: bootstrap-exp-101a-source

on:
  push:
    branches:
      - research/exp-101a-public-fmm-frontier-oracle-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-exp101a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-source:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[exp101a-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Verify and extract frozen source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/exp101a_bundle.tar.gz
          echo "fc67f9627dc0e93ddf639918541e8d56ac916975a7f66594dc6d25c1bc489572  .bootstrap/exp101a_bundle.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('.bootstrap/exp101a_bundle.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall('.')
          print(f'extracted {len(members)} EXP-101A source members')
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-exp101a-source.yml
      - name: Install focused source-test runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 pytest==8.3.3
      - name: Validate materialized source
        run: |
          python -m pytest -q tests/exp_101a
          python -m py_compile \
            vortex_runtime/public_fmm_frontier_oracle.py \
            experiments/exp_101a/run_experiment.py \
            experiments/exp_101a/update_ledgers.py
      - name: Commit and push EXP-101A source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: preregister EXP-101A public FMM frontier oracle Gate"
          git push origin HEAD:${GITHUB_REF_NAME}
