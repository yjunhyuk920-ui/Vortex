name: Causal Q4 speculative tree gate

on:
  pull_request:
    paths:
      - "vortex_runtime/speculative_tree_gate.py"
      - "scripts/run_q4_speculative_tree_gate.py"
      - "tests/test_speculative_tree_gate.py"
      - "docs/EXPERIMENT_010_CAUSAL_Q4_SPECULATIVE_TREE.md"
      - ".github/workflows/causal-q4-speculative-tree.yml"

concurrency:
  group: causal-q4-tree-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/full-rank-progressive-precision'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - top_k: 8
            beam_width: 16
            node_budget: 256
            label: k8-b16
          - top_k: 16
            beam_width: 32
            node_budget: 512
            label: k16-b32
          - top_k: 32
            beam_width: 64
            node_budget: 1024
            label: k32-b64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate speculative-tree accounting
        run: python -m pytest -q tests/test_speculative_tree_gate.py
      - name: Measure ${{ matrix.label }}
        run: |
          python scripts/run_q4_speculative_tree_gate.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --bits 4 \
            --depth 12 \
            --top-k ${{ matrix.top_k }} \
            --beam-width ${{ matrix.beam_width }} \
            --node-budget ${{ matrix.node_budget }} \
            --eval-batch-size 8 \
            --row-chunk 128 \
            --host-to-device-gib-s 24 \
            --hot-effective-tops 160 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "q4-tree-${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: q4-tree-${{ matrix.label }}
          path: q4-tree-${{ matrix.label }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: q4-tree-*
          path: q4-tree-results
          merge-multiple: true
      - name: Aggregate causal tree gate
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path("q4-tree-results").glob("*.json"))
          if not files:
              raise SystemExit("no Q4 tree results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: (item["top_k"], item["beam_width"]))
          best = max(
              points,
              key=lambda item: (
                  item["optimistic_committed_exact_prefix"],
                  -item["retained_tree_nodes"],
              ),
          )
          survivors = [point for point in points if point["qualifies"]]
          lower_bound = best["405b_free_draft_q4_lower_bound"]
          payload = {
              "evidence_level": (
                  "E2 causal Q4 tree plus free-draft target-side lower bound"
              ),
              "points": points,
              "best_point": {
                  "top_k": best["top_k"],
                  "beam_width": best["beam_width"],
                  "node_budget": best["node_budget"],
                  "tree_nodes": best["retained_tree_nodes"],
                  "exact_prefix": best["optimistic_committed_exact_prefix"],
                  "last_alive_depth": best["exact_path_last_alive_depth"],
                  "minimum_commit_ideal": lower_bound[
                      "minimum_committed_tokens_ideal"
                  ],
                  "minimum_commit_serialized": lower_bound[
                      "minimum_committed_tokens_serialized"
                  ],
              },
              "surviving_lower_bound_points": len(survivors),
              "decision": (
                  "survive Q4 lower bound; require full Q6/Q8 exact verifier"
                  if survivors
                  else "reject tested causal Q4 tree at the target-side cost lower bound"
              ),
              "architecture_consequence": (
                  "Teacher-forced Q4/Q6 precision routing is not an executable "
                  "decode path unless a causal candidate mechanism closes this gate."
              ),
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "head_sha": os.environ["HEAD_SHA"],
                  "input_sha256": {
                      path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in files
                  },
              },
          }
          output = Path("results/tinyllama_1_1b_causal_q4_speculative_tree.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          Path("q4-tree-comment.md").write_text(
              "## Causal Q4 speculative-tree cost lower bound\n\n```json\n"
              + json.dumps(
                  {
                      "best_point": payload["best_point"],
                      "surviving_lower_bound_points": payload[
                          "surviving_lower_bound_points"
                      ],
                      "decision": payload["decision"],
                      "architecture_consequence": payload[
                          "architecture_consequence"
                      ],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish PR report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file q4-tree-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-causal-q4-speculative-tree
          path: results/tinyllama_1_1b_causal_q4_speculative_tree.json
      - name: Commit evidence when changed
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_causal_q4_speculative_tree.json
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo "Causal Q4 tree evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(gate): commit causal Q4 speculative-tree frontier"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
