name: exp-096a-residual-margin-certificate

on:
  push:
    branches:
      - research/exp-096a-residual-margin-certificate-gate
  pull_request:
    branches:
      - research/exp-095a-online-residual-affine-hull-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-096a-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  model-free-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime and HiGHS solver
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify runtime pins
        run: |
          python - <<'PY'
          import numpy, safetensors, scipy, torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert transformers.__version__ == "4.46.3", transformers.__version__
          assert safetensors.__version__ == "0.4.5", safetensors.__version__
          assert numpy.__version__ == "2.1.3", numpy.__version__
          assert scipy.__version__ == "1.14.1", scipy.__version__
          PY
      - name: Run direct-margin certificate controls
        run: python -m pytest -q tests/exp_096a
      - name: Syntax checks
        run: |
          python -m py_compile \
            vortex_runtime/residual_margin_certificate.py \
            experiments/exp_096a/run_experiment.py \
            experiments/exp_096a/update_ledgers.py

  public-checkpoint-gate:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[exp096a-results]') }}
    needs: model-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned official runtime and HiGHS solver
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Record host
        run: |
          mkdir -p results/exp_096a/${GITHUB_SHA}
          {
            uname -a
            lscpu
            free -b
            df -B1 .
            python --version
          } | tee results/exp_096a/${GITHUB_SHA}/host.txt
      - name: Execute official residual margin-certificate Gate
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_096a/run_experiment.py \
            --config experiments/exp_096a/config.json \
            --output-dir results/exp_096a/${GITHUB_SHA} \
            2>&1 | tee results/exp_096a/${GITHUB_SHA}/run.log
      - name: Update canonical research ledgers
        run: |
          python experiments/exp_096a/update_ledgers.py \
            --result results/exp_096a/${GITHUB_SHA}/result.json \
            --source-commit ${GITHUB_SHA}
      - name: Refresh checksums
        run: |
          cd results/exp_096a/${GITHUB_SHA}
          find . -type f ! -name checksums.sha256 -print0 | sort -z | \
            xargs -0 sha256sum > checksums.sha256
      - name: Upload immutable raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-096a-${{ github.sha }}
          path: results/exp_096a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and ledgers
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exp_096a/${GITHUB_SHA}/ \
            docs/research/EXP_096A_LATEST_RESULT.md \
            RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            FAILED_APPROACHES.md FAILED_APPROACHES_RECENT.md \
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md ARCHITECTURE.md \
            HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md
          if git diff --cached --quiet; then
            echo "No result delta"
            exit 0
          fi
          git commit -m "research: record EXP-096A residual margin-certificate Gate [exp096a-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Publish summary
        if: always()
        run: |
          if test -f results/exp_096a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path = Path("results/exp_096a") / os.environ["GITHUB_SHA"] / "result.json"
          result = json.loads(path.read_text())
          b = result["build_aggregate"]
          h = result["holdout_aggregate"]
          r = result["target_projection"]
          print("## EXP-096A residual direct-margin certificate")
          print(f"- decision: `{result['authoritative_decision']}`")
          print(f"- build certificates: `{b['certified_positions']} / {b['total_positions']}`")
          print(f"- holdout certificates: `{h['certified_positions']} / {h['total_positions']}`")
          print(f"- build infeasible cases: `{b['decisive_infeasible_cases']}`")
          print(f"- holdout infeasible cases: `{h['decisive_infeasible_cases']}`")
          print(f"- projected hot state: `{r['total_hot_gib']:.6f} GiB`")
          print(f"- score work fraction: `{r['scalar_work_fraction_of_405b']:.9%}`")
          PY
          fi
