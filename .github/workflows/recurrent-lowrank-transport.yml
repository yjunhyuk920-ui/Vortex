name: Recurrent low-rank transport gate

on:
  pull_request:
    paths:
      - "vortex_runtime/lowrank_transport.py"
      - "vortex_runtime/recurrent_lowrank_budget.py"
      - "scripts/run_recurrent_lowrank_transport_gate.py"
      - "tests/test_lowrank_transport.py"
      - "tests/test_recurrent_lowrank_budget.py"
      - "docs/EXPERIMENT_014_RECURRENT_LOWRANK_TRANSPORT.md"
      - ".github/workflows/recurrent-lowrank-transport.yml"

concurrency:
  group: recurrent-lowrank-transport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    if: github.head_ref == 'research/recurrent-lowrank-residual'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rank: [1, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest transformers sentencepiece
      - name: Validate resident residual primitives
        run: |
          python -m pytest -q \
            tests/test_diagonal_transport.py \
            tests/test_lowrank_transport.py \
            tests/test_recurrent_lowrank_budget.py \
            tests/test_recurrent_layer_dictionary.py \
            tests/test_speculative_tree_gate.py
      - name: Measure rank ${{ matrix.rank }}
        run: |
          python scripts/run_recurrent_lowrank_transport_gate.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --dictionary-bits 4 \
            --residual-bits 8 \
            --rank ${{ matrix.rank }} \
            --unique-layers 3 \
            --fit-iterations 2 \
            --oversample 2 \
            --power-iterations 0 \
            --seed 1234 \
            --tokens 32 \
            --tree-depth 12 \
            --top-k 32 \
            --beam-width 64 \
            --node-budget 1024 \
            --eval-batch-size 8 \
            --row-chunk 128 \
            --workspace-gib 1 \
            --memory-limit-gib 8 \
            --effective-tops 160 \
            --host-to-device-gib-s 24 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output "recurrent-lowrank-${{ matrix.rank }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: recurrent-lowrank-${{ matrix.rank }}
          path: recurrent-lowrank-${{ matrix.rank }}.json

  aggregate:
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: recurrent-lowrank-*
          path: recurrent-lowrank-results
          merge-multiple: true
      - name: Aggregate resident residual sweep
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path("recurrent-lowrank-results").glob("*.json"))
          if not files:
              raise SystemExit("no recurrent low-rank results")
          points = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          points.sort(key=lambda item: item["rank"])
          best = max(
              points,
              key=lambda item: (
                  item["tree"]["optimistic_committed_exact_prefix"],
                  item["teacher_forced_corrected"]["top1_rate"],
                  -item["rank"],
              ),
          )
          payload = {
              "evidence_level": (
                  "E2 resident recurrent Q4 plus diagonal and FP8 low-rank residuals"
              ),
              "points": points,
              "summary": [
                  {
                      "rank": point["rank"],
                      "total_gib": point["405b_projection"]["resident_budget"][
                          "total_gib"
                      ],
                      "representative_error": point["fit"][
                          "element_weighted_representative_error"
                      ],
                      "diagonal_error": point["fit"][
                          "element_weighted_diagonal_error"
                      ],
                      "corrected_error": point["fit"][
                          "element_weighted_corrected_error"
                      ],
                      "teacher_top1": point["teacher_forced_corrected"][
                          "top1_rate"
                      ],
                      "teacher_top32": point["teacher_forced_corrected"][
                          "top32_rate"
                      ],
                      "autoregressive_prefix": point[
                          "autoregressive_exact_prefix"
                      ],
                      "tree_prefix": point["tree"][
                          "optimistic_committed_exact_prefix"
                      ],
                      "last_alive_depth": point["tree"][
                          "exact_path_last_alive_depth"
                      ],
                  }
                  for point in points
              ],
              "best_rank": best["rank"],
              "next_rank": (
                  13
                  if best["tree"]["optimistic_committed_exact_prefix"] > 1
                  else None
              ),
              "decision": (
                  "advance best point to maximum feasible rank 13"
                  if best["tree"]["optimistic_committed_exact_prefix"] > 1
                  else "reject tested low-rank slope before rank-13 escalation"
              ),
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "head_sha": os.environ["HEAD_SHA"],
                  "input_sha256": {
                      path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in files
                  },
              },
          }
          output = Path("results/tinyllama_1_1b_recurrent_lowrank_transport.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          Path("recurrent-lowrank-comment.md").write_text(
              "## Recurrent low-rank transport gate\n\n```json\n"
              + json.dumps(
                  {
                      "summary": payload["summary"],
                      "best_rank": payload["best_rank"],
                      "next_rank": payload["next_rank"],
                      "decision": payload["decision"],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```",
              encoding="utf-8",
          )
          PY
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file recurrent-lowrank-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-recurrent-lowrank-transport
          path: results/tinyllama_1_1b_recurrent_lowrank_transport.json
      - name: Commit evidence
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_recurrent_lowrank_transport.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(gate): commit recurrent low-rank transport sweep"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
