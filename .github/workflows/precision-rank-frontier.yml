name: Precision rank frontier

on:
  pull_request:
    paths:
      - "vortex_runtime/capsule_quantization.py"
      - "vortex_runtime/rank_frontier.py"
      - "scripts/run_hot_candidate_coverage.py"
      - "scripts/run_precision_rank_frontier.py"
      - "tests/test_capsule_quantization.py"
      - "tests/test_precision_rank_frontier.py"
      - "tests/test_rank_frontier.py"
      - ".github/workflows/precision-rank-frontier.yml"

concurrency:
  group: precision-rank-frontier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  tinyllama-precision-rank:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feat/architecture-gate0-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Check direct precision frontier changes
        id: changes
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            vortex_runtime/capsule_quantization.py \
            vortex_runtime/rank_frontier.py \
            scripts/run_hot_candidate_coverage.py \
            scripts/run_precision_rank_frontier.py \
            tests/test_capsule_quantization.py \
            tests/test_precision_rank_frontier.py \
            tests/test_rank_frontier.py \
            .github/workflows/precision-rank-frontier.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Measure quantized precision-rank frontier
        if: steps.changes.outputs.run == 'true'
        run: |
          python scripts/run_precision_rank_frontier.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --build-new-tokens 1 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output precision_rank_frontier.json
      - name: Normalize evidence with provenance
        if: steps.changes.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("precision_rank_frontier.json")
          raw_bytes = raw.read_bytes()
          payload = json.loads(raw_bytes)
          payload["workflow"] = {
              "run_id": int(os.environ["RUN_ID"]),
              "head_sha": os.environ["HEAD_SHA"],
              "raw_file_sha256": hashlib.sha256(raw_bytes).hexdigest(),
          }
          output = Path("results/tinyllama_1_1b_precision_rank_frontier.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          PY
      - name: Build PR report
        if: steps.changes.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("precision_rank_frontier.json").read_text())
          rows = [
              {
                  "rank": point["rank"],
                  "bits": point["capsule_bits"],
                  "memory_gib": point["budget"]["memory_gib"],
                  "traffic_gib": point["budget"][
                      "hot_traffic_gib_per_token"
                  ],
                  "hot_gflop": point["budget"][
                      "hot_compute_gflop_per_token"
                  ],
                  "top1": point["exact_top1_match_rate"],
                  "top32": point["coverage_at_k"]["32"],
                  "mean_exact_rank": point["rank_statistics"]["mean"],
                  "max_quant_error": point["quantization"][
                      "maximum_relative_l2_error"
                  ],
                  "survives": point["qualifies_for_multi_hypothesis"],
              }
              for point in data["points"]
          ]
          body = (
              "## Quantized precision-rank frontier\n\n"
              "```json\n"
              + json.dumps(
                  {
                      "precision_maxima": data[
                          "precision_aligned_maximum_ranks"
                      ],
                      "points": rows,
                      "decision": data["decision"],
                      "next_candidate": data["next_candidate"],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```"
          )
          Path("precision-frontier-comment.md").write_text(
              body,
              encoding="utf-8",
          )
          PY
      - name: Publish PR report
        if: steps.changes.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file precision-frontier-comment.md
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.run == 'true'
        with:
          name: tinyllama-precision-rank-frontier
          path: precision_rank_frontier.json
      - name: Commit evidence when changed
        if: steps.changes.outputs.run == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          path=results/tinyllama_1_1b_precision_rank_frontier.json
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            echo "Precision frontier evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data(frontier): commit quantized precision-rank sweep"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
