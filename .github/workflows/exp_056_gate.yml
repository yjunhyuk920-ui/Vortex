name: EXP-056 prototype sparse-residual Gate

on:
  pull_request:
    paths:
      - "vortex_runtime/prototype_residual.py"
      - "tests/exp_056/**"
      - "experiments/exp_056/**"
      - "scripts/finalize_exp_056.py"
      - ".github/workflows/exp_056_gate.yml"
  workflow_dispatch:

concurrency:
  group: exp-056-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.50.3 huggingface_hub==0.29.3 safetensors==0.5.3 tokenizers==0.21.1
      - name: Run EXP-056 reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP056_OUTPUT_DIR: ${{ runner.temp }}/exp_056_candidate
        run: bash experiments/exp_056/reproduce.sh
      - name: Upload EXP-056 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-056-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_056_candidate
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/exp-056-prototype-sparse-residual'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-056-prototype-sparse-residual
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository validation environment
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5
      - name: Download authority and finalize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf results/exp_056 "${RUNNER_TEMP}/exp056"
          mkdir -p results/exp_056 "${RUNNER_TEMP}/exp056"
          gh run download 30823042599 \
            --repo "${GITHUB_REPOSITORY}" \
            --name exp-056-candidate-30823042599 \
            --dir "${RUNNER_TEMP}/exp056"
          cp -a "${RUNNER_TEMP}/exp056/." results/exp_056/
          python scripts/finalize_exp_056.py
          (cd results/exp_056 && sha256sum -c checksums.sha256)
          python -m pytest -q tests/exp_056/test_prototype_residual.py
          python scripts/run_validation.py
      - name: Commit frozen evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_056 RESEARCH_STATE.md DECISION_LOG.md FAILED_APPROACHES.md NEXT_EXPERIMENT.md docs/research/EXPERIMENT_056_PROTOTYPE_SPARSE_RESIDUAL.md
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "research(exp056): freeze evidence and register EXP-057"
          git push origin HEAD:research/exp-056-prototype-sparse-residual
