name: EXP-047R manual reproduction

on:
  workflow_dispatch:

concurrency:
  group: exp-047r-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 \
            huggingface_hub==0.29.3 \
            safetensors==0.5.3 \
            tokenizers==0.21.1
          python -m pip freeze | sort | tee exp047r-pip-freeze.txt

      - name: Run primitive tests and repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q tests/exp_047r
          python scripts/run_validation.py

      - name: Reproduce into isolated output
        env:
          PYTHONPATH: ${{ github.workspace }}
          HF_HOME: ${{ runner.temp }}/hf-exp047r
          TOKENIZERS_PARALLELISM: "false"
          EXP047R_OUTPUT: ${{ github.workspace }}/results/exp_047r_reproduction
        run: |
          set -euo pipefail
          rm -rf results/exp_047r_reproduction
          bash experiments/exp_047r/run_current_env.sh 2>&1 | tee exp047r-workflow.log

      - name: Validate claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results/exp_047r_reproduction")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["experiment"] == "EXP-047R"
          assert summary["evidence_level"] == "E1"
          assert summary["phase_c_operation_replacement"] is False
          assert summary["phase_d_status"] == "NOT TESTED"
          assert summary["future_information_used"] is False
          assert summary["MEASURED"]["model_count"] == 3
          assert summary["MEASURED"]["case_count"] == 18
          assert summary["MEASURED"]["wrong_accepts"] == 0
          assert summary["MEASURED"]["bound_violations"] == 0
          assert summary["gate"]["decision"] == "REJECT_RANGE_BASED_CPTC_CORE_RETAIN_CERTIFICATE_AUXILIARY"
          assert Path("results/exp_047r/summary.json").is_file()
          print(json.dumps(summary["gate"], indent=2, sort_keys=True))
          PY

      - name: Upload reproduction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-047r-reproduction-${{ github.run_id }}
          path: |
            results/exp_047r_reproduction
            exp047r-workflow.log
            exp047r-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
