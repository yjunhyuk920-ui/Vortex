name: Freeze EXP-053 authoritative evidence

on:
  push:
    paths:
      - ".github/workflows/freeze_exp_053_evidence.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: freeze-exp-053-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    if: github.ref == 'refs/heads/research/exp-053-bit-exact-decision-circuit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/exp-053-bit-exact-decision-circuit
          fetch-depth: 0

      - name: Download and verify authoritative artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=8856213147
          EXPECTED_SHA=eb7ecf8f284cc974d62e03bee767892666160abfae79a70bb32446f0dfe95178
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/exp053.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          echo "${EXPECTED_SHA}  /tmp/exp053.zip" | sha256sum -c -
          rm -rf /tmp/exp053-artifact
          mkdir -p /tmp/exp053-artifact
          unzip -q /tmp/exp053.zip -d /tmp/exp053-artifact
          test -f /tmp/exp053-artifact/results/exp_053_candidate/summary.json
          test -f /tmp/exp053-artifact/results/exp_053_candidate/raw/cases.jsonl
          test -f /tmp/exp053-artifact/results/exp_053_candidate/raw/circuit_manifest.json
          (
            cd /tmp/exp053-artifact/results/exp_053_candidate
            sha256sum -c checksums.sha256
          )

      - name: Install frozen evidence with provenance
        run: |
          set -euo pipefail
          rm -rf results/exp_053
          cp -a /tmp/exp053-artifact/results/exp_053_candidate results/exp_053
          mkdir -p results/exp_053/raw results/exp_053/artifacts results/exp_053/logs
          cp results/exp_053/summary.json results/exp_053/raw/workflow_summary.json
          cp results/exp_053/checksums.sha256 results/exp_053/artifacts/workflow_checksums.sha256
          cp /tmp/exp053-artifact/exp053-workflow.log results/exp_053/logs/workflow.log
          cp /tmp/exp053-artifact/exp053-pip-freeze.txt results/exp_053/artifacts/pip_freeze.txt
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results/exp_053")
          provenance = {
              "workflow_run": "30814648709",
              "source_head_sha": "325cc694d4b2e88e34dba5ba8e980e3970c34c66",
              "workflow_merge_sha": "4ecca6405f549fc9a05d7ad17cfe1d7c3a9c3398",
              "artifact_id": 8856213147,
              "artifact_name": "exp-053-candidate-30814648709",
              "artifact_size_bytes": 232998,
              "artifact_zip_sha256": "eb7ecf8f284cc974d62e03bee767892666160abfae79a70bb32446f0dfe95178",
              "frozen_date": "2026-08-03",
          }
          (root / "raw" / "artifact_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          summary_path = root / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          summary.setdefault("provenance", {}).update(provenance)
          summary.setdefault("raw_evidence", {}).update(
              {
                  "artifact_provenance": "raw/artifact_provenance.json",
                  "workflow_summary": "raw/workflow_summary.json",
                  "workflow_checksums": "artifacts/workflow_checksums.sha256",
              }
          )
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd results/exp_053
            find . -type f ! -name checksums.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' > checksums.sha256
            sha256sum -c checksums.sha256
          )

      - name: Commit frozen evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_053
          if git diff --cached --quiet; then
            echo "EXP-053 evidence already frozen"
            exit 0
          fi
          git commit -m "results(exp053): freeze authoritative circuit evidence"
          git push origin HEAD:research/exp-053-bit-exact-decision-circuit
