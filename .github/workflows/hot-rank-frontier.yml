name: Hot rank frontier

on:
  pull_request:
    paths:
      - "vortex_runtime/rank_frontier.py"
      - "scripts/run_hot_rank_frontier.py"
      - "scripts/run_hot_candidate_coverage.py"
      - "tests/test_rank_frontier.py"
      - ".github/workflows/hot-rank-frontier.yml"

concurrency:
  group: hot-rank-frontier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  tinyllama-rank-frontier:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feat/architecture-gate0-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install transformers sentencepiece
      - name: Measure 405B-feasible rank frontier
        run: |
          python scripts/run_hot_rank_frontier.py \
            --model TinyLlama/TinyLlama-1.1B-Chat-v1.0 \
            --device cpu \
            --tokens 32 \
            --build-new-tokens 1 \
            --eval-prompt "한국어로 정렬 알고리즘의 시간 복잡도를 설명해줘." \
            --output hot_rank_frontier.json
      - name: Normalize evidence with provenance
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("hot_rank_frontier.json")
          raw_bytes = raw.read_bytes()
          payload = json.loads(raw_bytes)
          payload["workflow"] = {
              "run_id": int(os.environ["RUN_ID"]),
              "head_sha": os.environ["HEAD_SHA"],
              "raw_file_sha256": hashlib.sha256(raw_bytes).hexdigest(),
          }
          output = Path("results/tinyllama_1_1b_hot_rank_frontier.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          PY
      - name: Build PR report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("hot_rank_frontier.json").read_text())
          rows = [
              {
                  "rank": point["rank"],
                  "memory_gib": point["budget"]["memory_gib"],
                  "hot_traffic_gib": point["budget"][
                      "hot_traffic_gib_per_token"
                  ],
                  "hot_gflop": point["budget"]["hot_compute_gflop_per_token"],
                  "top1": point["exact_top1_match_rate"],
                  "top32": point["coverage_at_k"]["32"],
                  "mean_exact_rank": point["rank_statistics"]["mean"],
                  "survives": point["qualifies_for_multi_hypothesis"],
              }
              for point in data["points"]
          ]
          body = (
              "## Hot rank frontier\n\n"
              "```json\n"
              + json.dumps(
                  {
                      "maximum_feasible_rank": data[
                          "fixed_405b_aligned_maximum_rank"
                      ],
                      "binding_budget": data["binding_budget"],
                      "points": rows,
                      "decision": data["decision"],
                      "next_candidate": data["next_candidate"],
                  },
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n```"
          )
          Path("rank-frontier-comment.md").write_text(body, encoding="utf-8")
          PY
      - name: Publish PR report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file rank-frontier-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinyllama-hot-rank-frontier
          path: hot_rank_frontier.json
      - name: Commit evidence when changed
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- results/tinyllama_1_1b_hot_rank_frontier.json)" ]; then
            echo "Rank frontier evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tinyllama_1_1b_hot_rank_frontier.json
          git commit -m "data(frontier): commit feasible-rank coverage sweep"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
