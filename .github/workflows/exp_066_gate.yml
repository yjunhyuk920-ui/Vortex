name: EXP-066 real-Q4 TT MPO bond-rank Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/exp_066_gate.yml"
      - "docs/research/EXPERIMENT_066_TT_MPO_BOND_RANK.md"
      - "experiments/exp_066/**"
      - "tests/exp_066/**"
      - "vortex_runtime/tensor_train_rank.py"
      - "vortex_runtime/tt_kronecker_reuse.py"
      - "results/exp_065/**"

concurrency:
  group: exp-066-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
      - name: Run EXP-066 frozen-evidence reproduction
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXP066_OUTPUT_DIR: ${{ runner.temp }}/exp_066_candidate
        run: bash experiments/exp_066/reproduce.sh
      - name: Upload EXP-066 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-066-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/exp_066_candidate
          if-no-files-found: error
          retention-days: 30
