name: exp-102a-reality-first-causal-block

on:
  push:
    branches:
      - research/exp-102a-causal-segment-delta-reality-gate
  pull_request:
    branches:
      - research/exp-100a-explicit-rectangular-fmm-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp-102a-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned focused runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Verify reality-first contract and pure reference
        run: |
          python -m pytest -q tests/exp_102a
          python -m py_compile \
            vortex_runtime/reality_first_speculative.py \
            experiments/exp_102a/run_experiment.py \
            experiments/exp_102a/update_ledgers.py \
            experiments/exp_102a/bootstrap_governance.py
          python - <<'PY'
          import json
          from experiments.exp_102a.run_experiment import validate_config
          c=json.load(open('experiments/exp_102a/config.json'))
          validate_config(c)
          assert c['authoritative_arm']=='REAL_EXECUTOR_ONLY'
          assert c['target_contract']['raw_p50_fraction']==0.011851851851851851
          assert 'future_target_tokens' in c['forbidden_grants']
          assert c['block_lengths']==[96]
          print('EXP-102A reality-first contract: PASS')
          PY

  public-checkpoint-gate:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[exp102a-results]') }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install pinned model runtime
        run: python -m pip install --disable-pip-version-check -r requirements/fixed-public-dynamic-executor.txt
      - name: Materialize reality-first governance in the clean checkout
        run: python experiments/exp_102a/bootstrap_governance.py
      - name: Record host
        run: |
          mkdir -p results/exp_102a/${GITHUB_SHA}
          { uname -a; lscpu; free -b; df -B1 .; python --version; } | tee results/exp_102a/${GITHUB_SHA}/host.txt
      - name: Execute real causal draft and exact target verification
        shell: bash
        run: |
          set -o pipefail
          python experiments/exp_102a/run_experiment.py \
            --config experiments/exp_102a/config.json \
            --output-dir results/exp_102a/${GITHUB_SHA} \
            2>&1 | tee results/exp_102a/${GITHUB_SHA}/run.log
      - name: Update canonical ledgers
        run: |
          python experiments/exp_102a/update_ledgers.py \
            --result results/exp_102a/${GITHUB_SHA}/result.json \
            --source-commit ${GITHUB_SHA}
      - name: Refresh checksums
        run: |
          cd results/exp_102a/${GITHUB_SHA}
          find . -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > checksums.sha256
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-102a-${{ github.sha }}
          path: results/exp_102a/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit result and handoff
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/exp_102a/${GITHUB_SHA}/ \
            docs/research/EXP_102A_LATEST_RESULT.md \
            docs/research/REALITY_FIRST_EXECUTION_CONTRACT.md \
            MISSION_AND_WORKING_PRINCIPLES.md AGENTS.md CREATIVE_RESEARCH_MANDATE.md \
            docs/REPOSITORY_COMMIT_AND_HANDOFF_MANDATE.md \
            README.md RESEARCH_STATE.md NEXT_EXPERIMENT.md DECISION_LOG.md \
            FAILED_APPROACHES.md FAILED_APPROACHES_RECENT.md \
            ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md ARCHITECTURE.md \
            HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md \
            docs/research/VORTEX_RESEARCH_HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record EXP-102A reality-first causal block Gate [exp102a-results] [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Summary
        if: always()
        run: |
          if test -f results/exp_102a/${GITHUB_SHA}/result.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r=json.loads((Path('results/exp_102a')/os.environ['GITHUB_SHA']/'result.json').read_text())
          print('## EXP-102A reality-first causal block')
          print(f"- decision: `{r['authoritative_decision']}`")
          for name, arm in r['arms'].items():
              g=arm['holdout_gate']
              print(f"- {name}: K=`{arm['selected_block_length_from_build_only']}`, min A=`{g['minimum_committed_tokens']}`, p50/p95 latency=`{g['latency_ratio_p50']:.6f}/{g['latency_ratio_p95']:.6f}`, p95 N/A=`{g['candidate_ratio_p95']:.6f}`, exact=`{g['exact_token_and_state']}`, pass=`{g['gate_passed']}`")
          print(f"- integrity failures: `{r['integrity_failures']}`")
          PY
          fi
