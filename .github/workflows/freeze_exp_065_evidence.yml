name: Freeze EXP-065 authority

on:
  push:
    branches:
      - research/exp-065-real-q4-kronecker-rank
    paths:
      - "scripts/finalize_exp_065.py"
      - ".github/workflows/freeze_exp_065_evidence.yml"
  workflow_dispatch:

concurrency:
  group: freeze-exp-065-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp-065-real-q4-kronecker-rank
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check safetensors==0.5.3
      - name: Download authority and finalize
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf results/exp_065 "${RUNNER_TEMP}/exp065"
          mkdir -p results/exp_065 "${RUNNER_TEMP}/exp065"
          gh run download 30870558294 \
            --repo "${GITHUB_REPOSITORY}" \
            --name exp-065-candidate-30870558294 \
            --dir "${RUNNER_TEMP}/exp065"
          cp -a "${RUNNER_TEMP}/exp065/." results/exp_065/
          python scripts/finalize_exp_065.py
          (cd results/exp_065 && sha256sum -c checksums.sha256)
          python -m pytest -q tests/exp_065/test_kronecker_rank.py
          python scripts/run_validation.py
      - name: Commit frozen evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exp_065 RESEARCH_STATE.md DECISION_LOG.md FAILED_APPROACHES.md NEXT_EXPERIMENT.md ASSUMPTION_REGISTER.md VALIDATION_MATRIX.md ARCHITECTURE.md HARDWARE_VALIDATION_PLAN.md REPRODUCIBILITY.md docs/research/EXPERIMENT_065_KRONECKER_RANK.md
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "research(exp065): freeze evidence and register EXP-066"
          git push origin HEAD:research/exp-065-real-q4-kronecker-rank
