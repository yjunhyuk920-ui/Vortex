name: EXP-077A fractal MLP oracle contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/exp_077a_gate.yml"
      - "docs/research/EXPERIMENT_077A_ORACLE_FRACTAL_MLP_GATE.md"
      - "experiments/exp_077a/**"
      - "tests/exp_077a/**"
      - "vortex_runtime/fractal_oracle.py"

concurrency:
  group: exp-077a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preregistered-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Validate fractal oracle accounting and quality contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_077a
      - name: Confirm no checkpoint payload is tracked
        run: |
          if git ls-files '*.safetensors' '*.bin' '*.pt' '*.pth' | grep -q .; then
            echo 'Tracked model payload is forbidden' >&2
            exit 1
          fi
