name: EXP-049 Anderson continuous fixed-point Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vortex_runtime/fixed_point.py"
      - "vortex_runtime/block_verify.py"
      - "tests/exp_049/**"
      - "experiments/exp_049/**"
      - "docs/research/EXPERIMENT_049_ANDERSON_CONTINUOUS_FIXED_POINT.md"
      - ".github/workflows/exp_049_gate.yml"
      - "NEXT_EXPERIMENT.md"

concurrency:
  group: exp-049-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-point-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify mandatory files
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            RESEARCH_STATE.md
            FAILED_APPROACHES.md
            DECISION_LOG.md
            ASSUMPTION_REGISTER.md
            VALIDATION_MATRIX.md
            NEXT_EXPERIMENT.md
            ARCHITECTURE.md
            HARDWARE_VALIDATION_PLAN.md
            REPRODUCIBILITY.md
            docs/PROOF_FIRST_CONTRACT.md
            docs/WORK_SESSION_PROTOCOL.md
            docs/research/EXPERIMENT_049_ANDERSON_CONTINUOUS_FIXED_POINT.md
            vortex_runtime/block_verify.py
            vortex_runtime/fixed_point.py
            tests/exp_049/test_fixed_point.py
            experiments/exp_049/config.json
            experiments/exp_049/run_experiment.py
            experiments/exp_049/run_current_env.sh
            experiments/exp_049/reproduce.sh
            experiments/exp_049/future_gpu_run.sh
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done

      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 numpy==2.1.3
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0
          python -m pip install --disable-pip-version-check \
            transformers==4.50.3 \
            huggingface_hub==0.29.3 \
            safetensors==0.5.3 \
            tokenizers==0.21.1
          python -m pip freeze | sort | tee exp049-pip-freeze.txt

      - name: Run EXP-049 solver and lower-bound tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/exp_049

      - name: Run repository validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_validation.py

      - name: Run pinned real-checkpoint Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          HF_HOME: ${{ runner.temp }}/hf-exp049
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          rm -rf results/exp_049_candidate
          bash experiments/exp_049/run_current_env.sh 2>&1 | tee exp049-workflow.log

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("results/exp_049_candidate")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["experiment"] == "EXP-049"
          assert summary["evidence_level"] == "E1"
          assert summary["complete_real_operation_replacement"] is False
          assert summary["phase_d_status"] == "NOT TESTED"
          measured = summary["MEASURED"]
          assert measured["model_count"] == 3
          assert measured["case_count"] == 18
          assert measured["prompt_family_count"] == 6
          assert measured["selected_exact_output_mismatches"] == 0
          assert measured["selected_deployable_future_information_uses"] == 0
          assert measured["unhandled_numerical_failures"] == 0
          assert measured["s3_oracle_exact_failures"] == 0
          assert isinstance(measured["triangular_one_position_per_round_barrier_observed"], bool)
          assert isinstance(measured["triangular_transcript_indistinguishability_observed"], bool)
          assert math.isfinite(measured["oracle_best_s1s2_p50_matching_prefix"])
          assert math.isfinite(measured["oracle_best_s1s2_p90_target_equivalent_stream_fraction"])
          assert summary["DERIVED"]["variant_selection_uses_reference"] is True
          assert summary["DERIVED"]["decision"] in {
              "CONTINUE_TARGET_ONLY_CONTINUOUS_FIXED_POINT_TO_COMPLETE_PHASE_C",
              "REJECT_TARGET_ONLY_CONTINUOUS_FIXED_POINT_CORE_RETAIN_SOLVER_AND_VERIFIER_AUXILIARY",
          }
          assert (root / "raw" / "cases.jsonl").is_file()
          assert (root / "raw" / "checkpoint_manifest.json").is_file()
          assert (root / "raw" / "triangular_audit.json").is_file()
          assert (root / "checksums.sha256").is_file()
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-049-candidate-${{ github.run_id }}
          path: |
            results/exp_049_candidate
            exp049-workflow.log
            exp049-pip-freeze.txt
          if-no-files-found: warn
          retention-days: 30
